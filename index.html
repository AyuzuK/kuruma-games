<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホやタブレットでもちょうどいい大きさで表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>はたらくくるま</title>

  <style>
    /* ===== 画面全体 ===== */
    html, body {
      touch-action: none;            /* 2本指の拡大・ダブルタップ拡大・スクロールを止める */
      overscroll-behavior: none;     /* 画面のはしを引っぱったときの「びよーん」を止める */
    }

    body {
      margin: 0;
      height: 100vh;                 /* 古いブラウザ用 */
      height: 100dvh;
      overflow: hidden;
      background: #bfe9ff;           /* 空の色（ゲームと同じ） */
      font-family: system-ui, sans-serif; /* 端末に入っている書体だけを使う */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;

      /* ボタンを画面のまん中に置く */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    /* 上の題名（大人向け。子どもは絵で選ぶ） */
    .title {
      margin: 0;
      font-size: clamp(22px, 6vw, 34px);
      font-weight: bold;
      color: #333;
    }

    /* ===== ゲームを選ぶボタン =====
       おもちゃのブロックのように、下に濃い影を付けて「押せそう」に見せる */
    .game-button {
      position: relative;
      display: block;
      width: 300px;
      height: 240px;
      border: 6px solid #333;
      border-radius: 32px;
      /* ボタンの中の空（ゲームの空と同じ、上が濃く下がうすいグラデーション） */
      background: linear-gradient(#8ccbf0 0%, #d8f0ff 100%);
      box-shadow: 0 10px 0 #333;     /* 下の影 */
      overflow: hidden;
      animation: purupuru 1.2s ease-in-out infinite; /* ゆっくり揺れて「さわってね」と伝える */
    }

    /* ボタンの中の地面（ゲームと同じ色の土）。
       上のふちのすぐ下を少し濃くして、ゲームの地面と同じ見え方にする */
    .game-button .ground {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 50px;
      background: linear-gradient(#b07c51 0, #b07c51 5px, #c48d5c 5px);
    }
    /* 土の上の草地（ゲームの手前の草地と同じ黄緑。下のふちは少し濃い緑） */
    .game-button .ground::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 100%;                  /* 土のすぐ上に置く */
      height: 16px;
      background: linear-gradient(#a8d465 0, #a8d465 12px, #86bd52 12px);
    }

    /* 押したときに、影の分だけ沈む */
    .game-button.pressed {
      transform: translateY(8px);
      box-shadow: 0 2px 0 #333;
      animation: none;
    }

    @keyframes purupuru {
      0%, 100% { transform: translateY(0)    rotate(0deg); }
      25%      { transform: translateY(-4px) rotate(-1deg); }
      75%      { transform: translateY(-4px) rotate(1deg); }
    }

    /* 動きを減らす設定にしている端末では、揺らさない */
    @media (prefers-reduced-motion: reduce) {
      .game-button { animation: none; }
    }

    /* ===== ボタンの中のショベルカー（ゲームの絵を、そのまま 0.8 倍にして置く） =====
       ゲームの絵は 横300 × 縦220。0.8 倍で 横240 × 縦176 になる。
       横：絵の中で色がある部分（x 2〜295 くらい）が、ボタンのまん中にくるように、左から 30px。
       縦：キャタピラの下（絵の y 215）が、土の上のふち（ボタンの下から 50px）より
           6px だけ下にくるようにして、地面に乗って見せる。
           そのため、絵の下はしは、ボタンの下から 40px（= 50 − 6 − 5×0.8 ≒ 40）。
       このとき、アームのいちばん上はボタンの上から 27px くらい、バケットの右はしは
       左から 265px くらい（ボタンの中は 300px）なので、丸い角にもかからない */
    .shovel-svg {
      position: absolute;
      left: 34px;
      bottom: 36px;
      width: 228px;                  /* ゲームの絵の 0.76 倍（アームの上にゆとりを作る） */
      height: 167px;
      display: block;
      overflow: visible;             /* アームの先は絵の枠より少し上に出るので、切らずに見せる */
    }

    /* ===== ボタンを6つ並べる =====
       並べ方は4つ（縦1列 col／横1列 row／2列 grid／3列 grid3）。どれにするかは、下の JavaScript が
       画面の大きさから「いちばん大きく見える並べ方」を選んで、この箱の data-layout に書く
       （ボタンのあいだは どれも 24px）。
       6つ並べて入らないときは、6つとも同じ率（--k、0.3〜1）で縮める。率も JavaScript が入れる。
       ボタンそのものの大きさ・ゆれ・沈み方は変えずに、外がわの箱（.slot-inner）を縮める */
    .games {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    .games[data-layout="col"] {
      display: flex;
      flex-direction: column;
    }
    .games[data-layout="row"] {
      display: flex;
      flex-direction: row;
    }
    /* 2列・3列：折り返して並べ、最後の段（あまった1〜2つ）は まん中に寄せる。
       箱の横はばは、JavaScript が「列の数 × ボタンの場所 ＋ あいだ」に書く（列の数で折り返すため） */
    .games[data-layout="grid"],
    .games[data-layout="grid3"] {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    /* 1つぶんの場所。ボタン（ふちをふくめて 312 × 252）＋下の影 10px＋ゆれて上がる 4px ＋ゆとり 2px。
       そのうえ、ボタンの下に「名前の帯」（高さ 36px ＝ 上のあき 4 ＋ 2行 × 16）をとる。
       名前の帯は縮めない（率 --k が小さくても、文字が読める大きさのまま）。1行で足りるときも 2行ぶんの高さをとる */
    .slot {
      position: relative;
      flex: none;
      width: calc(312px * var(--k, 1));
      height: calc(268px * var(--k, 1) + 36px);
    }
    /* ゲームの名前（大人のための小さな文字。子どもは絵で選ぶ）。ボタンの下。ゆれない。
       横はばはボタンより左右 8px ずつ広い（ボタンのあいだの 24px のうち 8px ずつ使う）。
       かたまり（.game-name span）の中では折り返さず、かたまりのあいだだけで次の行へ */
    .game-name {
      position: absolute;
      left: -8px;
      top: calc(268px * var(--k, 1) + 4px);
      width: calc(312px * var(--k, 1) + 16px);
      font-size: 13px;
      font-weight: bold;
      line-height: 16px;
      color: #333;
      text-align: center;
      cursor: pointer;
    }
    .game-name span {
      white-space: nowrap;
    }
    .slot-inner {
      position: absolute;
      left: 0;
      top: 0;
      width: 312px;
      height: 268px;
      padding-top: 4px;
      box-sizing: border-box;
      transform: scale(var(--k, 1));
      transform-origin: 0 0;
    }

    /* ===== 2本目「はたらくくるま しゅっぱつ！」のボタン =====
       作りは1本目のボタンと同じ。ふちと下の影の色だけ、ミキサーしゃのオレンジにして見分けやすくする */
    .game-button.mixer-button {
      border-color: #f39a3d;
      box-shadow: 0 10px 0 #c46f1c;
      animation-delay: -0.6s;        /* 1本目のボタンと、ゆれる向きを少しずらす */
    }
    .game-button.mixer-button.pressed {
      box-shadow: 0 2px 0 #c46f1c;
    }
    /* ボタンの中の道（ゲームと同じ、やさしい灰色。上のふちに明るい線） */
    .game-button .road {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 50px;
      background: linear-gradient(#d3d6db 0, #d3d6db 5px, #b9bcc2 5px);
    }
    /* 道の上の草地（ゲームの草地と同じ黄緑） */
    .game-button .road::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 100%;
      height: 16px;
      background: linear-gradient(#a8d465 0, #a8d465 12px, #86bd52 12px);
    }
    /* ボタンの中のミキサーしゃ（ゲームの絵を写したもの。横300 × 縦220 を 0.76 倍）。
       タイヤの下（絵の y 215）が、道の上のふちより少し下にくるように置く */
    .mixer-svg {
      position: absolute;
      left: 36px;
      bottom: 36px;
      width: 228px;
      height: 167px;
      display: block;
    }

    /* ===== 3本目「このくるまなーんだ？」のボタン =====
       作りは1本目・2本目のボタンと同じ。ふちと下の影の色だけ、こい あい色にして見分けやすくする */
    .game-button.kage-button {
      border-color: #4a62a8;
      box-shadow: 0 10px 0 #2f437e;
      animation-delay: -0.3s;        /* 1本目・2本目のボタンと、ゆれる向きを少しずらす */
    }
    .game-button.kage-button.pressed {
      box-shadow: 0 2px 0 #2f437e;
    }
    /* かげのうしろの光の丸（うすいクリーム色。ふちが やわらかく消える）。下の部分は、草と道にかくれる */
    .kage-spot {
      position: absolute;
      left: 31px;
      top: 44px;
      width: 160px;
      height: 144px;
      background: radial-gradient(closest-side,
        rgba(255, 245, 220, 0.95) 0%, rgba(255, 245, 220, 0.95) 78%, rgba(255, 245, 220, 0) 100%);
    }
    /* かげの台（草の帯の中にのる）。右は ボタンの外までのびて、ボタンの角で切れる（ゲームと同じ長い台） */
    .kage-dai {
      position: absolute;
      left: 15px;
      top: 175px;
      width: 300px;
      height: 8px;
      box-sizing: border-box;
      border: 2px solid #5a3d1e;
      border-radius: 4px;
      background: #a9aeb6;
      box-shadow: inset 0 1px 0 #c9cdd3, inset 0 -1px 0 #8a8f96;
    }
    /* しょうぼうしゃの絵（ゲームの図鑑の絵を写したもの。横310 × 縦220 を 0.6倍） */
    .kage-svg {
      position: absolute;
      width: 186px;
      height: 132px;
      display: block;
    }
    .kage-svg.back  { left: 18px;  top: 46px; }    /* かげ（タイヤの下 y 129 → ボタンの y 175 ＝ 台の上の面） */
    .kage-svg.front { left: 100px; top: 80px; }    /* 色つき（タイヤの下 y 209 ＝ 道の中） */
    /* かげ：すべての色を1色（こい灰青）にする（ゲームと同じ。fill を持たない部品が黒にならないように、本体にも指定） */
    .kage-mini { fill: #3a3f4b; }
    .kage-mini [fill]:not([fill="none"]) { fill: #3a3f4b; }
    .kage-mini [stroke]:not([stroke="none"]) { stroke: #3a3f4b; }

    /* ===== 4本目「しゅつどう！ どの くるま？」のボタン =====
       作りは1〜3本目のボタンと同じ。ふちと下の影の色だけ、あかるい赤にして見分けやすくする */
    .game-button.shutsudou-button {
      border-color: #e0605a;
      box-shadow: 0 10px 0 #a8403b;
      animation-delay: -0.9s;        /* 1〜3本目のボタンと、ゆれる向きを少しずらす */
    }
    .game-button.shutsudou-button.pressed {
      box-shadow: 0 2px 0 #a8403b;
    }
    /* 場面の絵（高い木の ねこを、しょうぼうしゃが助けるところ。ゲームの場面を単純にして写したもの）。
       座標の枠は 横300 × 縦240（ボタンの中と同じ大きさ）。id は使わない */
    .shutsudou-svg {
      position: absolute;
      left: 0;
      top: 0;
      width: 300px;
      height: 240px;
      display: block;
    }

    /* ===== 5本目「たりない ぶひんは どれ？」のボタン =====
       作りは1〜4本目のボタンと同じ。ふちと下の影の色だけ、みどり色にして見分けやすくする */
    .game-button.buhin-button {
      border-color: #3fa66a;
      box-shadow: 0 10px 0 #2a7a4c;
      animation-delay: -1.1s;        /* 1〜4本目のボタンと、ゆれる向きを少しずらす */
    }
    .game-button.buhin-button.pressed {
      box-shadow: 0 2px 0 #2a7a4c;
    }
    /* 荷台が足りない ダンプカーと、とんでくる荷台（ゲームの図鑑の絵を写して、単純にしたもの）。
       座標の枠は 横300 × 縦240（ボタンの中と同じ大きさ）。id は使わない */
    .buhin-svg {
      position: absolute;
      left: 0;
      top: 0;
      width: 300px;
      height: 240px;
      display: block;
    }

    /* ===== 6本目「おなじ くるまを さがそう」のボタン =====
       作りは1〜5本目のボタンと同じ。ふちと下の影の色だけ、むらさき色にして見分けやすくする */
    .game-button.pairs-button {
      border-color: #8a63c9;
      box-shadow: 0 10px 0 #5e3f9a;
      animation-delay: -1.4s;        /* 1〜5本目のボタンと、ゆれる向きを少しずらす */
    }
    .game-button.pairs-button.pressed {
      box-shadow: 0 2px 0 #5e3f9a;
    }
    /* おもてになった ダンプカーのカード2枚と、うら返しのカード2枚（ゲームの絵を単純にして写したもの）。
       座標の枠は 横300 × 縦240（ボタンの中と同じ大きさ）。id は top6- で始める */
    .pairs-svg {
      position: absolute;
      left: 0;
      top: 0;
      width: 300px;
      height: 240px;
      display: block;
    }

    /* ===== 画面の高さが 400px 以下のとき（スマホ横・低い画面）の「つめた形」=====
       6つ並べると、ふだんの あきでは入らないので、縦の向きだけ詰める（JavaScript の fitButtons と同じ値）。
       ゲームの名前は ボタンの左右 8px ずつ はみ出すので、列のあいだ（24px）と左右のあき（32px）は変えない */
    body.compact {
      gap: 8px;
    }
    body.compact .title {
      font-size: 22px;
    }
  </style>
</head>
<body>

  <h1 class="title">はたらくくるま</h1>

  <!-- ゲームを選ぶボタン（横長の画面では左右、縦長の画面では上下に並ぶ） -->
  <div class="games" id="games" data-layout="grid">
  <div class="slot"><div class="slot-inner">
  <!-- ショベルカーのゲームへのボタン。
       ファイルをダブルクリックで開いたときも動くように、index.html まで書く -->
  <a class="game-button" data-name="しょべるかー" id="shovelGame" href="games/01-shovel/index.html" aria-label="しょべるかー">
    <div class="ground"></div>
    <!-- ショベルカーの絵（ゲームの中の絵を写したもの。この画面では動かさない）。
         座標の枠は 横300 × 縦220（左上が 0,0、y は下向きに増える）。
         この画面の中で名前（id）がぶつからないように、id の先頭に top- を付けてある。
         重なる順番（奥 → 手前）：地面の影 → 奥のキャタピラ → 旋回台 → 煙突 → アーム → 運転席・車体 → 手前のキャタピラ -->
    <svg class="shovel-svg" viewBox="0 0 300 220" aria-hidden="true" focusable="false">
      <defs>
        <!-- 車体・運転席・バケットの形で切りぬいて、明るいところ・影を中だけに塗るための型 -->
        <clipPath id="top-bodyClip"><rect x="15" y="112" width="130" height="48" rx="14"/></clipPath>
        <clipPath id="top-cabClip"><path d="M 34 115 L 34 46 Q 34 28 52 28 L 104 28 Q 119 28 121 43 L 126 115 Z"/></clipPath>
        <clipPath id="top-bucketClip"><path d="M -8 -4 L 38 -6 Q 62 10 58 34 Q 54 60 26 64 L 2 64 Q -6 64 -6 58 Q 12 28 -8 -4 Z"/></clipPath>
        <!-- キャタピラの形（カプセル形） -->
        <path id="top-trackShape" d="M 35 165 L 106.46 165 A 25 25 0 0 1 106.46 215 L 35 215 A 25 25 0 0 1 35 165 Z"/>
      </defs>

      <g stroke="#5a3d1e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">

        <!-- 地面の影（ぼんやりした横長の楕円） -->
        <ellipse cx="92" cy="215" rx="90" ry="7" fill="#8a5a38" opacity="0.35" stroke="none"/>

        <!-- ===== 奥のキャタピラ（手前より右に 22px・上に 7px ずらし、少し暗く） ===== -->
        <g transform="translate(22 -7)">
          <!-- でこぼこ（太い点線） -->
          <path d="M 35 165 L 106.46 165 A 25 25 0 0 1 106.46 215 L 35 215 A 25 25 0 0 1 35 165 Z"
                fill="none" stroke="#2c2c2c" stroke-width="11"
                stroke-dasharray="6 6" stroke-linecap="butt"/>
          <use href="#top-trackShape" fill="#3a3a3a" stroke="#3a2614"/>
          <!-- 右はしの車輪（見えるのは右がわだけ） -->
          <g transform="translate(106.46 190)">
            <circle r="18" fill="#5e5e5e" stroke="#3a2614" stroke-width="2.5"/>
            <circle r="7" fill="#4a4a4a" stroke="none"/>
            <g fill="#7a7a7a" stroke="none">
              <circle cx="0" cy="-11" r="2.2"/>
              <circle cx="9.5" cy="5.5" r="2.2"/>
              <circle cx="-9.5" cy="5.5" r="2.2"/>
            </g>
          </g>
        </g>

        <!-- ===== 旋回台（車体の下の暗い台） ===== -->
        <rect x="36" y="150" width="96" height="18" rx="5" fill="#4a4a4a"/>

        <!-- ===== 煙突（運転席の左どなり） ===== -->
        <rect x="20" y="92" width="9" height="24" rx="2.5" fill="#4a4a4a"/>
        <rect x="18" y="88" width="13" height="7" rx="3.5" fill="#4a4a4a"/>

        <!-- ===== アーム（ブーム > スティック > バケット の入れ子。すくう前の、止まった形） =====
             それぞれ「関節の場所へ translate した <g>」の中で、関節が (0, 0) になるように描いてある -->
        <!-- ブームの付け根の関節 (120, 120) -->
        <g transform="translate(120 120)">
          <!-- 油圧シリンダー2（ブームの上がわ）。ブームより先に描いて、背中から少しのぞかせる -->
          <line x1="26.2" y1="-91.9" x2="46.3" y2="-113.4" stroke-width="5"/>
          <line x1="26.2" y1="-91.9" x2="46.3" y2="-113.4" stroke="#c8ccd0" stroke-width="2.5"/>
          <line x1="9.8" y1="-74.4" x2="29.9" y2="-95.9" stroke-width="8"/>
          <line x1="9.8" y1="-74.4" x2="29.9" y2="-95.9" stroke="#4a4a4a" stroke-width="5"/>

          <!-- ブーム：付け根 (0,0) → 上に「く」の字に折れる (20,-68) → 先 (55,-100) -->
          <path fill="#f7c33c"
                d="M 11.5 3.4 L 28 -56.2 Q 29.7 -62 34.1 -66 L 61.1 -93.4 A 9 9 0 0 0 48.9 -106.6 L 18.5 -81.5 Q 10.3 -74.1 7.2 -63.4 L -11.5 -3.4 A 12 12 0 0 0 11.5 3.4 Z"/>
          <!-- ブームの明るいところ（背中がわ） -->
          <path d="M -1.8 -14.5 L 12.4 -62 Q 14.7 -71.3 22 -77.5 L 45 -98" fill="none" stroke="#ffd96b" stroke-width="4"/>
          <!-- シリンダー2の付け根のピン -->
          <circle cx="9.8" cy="-74.4" r="3.5" fill="#ffd96b" stroke-width="2"/>

          <!-- 油圧シリンダー1（ブームの下がわ）。下のはしは車体の裏にかくれる -->
          <line x1="22.6" y1="-13" x2="28" y2="-50" stroke-width="5"/>
          <line x1="22.6" y1="-13" x2="28" y2="-50" stroke="#c8ccd0" stroke-width="2.5"/>
          <line x1="18" y1="18" x2="23.6" y2="-20" stroke-width="8"/>
          <line x1="18" y1="18" x2="23.6" y2="-20" stroke="#4a4a4a" stroke-width="5"/>
          <circle cx="28" cy="-50" r="3.5" fill="#ffd96b" stroke-width="2"/>

          <!-- スティックの関節（ブームの先）(55, -100) -->
          <g transform="translate(55 -100)">
            <!-- スティック：上のはし → バケットの付け根 (55, 85) -->

  <script>
    // 指が触れた瞬間に、ボタンを沈ませてからゲームを開く
    // （ゲームと同じく、指がすべっても反応するように pointerdown を使う）
    function pressButton(button, e) {
      if (!e.isPrimary) return;          // 手のひらで触っても1回だけ
      button.classList.add("pressed");
      setTimeout(function () {
        window.location.href = button.getAttribute("href");
      }, 150);                           // 沈んだのが見えるくらい、少しだけ待つ
    }
    document.querySelectorAll(".game-button").forEach(function (button) {
      button.addEventListener("pointerdown", function (e) { pressButton(button, e); });

      // ボタンの下に、ゲームの名前を出す（大人のための小さな文字。縮めない）。
      //   名前は、ボタンの data-name を「/」で分けた かたまりごとに <span>（かたまりの中では折り返さない）にして、
      //   かたまりのあいだに半角スペースを入れる（data-name-glue="none" のときは入れず、折り返せる境目 wbr だけ入れる）。
      //   読み上げは今のボタンの aria-label に任せるので、名前の箱は aria-hidden。
      //   名前をさわっても、その上のボタンをさわったのと同じにする
      var slot = button.closest(".slot");
      var label = document.createElement("div");
      label.className = "game-name";
      label.setAttribute("aria-hidden", "true");
      var chunks = (button.getAttribute("data-name") || "").split("/");
      var glue = button.getAttribute("data-name-glue") === "none" ? "" : " ";
      chunks.forEach(function (text, i) {
        // かたまりのあいだ：スペースを入れる。data-name-glue="none" のときは、スペースを出さずに折り返せる境目（wbr）だけ
        if (i > 0) label.appendChild(glue ? document.createTextNode(glue) : document.createElement("wbr"));
        var span = document.createElement("span");
        span.textContent = text;
        label.appendChild(span);
      });
      label.addEventListener("pointerdown", function (e) { pressButton(button, e); });
      slot.appendChild(label);
    });

    // ボタンがいくつ並んでも画面に入るように、並べ方と、縮める率（0.3〜1）を、いっしょに決める。
    //   並べ方の表 LAYOUTS（縦1列 col・横1列 row・2列 grid・3列 grid3）と、ボタンの数 N から、
    //   どの並べ方も 次の1つの式で率を出す（ボタンを足しても、式を書きかえなくてよい）：
    //     k ＝ min(1, (横幅 − 32 − 24 × (列 − 1)) ÷ (312 × 列),
    //                 (高さ − 段のあいだ × (段 − 1) − 名前の帯 × 段) ÷ (268 × 段))
    //   段 ＝ ボタンの数 ÷ 列（切り上げ）。いちばん大きい率の並べ方を選ぶ（同じ率なら 表の上から）。
    //   選んだ並べ方は、ボタンを並べる箱の data-layout に書き、見た目の切りかえは CSS が行う。
    //   2列・3列のときは、箱の横はばを「列の数ぶん」に決めて折り返し、最後の段は まん中に寄せる。
    //   ボタンの場所は 312 × 268、列のあいだは 24px、画面のはしからは 16px、題名とボタンのあいだは 24px あける。
    //   名前の帯（LABEL_H ＝ 36px。ボタンの下の ゲームの名前の場所）を、1段ごとにとる。
    //   段のあいだ（rowGap）は、縦に詰めて ボタンを大きくするため 16px。
    //   画面の高さが 400px 以下（スマホ横・低い画面）のときだけ「つめた形」にする。詰めるのは縦の向きだけ：
    //     画面の上下のあき 32 → 12、題名とボタンのあいだ 24 → 8、題名の文字 → 22px、段のあいだ 16 → 8。
    //     列のあいだ（24）と画面の左右のあき（32）は、ゲームの名前が左右へ はみ出す（8px ずつ）ので変えない。
    //   この値は、CSS（body.compact）と同じにする。
    // 画面の大きさが変わったときだけ計算する（すぐ1回と、0.3秒あとにもう1回）
    var games = document.getElementById("games");
    var title = document.querySelector(".title");
    var fitTimer = null;
    var LABEL_H = 36;
    var COMPACT_MAX_H = 400;                              // この高さ以下のとき「つめた形」
    var NORMAL = { vPad: 32, titleGap: 24, rowGap: 16 };  // ふだんの形
    var COMPACT = { vPad: 12, titleGap: 8, rowGap: 8 };   // つめた形
    var BUTTON_COUNT = document.querySelectorAll(".slot").length;
    var LAYOUTS = [
      { layout: "grid",  cols: 2 },
      { layout: "grid3", cols: 3 },
      { layout: "col",   cols: 1 },
      { layout: "row",   cols: BUTTON_COUNT }
    ];
    function fitButtons() {
      var w = window.innerWidth;
      var h = window.innerHeight;
      // ① まず画面の高さで「つめた形」の印を付ける・外す（題名の文字の大きさが切りかわる）
      var compact = h <= COMPACT_MAX_H;
      document.body.classList.toggle("compact", compact);
      var m = compact ? COMPACT : NORMAL;
      // ② そのあとで題名の高さを測る（印を付ける前に測ると、古い高さになる）
      var room = h - m.vPad - title.offsetHeight - m.titleGap;      // 題名の下で、ボタンに使える高さ
      // ③ 段のあいだも、その形の値で書き直す（回転したときも、戻るように）
      games.style.rowGap = m.rowGap + "px";
      // ④ 率を計算する
      var best = null;
      for (var i = 0; i < LAYOUTS.length; i++) {
        var cols = LAYOUTS[i].cols;
        var rows = Math.ceil(BUTTON_COUNT / cols);
        var k = Math.min(1,

          (room - m.rowGap * (rows - 1) - LABEL_H * rows) / (268 * rows));

        games.style.width = (best.cols * 312 * k + (best.cols - 1) * 24 + 1) + "px";
      } else {
        games.style.width = "";
      }

      fitButtons();
      clearTimeout(fitTimer);
      fitTimer = setTimeout(fitButtons, 300);
    }
    window.addEventListener("resize", onResize);
    window.addEventListener("orientationchange", onResize);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", onResize);
    fitButtons();

    // ブラウザの「戻る」でこの画面に戻ってきたとき、ボタンが沈んだままにならないようにする
    window.addEventListener("pageshow", function () {
      document.querySelectorAll(".game-button").forEach(function (button) {
        button.classList.remove("pressed");
      });
    });
  </script>

</body>
</html>
