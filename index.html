<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホやタブレットでもちょうどいい大きさで表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>はたらくくるま</title>

  <style>
    /* ===== 画面全体 ===== */
    html, body {
      touch-action: none;            /* 2本指の拡大・ダブルタップ拡大・スクロールを止める */
      overscroll-behavior: none;     /* 画面のはしを引っぱったときの「びよーん」を止める */
    }

    body {
      margin: 0;
      height: 100vh;                 /* 古いブラウザ用 */
      height: 100dvh;
      overflow: hidden;
      background: #bfe9ff;           /* 空の色（ゲームと同じ） */
      font-family: system-ui, sans-serif; /* 端末に入っている書体だけを使う */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;

      /* ボタンを画面のまん中に置く */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    /* 上の題名（大人向け。子どもは絵で選ぶ） */
    .title {
      margin: 0;
      font-size: clamp(22px, 6vw, 34px);
      font-weight: bold;
      color: #333;
    }

    /* ===== ゲームを選ぶボタン =====
       おもちゃのブロックのように、下に濃い影を付けて「押せそう」に見せる */
    .game-button {
      position: relative;
      display: block;
      width: 300px;
      height: 240px;
      border: 6px solid #333;
      border-radius: 32px;
      /* ボタンの中の空（ゲームの空と同じ、上が濃く下がうすいグラデーション） */
      background: linear-gradient(#8ccbf0 0%, #d8f0ff 100%);
      box-shadow: 0 10px 0 #333;     /* 下の影 */
      overflow: hidden;
      animation: purupuru 1.2s ease-in-out infinite; /* ゆっくり揺れて「さわってね」と伝える */
    }

    /* ボタンの中の地面（ゲームと同じ色の土）。
       上のふちのすぐ下を少し濃くして、ゲームの地面と同じ見え方にする */
    .game-button .ground {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 50px;
      background: linear-gradient(#b07c51 0, #b07c51 5px, #c48d5c 5px);
    }
    /* 土の上の草地（ゲームの手前の草地と同じ黄緑。下のふちは少し濃い緑） */
    .game-button .ground::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 100%;                  /* 土のすぐ上に置く */
      height: 16px;
      background: linear-gradient(#a8d465 0, #a8d465 12px, #86bd52 12px);
    }

    /* 押したときに、影の分だけ沈む */
    .game-button.pressed {
      transform: translateY(8px);
      box-shadow: 0 2px 0 #333;
      animation: none;
    }

    @keyframes purupuru {
      0%, 100% { transform: translateY(0)    rotate(0deg); }
      25%      { transform: translateY(-4px) rotate(-1deg); }
      75%      { transform: translateY(-4px) rotate(1deg); }
    }

    /* 動きを減らす設定にしている端末では、揺らさない */
    @media (prefers-reduced-motion: reduce) {
      .game-button { animation: none; }
    }

    /* ===== ボタンの中のショベルカー（ゲームの絵を、そのまま 0.8 倍にして置く） =====
       ゲームの絵は 横300 × 縦220。0.8 倍で 横240 × 縦176 になる。
       横：絵の中で色がある部分（x 2〜295 くらい）が、ボタンのまん中にくるように、左から 30px。
       縦：キャタピラの下（絵の y 215）が、土の上のふち（ボタンの下から 50px）より
           6px だけ下にくるようにして、地面に乗って見せる。
           そのため、絵の下はしは、ボタンの下から 40px（= 50 − 6 − 5×0.8 ≒ 40）。
       このとき、アームのいちばん上はボタンの上から 27px くらい、バケットの右はしは
       左から 265px くらい（ボタンの中は 300px）なので、丸い角にもかからない */
    .shovel-svg {
      position: absolute;
      left: 34px;
      bottom: 36px;
      width: 228px;                  /* ゲームの絵の 0.76 倍（アームの上にゆとりを作る） */
      height: 167px;
      display: block;
      overflow: visible;             /* アームの先は絵の枠より少し上に出るので、切らずに見せる */
    }

    /* ===== ボタンを2つ並べる =====
       横長の画面では左右に、縦長の画面では上下に並べる（ボタンのあいだは 24px）。
       2つ並べて入らないときは、2つとも同じ率（--k、0.5〜1）で縮める。率は下の JavaScript が、
       画面の大きさが変わったときに計算して入れる。
       ボタンそのものの大きさ・ゆれ・沈み方は変えずに、外がわの箱（.slot-inner）を縮める */
    .games {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    @media (orientation: portrait) {
      .games { flex-direction: column; }
    }
    /* 1つぶんの場所。ボタン（ふちをふくめて 312 × 252）＋下の影 10px＋ゆれて上がる 4px ＋ゆとり 2px */
    .slot {
      position: relative;
      flex: none;
      width: calc(312px * var(--k, 1));
      height: calc(268px * var(--k, 1));
    }
    .slot-inner {
      position: absolute;
      left: 0;
      top: 0;
      width: 312px;
      height: 268px;
      padding-top: 4px;
      box-sizing: border-box;
      transform: scale(var(--k, 1));
      transform-origin: 0 0;
    }

    /* ===== 2本目「はたらくくるま しゅっぱつ！」のボタン =====
       作りは1本目のボタンと同じ。ふちと下の影の色だけ、ミキサーしゃのオレンジにして見分けやすくする */
    .game-button.mixer-button {
      border-color: #f39a3d;
      box-shadow: 0 10px 0 #c46f1c;
      animation-delay: -0.6s;        /* 1本目のボタンと、ゆれる向きを少しずらす */
    }
    .game-button.mixer-button.pressed {
      box-shadow: 0 2px 0 #c46f1c;
    }
    /* ボタンの中の道（ゲームと同じ、やさしい灰色。上のふちに明るい線） */
    .game-button .road {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 50px;
      background: linear-gradient(#d3d6db 0, #d3d6db 5px, #b9bcc2 5px);
    }
    /* 道の上の草地（ゲームの草地と同じ黄緑） */
    .game-button .road::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 100%;
      height: 16px;
      background: linear-gradient(#a8d465 0, #a8d465 12px, #86bd52 12px);
    }
    /* ボタンの中のミキサーしゃ（ゲームの絵を写したもの。横300 × 縦220 を 0.76 倍）。
       タイヤの下（絵の y 215）が、道の上のふちより少し下にくるように置く */
    .mixer-svg {
      position: absolute;
      left: 36px;
      bottom: 36px;
      width: 228px;
      height: 167px;
      display: block;
    }
  </style>
</head>
<body>

  <h1 class="title">はたらくくるま</h1>

  <!-- ゲームを選ぶボタン（横長の画面では左右、縦長の画面では上下に並ぶ） -->
  <div class="games" id="games">
  <div class="slot"><div class="slot-inner">
  <!-- ショベルカーのゲームへのボタン。
       ファイルをダブルクリックで開いたときも動くように、index.html まで書く -->
  <a class="game-button" id="shovelGame" href="games/01-shovel/index.html" aria-label="しょべるかー">
    <div class="ground"></div>
    <!-- ショベルカーの絵（ゲームの中の絵を写したもの。この画面では動かさない）。
         座標の枠は 横300 × 縦220（左上が 0,0、y は下向きに増える）。
         この画面の中で名前（id）がぶつからないように、id の先頭に top- を付けてある。
         重なる順番（奥 → 手前）：地面の影 → 奥のキャタピラ → 旋回台 → 煙突 → アーム → 運転席・車体 → 手前のキャタピラ -->
    <svg class="shovel-svg" viewBox="0 0 300 220" aria-hidden="true" focusable="false">
      <defs>
        <!-- 車体・運転席・バケットの形で切りぬいて、明るいところ・影を中だけに塗るための型 -->
        <clipPath id="top-bodyClip"><rect x="15" y="112" width="130" height="48" rx="14"/></clipPath>
        <clipPath id="top-cabClip"><path d="M 34 115 L 34 46 Q 34 28 52 28 L 104 28 Q 119 28 121 43 L 126 115 Z"/></clipPath>
        <clipPath id="top-bucketClip"><path d="M -8 -4 L 38 -6 Q 62 10 58 34 Q 54 60 26 64 L 2 64 Q -6 64 -6 58 Q 12 28 -8 -4 Z"/></clipPath>
        <!-- キャタピラの形（カプセル形） -->
        <path id="top-trackShape" d="M 35 165 L 106.46 165 A 25 25 0 0 1 106.46 215 L 35 215 A 25 25 0 0 1 35 165 Z"/>
      </defs>

      <g stroke="#5a3d1e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">

        <!-- 地面の影（ぼんやりした横長の楕円） -->
        <ellipse cx="92" cy="215" rx="90" ry="7" fill="#8a5a38" opacity="0.35" stroke="none"/>

        <!-- ===== 奥のキャタピラ（手前より右に 22px・上に 7px ずらし、少し暗く） ===== -->
        <g transform="translate(22 -7)">
          <!-- でこぼこ（太い点線） -->
          <path d="M 35 165 L 106.46 165 A 25 25 0 0 1 106.46 215 L 35 215 A 25 25 0 0 1 35 165 Z"
                fill="none" stroke="#2c2c2c" stroke-width="11"
                stroke-dasharray="6 6" stroke-linecap="butt"/>
          <use href="#top-trackShape" fill="#3a3a3a" stroke="#3a2614"/>
          <!-- 右はしの車輪（見えるのは右がわだけ） -->
          <g transform="translate(106.46 190)">
            <circle r="18" fill="#5e5e5e" stroke="#3a2614" stroke-width="2.5"/>
            <circle r="7" fill="#4a4a4a" stroke="none"/>
            <g fill="#7a7a7a" stroke="none">
              <circle cx="0" cy="-11" r="2.2"/>
              <circle cx="9.5" cy="5.5" r="2.2"/>
              <circle cx="-9.5" cy="5.5" r="2.2"/>
            </g>
          </g>
        </g>

        <!-- ===== 旋回台（車体の下の暗い台） ===== -->
        <rect x="36" y="150" width="96" height="18" rx="5" fill="#4a4a4a"/>

        <!-- ===== 煙突（運転席の左どなり） ===== -->
        <rect x="20" y="92" width="9" height="24" rx="2.5" fill="#4a4a4a"/>
        <rect x="18" y="88" width="13" height="7" rx="3.5" fill="#4a4a4a"/>

        <!-- ===== アーム（ブーム > スティック > バケット の入れ子。すくう前の、止まった形） =====
             それぞれ「関節の場所へ translate した <g>」の中で、関節が (0, 0) になるように描いてある -->
        <!-- ブームの付け根の関節 (120, 120) -->
        <g transform="translate(120 120)">
          <!-- 油圧シリンダー2（ブームの上がわ）。ブームより先に描いて、背中から少しのぞかせる -->
          <line x1="26.2" y1="-91.9" x2="46.3" y2="-113.4" stroke-width="5"/>
          <line x1="26.2" y1="-91.9" x2="46.3" y2="-113.4" stroke="#c8ccd0" stroke-width="2.5"/>
          <line x1="9.8" y1="-74.4" x2="29.9" y2="-95.9" stroke-width="8"/>
          <line x1="9.8" y1="-74.4" x2="29.9" y2="-95.9" stroke="#4a4a4a" stroke-width="5"/>

          <!-- ブーム：付け根 (0,0) → 上に「く」の字に折れる (20,-68) → 先 (55,-100) -->
          <path fill="#f7c33c"
                d="M 11.5 3.4 L 28 -56.2 Q 29.7 -62 34.1 -66 L 61.1 -93.4 A 9 9 0 0 0 48.9 -106.6 L 18.5 -81.5 Q 10.3 -74.1 7.2 -63.4 L -11.5 -3.4 A 12 12 0 0 0 11.5 3.4 Z"/>
          <!-- ブームの明るいところ（背中がわ） -->
          <path d="M -1.8 -14.5 L 12.4 -62 Q 14.7 -71.3 22 -77.5 L 45 -98" fill="none" stroke="#ffd96b" stroke-width="4"/>
          <!-- シリンダー2の付け根のピン -->
          <circle cx="9.8" cy="-74.4" r="3.5" fill="#ffd96b" stroke-width="2"/>

          <!-- 油圧シリンダー1（ブームの下がわ）。下のはしは車体の裏にかくれる -->
          <line x1="22.6" y1="-13" x2="28" y2="-50" stroke-width="5"/>
          <line x1="22.6" y1="-13" x2="28" y2="-50" stroke="#c8ccd0" stroke-width="2.5"/>
          <line x1="18" y1="18" x2="23.6" y2="-20" stroke-width="8"/>
          <line x1="18" y1="18" x2="23.6" y2="-20" stroke="#4a4a4a" stroke-width="5"/>
          <circle cx="28" cy="-50" r="3.5" fill="#ffd96b" stroke-width="2"/>

          <!-- スティックの関節（ブームの先）(55, -100) -->
          <g transform="translate(55 -100)">
            <!-- スティック：上のはし → バケットの付け根 (55, 85) -->
            <path fill="#f7c33c"
                  d="M -0.7 -18.6 L 61.7 80.7 A 8 8 0 0 1 48.3 89.4 L -16.7 -8.3 A 9.5 9.5 0 0 1 -0.7 -18.6 Z"/>
            <path d="M 3.1 -4.4 L 50.5 69.8" fill="none" stroke="#ffd96b" stroke-width="3.5"/>

            <!-- 油圧シリンダー3（スティックの外がわ） -->
            <line x1="36.2" y1="33.8" x2="64.4" y2="77.4" stroke-width="5"/>
            <line x1="36.2" y1="33.8" x2="64.4" y2="77.4" stroke="#c8ccd0" stroke-width="2.5"/>
            <line x1="15.5" y1="1.9" x2="40" y2="39.7" stroke-width="8"/>
            <line x1="15.5" y1="1.9" x2="40" y2="39.7" stroke="#4a4a4a" stroke-width="5"/>
            <circle cx="15.5" cy="1.9" r="3.5" fill="#ffd96b" stroke-width="2"/>

            <!-- バケットの関節（スティックの先）(55, 85) -->
            <g transform="translate(55 85)">
              <!-- バケットの上の小さなつなぎの板 -->
              <rect x="-4" y="-12" width="32" height="10" rx="5" fill="#f7c33c"/>
              <circle cx="22" cy="-7" r="3" fill="#ffd96b" stroke-width="2"/>
              <!-- バケット：口は左向き。丸みのある1枚の刃先 -->
              <path fill="#f7c33c"
                    d="M -8 -4 L 38 -6 Q 62 10 58 34 Q 54 60 26 64 L 2 64 Q -6 64 -6 58 Q 12 28 -8 -4 Z"/>
              <g clip-path="url(#top-bucketClip)" stroke="none">
                <ellipse cx="30" cy="66" rx="42" ry="12" fill="#e0a52a"/>
                <path d="M -6 58 Q 12 28 -8 -4" fill="none" stroke="#e0a52a" stroke-width="10"/>
                <path d="M 40 -2 Q 58 12 55 32" fill="none" stroke="#ffd96b" stroke-width="4"/>
              </g>
              <path fill="none"
                    d="M -8 -4 L 38 -6 Q 62 10 58 34 Q 54 60 26 64 L 2 64 Q -6 64 -6 58 Q 12 28 -8 -4 Z"/>
              <!-- バケットの関節のピン -->
              <circle r="5" fill="#ffd96b" stroke-width="2.5"/>
              <circle r="1.6" fill="#5a3d1e" stroke="none"/>
            </g>

            <!-- スティックの関節のピン -->
            <circle r="6" fill="#ffd96b" stroke-width="2.5"/>
            <circle r="2" fill="#5a3d1e" stroke="none"/>
          </g>

          <!-- ブームの付け根のピン（車体の裏にかくれる） -->
          <circle r="5" fill="#ffd96b" stroke-width="2.5"/>
          <circle r="1.6" fill="#5a3d1e" stroke="none"/>
        </g>

        <!-- ===== 運転席 ===== -->
        <path fill="#f7c33c" d="M 34 115 L 34 46 Q 34 28 52 28 L 104 28 Q 119 28 121 43 L 126 115 Z"/>
        <g clip-path="url(#top-cabClip)" stroke="none">
          <rect x="30" y="22" width="100" height="12" fill="#ffd96b"/>  <!-- 屋根の明るいところ -->
        </g>
        <path fill="none" d="M 34 115 L 34 46 Q 34 28 52 28 L 104 28 Q 119 28 121 43 L 126 115 Z"/>
        <!-- 横の面と前の面のさかい目 -->
        <path d="M 101 30 L 101 112" fill="none" stroke-width="1.5"/>
        <!-- 横の窓 -->
        <rect x="41" y="37" width="53" height="43" rx="7" fill="#bfe4f5" stroke-width="2.5"/>
        <!-- 前の窓 -->
        <path d="M 104 37 L 114 37 Q 118 37 118.5 41 L 121 76 Q 121.3 80 117 80 L 104 80 Z" fill="#bfe4f5" stroke-width="2.5"/>
        <!-- ガラスに見せる、白いななめの線 -->
        <g stroke="#ffffff" stroke-width="4" opacity="0.7" fill="none">
          <path d="M 50 74 L 65 44"/>
          <path d="M 61 74 L 76 44"/>
          <path d="M 108 72 L 114 46"/>
        </g>
        <!-- ドアの線と取っ手 -->
        <path d="M 39 86 L 39 110" fill="none" stroke-width="1.5"/>
        <rect x="84" y="90" width="12" height="4" rx="2" fill="#5a3d1e" stroke="none"/>

        <!-- ===== 車体（下の箱） ===== -->
        <rect x="15" y="112" width="130" height="48" rx="14" fill="#f7c33c" stroke="none"/>
        <g clip-path="url(#top-bodyClip)" stroke="none">
          <rect x="15" y="112" width="130" height="7" fill="#ffd96b"/>   <!-- 上の面（明るい） -->
          <rect x="15" y="151" width="130" height="9" fill="#e0a52a"/>   <!-- 下の面（影） -->
        </g>
        <rect x="15" y="112" width="130" height="48" rx="14" fill="none"/>
        <!-- 前の面とのさかい目 -->
        <path d="M 121 115 L 121 157" fill="none" stroke-width="1.5"/>
        <!-- 後ろの通気口（横線3本） -->
        <g stroke-width="3.5" fill="none">
          <path d="M 24 125 L 38 125"/>
          <path d="M 24 132 L 38 132"/>
          <path d="M 24 139 L 38 139"/>
        </g>
        <!-- 前のライト2つ -->
        <circle cx="128" cy="140" r="5" fill="#fff3c4" stroke-width="2"/>
        <circle cx="139" cy="140" r="5" fill="#fff3c4" stroke-width="2"/>

        <!-- ===== 手前のキャタピラ ===== -->
        <!-- でこぼこ（太い点線。内がわ半分は、上のカプセルにかくれる） -->
        <path d="M 35 165 L 106.46 165 A 25 25 0 0 1 106.46 215 L 35 215 A 25 25 0 0 1 35 165 Z"
              fill="none" stroke="#333333" stroke-width="11"
              stroke-dasharray="6 6" stroke-linecap="butt"/>
        <use href="#top-trackShape" fill="#454545" stroke="#3a2614"/>

        <!-- 大きい車輪（左右） -->
        <g transform="translate(35 190)">
          <circle r="18" fill="#6e6e6e" stroke="#3a2614" stroke-width="2.5"/>
          <circle r="7" fill="#555555" stroke="none"/>
          <g fill="#8a8a8a" stroke="none">
            <circle cx="0" cy="-11" r="2.2"/>
            <circle cx="9.5" cy="5.5" r="2.2"/>
            <circle cx="-9.5" cy="5.5" r="2.2"/>
          </g>
        </g>
        <g transform="translate(106.46 190)">
          <circle r="18" fill="#6e6e6e" stroke="#3a2614" stroke-width="2.5"/>
          <circle r="7" fill="#555555" stroke="none"/>
          <g fill="#8a8a8a" stroke="none">
            <circle cx="0" cy="-11" r="2.2"/>
            <circle cx="9.5" cy="5.5" r="2.2"/>
            <circle cx="-9.5" cy="5.5" r="2.2"/>
          </g>
        </g>

        <!-- 小さいローラー3つ -->
        <g transform="translate(58 201)">
          <circle r="5.5" fill="#5e5e5e" stroke="#3a2614" stroke-width="2"/>
          <circle cx="0" cy="-2.6" r="1.4" fill="#8a8a8a" stroke="none"/>
        </g>
        <g transform="translate(71 201)">
          <circle r="5.5" fill="#5e5e5e" stroke="#3a2614" stroke-width="2"/>
          <circle cx="0" cy="-2.6" r="1.4" fill="#8a8a8a" stroke="none"/>
        </g>
        <g transform="translate(84 201)">
          <circle r="5.5" fill="#5e5e5e" stroke="#3a2614" stroke-width="2"/>
          <circle cx="0" cy="-2.6" r="1.4" fill="#8a8a8a" stroke="none"/>
        </g>

        <!-- ローラーの上の、黄色い細長いカバー -->
        <rect x="46" y="178" width="50" height="10" rx="5" fill="#f7c33c" stroke-width="2.5"/>
      </g>
    </svg>
  </a>
  </div></div>

  <div class="slot"><div class="slot-inner">
  <!-- 「はたらくくるま しゅっぱつ！」へのボタン。
       ファイルをダブルクリックで開いたときも動くように、index.html まで書く -->
  <a class="game-button mixer-button" id="shuppatsuGame" href="games/02-shuppatsu/index.html" aria-label="はたらくくるま しゅっぱつ">
    <div class="road"></div>
    <!-- ミキサーしゃの絵（ゲームの図鑑の絵を写したもの。この画面では動かさない）。
         座標の枠は 横300 × 縦220。この画面の中で名前（id）がぶつからないように、id の先頭に top2- を付けてある。
         重なる順番（奥 → 手前）：地面の影 → 台 → ドラム → 運転席 → ライト → タイヤ -->
    <svg class="mixer-svg" viewBox="0 0 300 220" aria-hidden="true" focusable="false">

        <!-- ドラム：中心 (110, 100)、右下がりに 12度。白にオレンジのななめのしま -->

          <rect x="-99" y="-17" width="20" height="34" rx="7" fill="#d97a22"/>

          <ellipse rx="85" ry="50" fill="#ffffff" stroke="none"/>
          <g clip-path="url(#top2-drum)" stroke="none">
            <g fill="#f39a3d">

              <path d="M -76 -56 L -54 -56 L -82 56 L -104 56 Z"/>
              <path d="M -20 -56 L 2 -56 L -26 56 L -48 56 Z"/>

        <!-- 運転席（オレンジ。窓1枚） -->

  <script>
    // 指が触れた瞬間に、ボタンを沈ませてからゲームを開く
    // （ゲームと同じく、指がすべっても反応するように pointerdown を使う）
    document.querySelectorAll(".game-button").forEach(function (button) {
      button.addEventListener("pointerdown", function (e) {
        if (!e.isPrimary) return;          // 手のひらで触っても1回だけ
        button.classList.add("pressed");
        setTimeout(function () {
          window.location.href = button.getAttribute("href");
        }, 150);                           // 沈んだのが見えるくらい、少しだけ待つ
      });
    });

    // ボタンが2つ並んで画面に入るように、縮める率（0.5〜1）を決める。
    //   横長の画面：左右に2つ（312 × 2 ＋ あいだ 24）、縦長の画面：上下に2つ（268 × 2 ＋ あいだ 24）。
    //   画面のはしからは 16px、題名とボタンのあいだは 24px あける。
    // 画面の大きさが変わったときだけ計算する（すぐ1回と、0.3秒あとにもう1回）
    var games = document.getElementById("games");
    var title = document.querySelector(".title");
    var fitTimer = null;
    function fitButtons() {
      var w = window.innerWidth;
      var h = window.innerHeight;
      var portrait = window.matchMedia("(orientation: portrait)").matches;
      var room = h - 32 - title.offsetHeight - 24;      // 題名の下で、ボタンに使える高さ
      var k;
      if (portrait) {
        k = Math.min(1, (w - 32) / 312, (room - 24) / (268 * 2));
      } else {
        k = Math.min(1, (w - 32 - 24) / (312 * 2), room / 268);
      }
      games.style.setProperty("--k", Math.max(0.5, k));
    }
    function onResize() {
      fitButtons();
      clearTimeout(fitTimer);
      fitTimer = setTimeout(fitButtons, 300);
    }
    window.addEventListener("resize", onResize);
    window.addEventListener("orientationchange", onResize);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", onResize);
    fitButtons();

    // ブラウザの「戻る」でこの画面に戻ってきたとき、ボタンが沈んだままにならないようにする
    window.addEventListener("pageshow", function () {
      document.querySelectorAll(".game-button").forEach(function (button) {
        button.classList.remove("pressed");
      });
    });
  </script>
