<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホやタブレットでもちょうどいい大きさで表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>はたらくくるま しんごうを タッチ！</title>

  <!-- 全部のゲームで使う、共通の見た目（拡大を止める・大人用ボタン・指マーク・ぴょん） -->
  <link rel="stylesheet" href="../../shared/kuruma-base.css">

  <style>
    /* =====================================================
       「しんごうを タッチ！」
       ・大きな横向きの信号（左から 青・黄・赤）をさわると、青 → 黄（1.2秒）→ 赤 → 青 … と変わる
       ・青：くるまが左から右へ走る。赤：停止線の手前でゆっくり止まり、列がだんだん長くなる
       ・青になると、列のくるまが先頭から順に続けて走り出す
       ・5秒さわらないと、指マークが「次に点く灯」を指す。赤のときは、止まっているくるまも ぷるぷるする
       ・信号の状態（light）と、くるまの走り（cars）は、JavaScript の中でも別々に管理している
       ===================================================== */

    /* 画面の高さの 1% の単位（u）。dvh が使える端末では dvh、だめなら vh */
    :root { --u: 1vh; }
    @supports (height: 100dvh) {
      :root { --u: 1dvh; }
    }

    body {
      position: relative;            /* 中の絵（position: absolute）の基準にする */
      background: #d8f0ff;          /* 空の色（背景の絵が出るまでの、念のための色） */
      /* 下から順に：手前の歩道 11u（低い画面は 7u）、道 24u、奥の歩道 6u（くるまは道の上がわの車線を走る） */
      --front: calc(var(--u) * 11);
      --road: calc(var(--u) * 24);
      --back: calc(var(--u) * 6);
      /* 画面の右はしからの余白。信号の箱と横断歩道の右はしは、ここより内がわ */
      --edge: max(40px, 6vw);
      --cross-w: clamp(44px, 11vw, 150px);   /* 横断歩道の横幅 */
      --stop-gap: clamp(8px, 2vw, 24px);     /* 停止線と横断歩道の間 */
      --stop-w: clamp(7px, 1.2vw, 14px);     /* 停止線の太さ */
      --pole-w: clamp(10px, 1.4vw, 18px);    /* 信号の柱の太さ */
    }

    /* 低い画面（スマホ横など）は、手前の歩道をせまくして、信号とくるまの場所を広くする */
    @media (max-height: 500px) {
      body { --front: calc(var(--u) * 7); }
    }

    /* ===== 背景：空と景色（上） ===== */
    .scenery {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      /* 奥の歩道と 2px 重ねる（画面の高さが端数のとき、境目に 1px のすき間が出ないように） */
      bottom: calc(var(--front) + var(--road) + var(--back) - 2px);
      overflow: hidden;
      --hills: min(max(33.4vw, 42%), 92%);
      background: linear-gradient(#a9dcf5 0%, #e3f4fc 100%);
    }
    @media (orientation: portrait) {
      .scenery { --hills: min(max(33.4vw, 50%), 92%); }
    }

    /* 雲：画面2つぶんの横長の帯に、同じ並びを2回置き、とてもゆっくり左へ流す（CSS だけで動かす）。
       帯の半分（= 画面1つぶん）動いたところで最初に戻るので、つなぎ目が見えない。1周 160秒。
       上の文字・大人用ボタンの後ろを通らないように、上から 84px より下に置く */
    .clouds {
      position: absolute;
      left: 0;
      top: 84px;
      width: 200%;
      height: max(50px, calc(100% - 84px - var(--hills) * 0.6));
      animation: kumo 160s linear infinite;
    }
    @keyframes kumo {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    .cloud {
      position: absolute;
      display: block;
      height: auto;
      aspect-ratio: 120 / 56;
    }
    .cloud-l { width: clamp(90px, 13vw, 190px); }
    .cloud-m { width: clamp(70px, 9vw, 140px); }
    @media (max-height: 500px) {
      .cloud-l { width: 76px; }
      .cloud-m { width: 60px; }
    }

    /* 丘とまるい低木（下のはしを、奥の歩道の上のふちに合わせる） */
    .hills {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: var(--hills);
      display: block;
    }

    /* 絵の部品（雲の形）を1か所に書いておくための、見えない SVG */
    .svg-defs {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    /* 奥の歩道（クリーム色の帯） */
    .sidewalk-back {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(var(--front) + var(--road));
      height: var(--back);
      background: linear-gradient(#f6edd0 0, #f6edd0 calc(100% - 4px), #e6d8b0 calc(100% - 4px));
    }
    /* 道（灰色）。まん中に白い短い線（破線） */
    .road {
      position: absolute;
      left: 0;
      right: 0;
      bottom: var(--front);
      height: var(--road);
      background: #b7bac0;
    }
    .road::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 4px;
      margin-top: -2px;
      background: repeating-linear-gradient(90deg, #f4f4f2 0, #f4f4f2 52px, transparent 52px, transparent 104px);
    }
    /* 横断歩道：道の上から下まで、道の向きと平行な白い帯を6本、縦に並べる。
       下地を道と同じ灰色でぬるので、この中では まん中の線が切れる（帯の本数を偶数にして、まん中はすき間） */
    .crosswalk {
      position: absolute;
      right: var(--edge);
      bottom: var(--front);
      width: var(--cross-w);
      height: var(--road);
      background:
        linear-gradient(transparent 0, transparent 22%, #f4f4f2 22%, #f4f4f2 78%, transparent 78%)
          left top / 100% 16.6667%,
        #b7bac0;
    }
    /* 停止線：横断歩道の左の、太い白い縦線。上の車道（くるまが走る車線）だけ */
    .stop-line {
      position: absolute;
      right: calc(var(--edge) + var(--cross-w) + var(--stop-gap));
      bottom: calc(var(--front) + var(--road) * 0.5 - 2px);
      width: var(--stop-w);
      height: calc(var(--road) * 0.5 + 2px);
      background: #f4f4f2;
    }
    /* 手前の歩道（クリーム色。つぎ目の線をうすく） */
    .sidewalk-front {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--front);
      background:
        repeating-linear-gradient(100deg, transparent 0, transparent 179px, #e6d8b0 179px, #e6d8b0 181px),
        linear-gradient(#e6d8b0 0, #e6d8b0 4px, #f6edd0 4px);
    }

    /* ===== 上の文字「しんごうを さわってね！」 =====
       広い画面（横幅 560px 以上）：上から 30px、右上の2つのボタンを避けて、左右に 160px ずつあける。
       せまい画面（560px より小さい）：ボタンの段より下（上から 92px）に出す */
    .message {
      position: absolute;
      left: 0;
      right: 0;
      top: 30px;
      padding: 0 160px;
      font-size: clamp(18px, calc((100vw - 320px) / 12), 32px);
      line-height: 1.3;
      z-index: 2;
    }
    @media (max-width: 559.98px) {
      .message {
        top: 92px;
        padding: 0 12px;
        font-size: clamp(20px, 6vw, 32px);
      }
    }

    /* ===== 信号の柱と腕 =====
       柱は右はしの近くで、足もとは奥の歩道。横の腕で、箱を支える。くるまより うしろに描く。
       上下の場所（top）は、箱の場所に合わせて JavaScript が決める */
    .signal-arm,
    .signal-pole,
    .signal-base {
      position: absolute;
      box-sizing: border-box;
      border: 2.5px solid #5a3d1e;
    }
    .signal-arm {
      right: calc(var(--edge) * 0.55);
      width: calc(var(--edge) * 0.45 + 20px);      /* 左のはし 20px は、箱のうしろにかくれる */
      height: calc(var(--pole-w) * 0.8 + 2px);
      background: linear-gradient(#a9aeb6 0, #a9aeb6 35%, #8b9099 35%);
    }
    .signal-pole {
      right: calc(var(--edge) * 0.55 - var(--pole-w) * 0.5);
      bottom: calc(var(--front) + var(--road) + var(--back) * 0.45);
      width: var(--pole-w);
      border-radius: 6px 6px 0 0;
      background: linear-gradient(90deg, #8b9099 0, #8b9099 25%, #a9aeb6 25%, #a9aeb6 50%, #8b9099 50%);
    }
    .signal-base {
      right: calc(var(--edge) * 0.55 - var(--pole-w) * 1.1);
      bottom: calc(var(--front) + var(--road) + var(--back) * 0.45 - 3px);
      width: calc(var(--pole-w) * 2.2);
      height: var(--pole-w);
      border-radius: 6px;
      background: #7d838c;
    }

    /* ===== 大きな信号の箱（絵は下の SVG。横向き。右はしから 40px 以上あける） =====
       大きさと上下の場所は、上の文字とくるまのあいだに入るように、JavaScript が決める */
    .signal {
      position: absolute;
      display: block;
      right: var(--edge);
      overflow: visible;
    }
    /* 黄のあいだにさわったとき：箱が1回だけ、小さくやさしくはねる（明るさは変えない） */
    .signal.bounce {
      animation: pokon 0.35s ease-out;
    }
    @keyframes pokon {
      0%   { transform: translateY(0); }
      40%  { transform: translateY(-5px); }
      100% { transform: translateY(0); }
    }
    /* 灯：消えている灯は、くすんだ暗い色（.dim）。点いている灯（.lit）と、まわりの光（.glow）は、
       ふだんは透明で、その色の番のときだけ、0.4秒かけてなめらかに現れる（点滅しない） */
    .signal .lit,
    .signal .glow {
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .signal .mark {
      opacity: 0.28;                 /* 消えている灯のマークは、うすく見える */
      transition: opacity 0.4s ease;
    }
    .signal[data-light="red"]    .lamp-red .lit,
    .signal[data-light="yellow"] .lamp-yellow .lit,
    .signal[data-light="green"]  .lamp-green .lit { opacity: 1; }
    .signal[data-light="red"]    .lamp-red .glow,
    .signal[data-light="yellow"] .lamp-yellow .glow,
    .signal[data-light="green"]  .lamp-green .glow { opacity: 1; }
    .signal[data-light="red"]    .lamp-red .mark,
    .signal[data-light="green"]  .lamp-green .mark { opacity: 1; }

    /* ===== くるま =====
       3つの箱を重ねて、役割を分けている（2本目と同じ）。
         .car           … 左右の「位置」を受け持つ（JavaScript が translateX で動かす）。大きさは、見た目の大きさ
         .car-size      … 図鑑の絵の大きさ（横 × 縦 220）のまま、縮めるだけ（左下を基準に）
         .kuruma-hop    … 「ぴょん」を受け持つ
         .kuruma-wobble … 図鑑の絵を入れる箱 */
    .cars {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
      pointer-events: none;          /* くるまの箱だけが、さわりを受ける */
    }
    .car {
      position: absolute;
      left: 0;
      /* タイヤの下のはしを、道の下から 64% の高さ（まん中の線より上の車線）に置く。
         絵のタイヤの下には少し余白があるので、そのぶんは JavaScript が margin-bottom で下げる */
      bottom: calc(var(--front) + var(--road) * 0.64);
      pointer-events: auto;
    }
    .car-size {
      position: absolute;
      left: 0;
      bottom: 0;
      transform-origin: left bottom;
    }
    .car .kuruma-hop,
    .car .kuruma-wobble {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
    }

    /* 指マークは、信号のそばに置く（場所と大きさは JavaScript が決める）。信号より手前に出す */
    .finger-hint {
      z-index: 3;
    }

    /* 動きを減らす設定では、雲の流れと箱のはねを止め、灯は動かさずに切りかえる */
    @media (prefers-reduced-motion: reduce) {
      .clouds { animation: none; }
      .signal.bounce { animation: none; }
      .signal .lit,
      .signal .glow,
      .signal .mark { transition: none; }
    }
  </style>
</head>
<body data-scene="green">

  <!-- 雲の形（ここに1回だけ書いて、<use> で何回も使う）。この SVG 自体は見えない -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <g id="bgCloud">
        <path fill="#dcebf7"
              d="M 14 52 Q 2 52 4 42 Q 6 32 18 34 Q 20 18 38 20 Q 46 8 62 12 Q 76 6 84 20 Q 100 16 104 30 Q 118 32 116 44 Q 114 54 102 54 Z"/>
        <path fill="#ffffff"
              d="M 14 47 Q 2 47 4 37 Q 6 27 18 29 Q 20 13 38 15 Q 46 3 62 7 Q 76 1 84 15 Q 100 11 104 25 Q 118 27 116 39 Q 114 48 102 48 Z"/>
      </g>
    </defs>
  </svg>

  <!-- ===== 背景（空・雲・丘・歩道・道） ===== -->
  <div class="scenery" aria-hidden="true">
    <div class="clouds">
      <svg class="cloud cloud-l" viewBox="0 0 120 56" style="left: 4%; top: 8%;"><use href="#bgCloud"/></svg>
      <svg class="cloud cloud-m" viewBox="0 0 120 56" style="left: 24%; top: 42%;"><use href="#bgCloud"/></svg>
      <svg class="cloud cloud-l" viewBox="0 0 120 56" style="left: 40%; top: 2%;"><use href="#bgCloud"/></svg>

      <svg class="cloud cloud-l" viewBox="0 0 120 56" style="left: 54%; top: 8%;"><use href="#bgCloud"/></svg>
      <svg class="cloud cloud-m" viewBox="0 0 120 56" style="left: 74%; top: 42%;"><use href="#bgCloud"/></svg>
      <svg class="cloud cloud-l" viewBox="0 0 120 56" style="left: 90%; top: 2%;"><use href="#bgCloud"/></svg>
    </div>

    <!-- やわらかい緑の丘を2色重ね、丘の前にまるい低木。横長の絵を画面いっぱいに広げて、はみ出た左右は切る -->
    <svg class="hills" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice">
      <path fill="#bfe3a6"
            d="M 0 170 C 150 110 300 100 440 140 C 560 174 660 150 780 118 C 900 84 1040 92 1200 140 L 1200 300 L 0 300 Z"/>
      <path fill="#a4d487"
            d="M 0 224 C 140 186 280 182 420 204 C 560 228 700 214 820 192 C 960 166 1080 178 1200 200 L 1200 300 L 0 300 Z"/>
      <path fill="#8cc56e"
            d="M 0 272 C 200 258 420 266 640 262 C 860 258 1040 256 1200 266 L 1200 300 L 0 300 Z"/>
      <!-- まるい低木（濃いめの緑） -->
      <g>
        <g fill="#5fa05a">
          <circle cx="90" cy="262" r="34"/><circle cx="130" cy="268" r="28"/><circle cx="56" cy="270" r="24"/>
        </g>
        <g fill="#6fb066">
          <circle cx="100" cy="254" r="22"/><circle cx="124" cy="262" r="16"/>
        </g>
        <g fill="#5fa05a">
          <circle cx="470" cy="264" r="26"/><circle cx="500" cy="270" r="20"/>
        </g>
        <g fill="#5fa05a">
          <circle cx="760" cy="262" r="30"/><circle cx="796" cy="268" r="24"/><circle cx="730" cy="270" r="20"/>
        </g>
        <g fill="#6fb066">
          <circle cx="766" cy="254" r="18"/>
        </g>
        <g fill="#5fa05a">
          <circle cx="1090" cy="262" r="34"/><circle cx="1134" cy="268" r="28"/><circle cx="1050" cy="270" r="22"/>
        </g>
        <g fill="#6fb066">
          <circle cx="1100" cy="254" r="21"/>
        </g>
      </g>
    </svg>
  </div>
  <div class="sidewalk-back" aria-hidden="true"></div>
  <div class="road" aria-hidden="true"></div>
  <div class="crosswalk" aria-hidden="true"></div>
  <div class="stop-line" id="stopLine" aria-hidden="true"></div>
  <div class="sidewalk-front" aria-hidden="true"></div>

  <p class="kuruma-message message">しんごうを さわってね！</p>

  <!-- 大人用のボタン（どちらも2秒長押し）。トップ画面へ戻る・音を消す -->
  <button class="adult-btn home-btn" id="homeBtn" type="button" aria-label="もどる（2びょう ながおし）">
    <!-- おうちの形（三角の屋根、四角いかべ、まん中に戸） -->
    <svg viewBox="0 0 26 26" aria-hidden="true" focusable="false">
      <g fill="none" stroke="#5a3d1e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
        <path d="M 6 11.5 L 6 23 L 20 23 L 20 11.5" fill="#fff3c4"/>
        <path d="M 2.5 13 L 13 3.5 L 23.5 13"/>
        <path d="M 10.5 23 L 10.5 17 L 15.5 17 L 15.5 23"/>
      </g>
    </svg>
  </button>
  <button class="adult-btn mute-btn" id="muteBtn" type="button" aria-label="おとを けす（2びょう ながおし）">🔊</button>

  <!-- くるまを入れる層（くるまの箱は、JavaScript がここに足す） -->
  <div class="cars" id="cars"></div>

  <!-- 信号の腕・柱・足もと（箱より先に書いて、箱のうしろに描く） -->
  <div class="signal-arm" id="signalArm" aria-hidden="true"></div>
  <div class="signal-pole" id="signalPole" aria-hidden="true"></div>
  <div class="signal-base" aria-hidden="true"></div>

  <!-- ===== 大きな信号の箱（横向き。左から 青・黄・赤）=====
       色だけでなく、位置と形でも分かるようにする：青＝右向きの矢印、黄＝マークなし、赤＝開いた手のひら。
       座標の枠は 横222 × 縦84 -->
  <svg class="signal" id="signal" viewBox="0 0 222 84" data-light="green" aria-hidden="true" focusable="false">
    <defs>
      <!-- 点いている灯のまわりの、やわらかい光（ふちへいくほど透明） -->
      <radialGradient id="glowRed">
        <stop offset="0.45" stop-color="#ff7a68" stop-opacity="0.75"/>
        <stop offset="1" stop-color="#ff7a68" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="glowYellow">
        <stop offset="0.45" stop-color="#ffd95a" stop-opacity="0.75"/>
        <stop offset="1" stop-color="#ffd95a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="glowGreen">
        <stop offset="0.45" stop-color="#58e0c0" stop-opacity="0.7"/>
        <stop offset="1" stop-color="#58e0c0" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- 箱（角の丸い灰色。横長） -->
    <rect x="1.25" y="1.25" width="219.5" height="81.5" rx="26" fill="#868c95" stroke="#5a3d1e" stroke-width="2.5"/>
    <rect x="7" y="7" width="208" height="70" rx="21" fill="none" stroke="#a6abb3" stroke-width="2"/>

    <!-- 左：青（青みどり。右向きの矢印のマーク） -->
    <g class="lamp lamp-green">
      <circle cx="44" cy="42" r="32" fill="#5d636b"/>
      <circle class="dim" cx="44" cy="42" r="27" fill="#2c6a62"/>
      <circle class="glow" cx="44" cy="42" r="46" fill="url(#glowGreen)"/>
      <circle class="lit" cx="44" cy="42" r="27" fill="#34bfa0"/>
      <path class="mark" d="M 27 37 L 45 37 L 45 28 L 62 42 L 45 56 L 45 47 L 27 47 Z"
            fill="#f1fff9" stroke="#bfe6da" stroke-width="1.2" stroke-linejoin="round"/>
    </g>

    <!-- まん中：黄（マークなし。青から赤になるあいだだけ点く） -->
    <g class="lamp lamp-yellow">
      <circle cx="111" cy="42" r="32" fill="#5d636b"/>
      <circle class="dim" cx="111" cy="42" r="27" fill="#84713a"/>
      <circle class="glow" cx="111" cy="42" r="46" fill="url(#glowYellow)"/>
      <circle class="lit" cx="111" cy="42" r="27" fill="#f8c93c"/>
    </g>

    <!-- 右：赤（手のひらのマーク） -->
    <g class="lamp lamp-red">
      <circle cx="178" cy="42" r="32" fill="#5d636b"/>
      <circle class="dim" cx="178" cy="42" r="27" fill="#7c3b3a"/>
      <circle class="glow" cx="178" cy="42" r="46" fill="url(#glowRed)"/>
      <circle class="lit" cx="178" cy="42" r="27" fill="#f2584a"/>
      <!-- 手のひら：てのひらを前に向けた、やさしい形（手の甲の四角、指4本、親指） -->
      <g class="mark" transform="translate(128 -6)"
         fill="#fff1e0" stroke="#d9a98a" stroke-width="1.2" stroke-linejoin="round">
        <rect x="41" y="50" width="18" height="16" rx="6"/>
        <rect x="41" y="34" width="4.8" height="22" rx="2.4"/>
        <rect x="45.8" y="30" width="4.8" height="26" rx="2.4"/>
        <rect x="50.6" y="31" width="4.8" height="25" rx="2.4"/>
        <rect x="55.4" y="35" width="4.4" height="21" rx="2.2"/>
        <rect x="32.5" y="48" width="5.4" height="14" rx="2.7" transform="rotate(-35 35.2 55)"/>
      </g>
    </g>
  </svg>

  <!-- 全部のゲームで使う、共通の部品（音 → BGM → さわる操作 → くるまの図鑑 → 順番と動き の順に読み込む） -->
  <script src="../../shared/kuruma-sound.js"></script>
  <script src="../../shared/kuruma-bgm.js"></script>
  <script src="../../shared/kuruma-touch.js"></script>
  <script src="../../shared/kuruma-cars.js"></script>
  <script src="../../shared/kuruma-stage.js"></script>

  <script>
    (function () {
      "use strict";

      var K = window.Kuruma;

      // ===== 設定（数字を変えると動きが変わります。多くは実物で測って合わせる目安） =====
      // 出てくるくるま24台（図鑑が増えても、このゲームが勝手に変わらないように、ここにはっきり書く）。
      // 袋に入れてまぜ、24台が1回ずつ出たらまぜ直す。となり合うくるまの色が、できるだけ かぶらない
      var IDS = [
        "mixer", "dump", "bulldozer", "garbage", "shovel", "fire",
        "ambulance", "crane", "police", "grader", "tanker", "tractor",
        "taxi", "tow", "sports", "roller", "bus", "doubledecker",
        "loader", "forklift", "wingtruck", "carrier", "mail", "shirobai"
      ];
      var HOME_URL = "../../index.html";   // トップ画面
      var YELLOW_MS = 1200;      // 黄が点いている時間（ミリ秒）
      var LAUNCH_FIRST = 320;    // 青になってから、止まっている先頭が走り出すまで（ミリ秒）
      var LAUNCH_STEP = 380;     // 見えているくるま：前のくるまから、走り出すまでの間（ミリ秒）
      var LAUNCH_STEP_OUT = 150; // 画面の外で待つくるま：前のくるまから、走り出すまでの間（ミリ秒）
      var ACCEL_MS = 900;        // 止まった状態から、いつもの速さになるまでの時間（ミリ秒）
      var SPAWN_GREEN = 700;     // 青で、くるまが走りさってから、次が入ってくるまで（ミリ秒）
      var SPAWN_RED = 2500;      // 赤で、列に次のくるまが来るまでの間（ミリ秒）
      var SPAWN_RED_FIRST = 900; // 赤になって、列がからのとき、最初のくるまが来るまで（ミリ秒）
      var SPAWN_RETRY = 300;     // 前のくるまが近くて、まだ出せないときに、もう一度ためすまで（ミリ秒）
      var MAX_QUEUE = 8;         // 赤で並ぶ、いちばん多い台数（画面の外で待つぶんも入れる。青で走りきる時間が長くならない数）
      var TIRE_LINE = 0.64;      // タイヤの下のはしの高さ（道の下から。CSS の .car と同じ値）
      var TIRE_GAP = 5;          // 絵の中の、タイヤの下の余白（高さ 220 のうち）
      // タイヤの下から上に、くるまのために空けておく高さ（絵の高さの単位）。
      // 24台でいちばん高いのは しょべるかーの うでの先（約214）。仕事で はしご・うでが上がっても これより低い。
      // ぷるぷるで約5上がるので（合わせて約219）、220 にしておく
      var CAR_TALL = 220;
      var WOBBLE_MS = 1000;      // 赤で さわらないときの、ぷるぷる1回の長さ（ミリ秒）
      var WOBBLE_EVERY = 4000;   // ぷるぷるを くり返す間かく（ミリ秒）
      var BOX_GAP = 4;           // 信号の箱と、くるまの上のはしの間（px）
      var BOX_MAX_W = 520;       // 信号の箱の、いちばん大きい横幅（px）
      var BOX_MAX_H = 190;       // 信号の箱の、いちばん大きい高さ（px）
      var BOX_RATIO = 84 / 222;  // 信号の箱の 高さ ÷ 横幅
      // ゆっくり止まる（だんだん おそく。「同じ割合で速さが落ちる」形ちょうど）
      var EASE_STOP = "cubic-bezier(0.3333, 0.6667, 0.6667, 1)";

      // ページの部品
      var body = document.body;
      var signalEl = document.getElementById("signal");
      var signalArm = document.getElementById("signalArm");
      var signalPole = document.getElementById("signalPole");
      var roadEl = document.querySelector(".road");
      var stopLine = document.getElementById("stopLine");
      var carsLayer = document.getElementById("cars");
      var message = document.querySelector(".message");
      var muteBtn = document.getElementById("muteBtn");
      var homeBtn = document.getElementById("homeBtn");

      // 共通の部品
      var order = K.stage.randomOrder(IDS, function (id) { return K.cars.get(id).color; }, Math.random);

      // 指マーク：次に点く灯（青のときは赤、赤のときは青）を指す。
      // 開いた直後に出る。さわったら消えて、5秒さわらないと、また出る
      var hint = K.touch.createHint();
      document.body.appendChild(hint);
      var idleTimer = K.touch.hintTimer(onIdle);   // 最後にさわってから5秒を数える
      var idle = false;          // 5秒さわっていないか
      var wobbleTimer = null;    // 次のぷるぷるの予約（いつも1つだけ）
      var wobbleOffTimer = null; // いまのぷるぷるを止める予約

      // ===== 状態 =====
      // 信号の状態（light）：green・yellow・red。くるまの走りとは別に管理する
      var light = "green";
      var yellowTimer = null;    // 黄 → 赤の予約（いつも1つだけ。連打しても二重にならない）
      var spawnTimer = null;     // 次のくるまを出す予約（いつも1つだけ）
      var launchTimers = [];     // 列を順に走り出させる予約
      var queue = [];            // 列のくるま（止まった・止まりかけ・走り出す順番待ち）。先頭（停止線にいちばん近い）から順
      var runners = [];          // 走っているくるま（赤で止まらない・走りさるくるま）。列より いつも前（右）にいる
      var carById = {};          // くるまの箱の data-cid → くるま
      var carCounter = 0;
      var touched = false;       // 画面を一度でもさわったか（さわるまでは、くるまの音を鳴らさない）
      var lastToggle = 0;        // 前に信号を切りかえた時刻（動きを減らす設定のとき用）
      var reduceMotion = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
      var pendingId = null;      // 次に出す予定のくるま（入る場所を決めてから、出す）

      // ===== 大きさ・場所（layout で決める） =====
      var scale = 1;         // くるまを縮める率
      var speed = 220;       // 走る速さ（px / 秒）。どのくるまも同じ
      var stopFront = 300;   // 赤で止まるとき、先頭のくるまの前のはしを置く場所（画面の左から）
      var gapQ = 16;         // 列のくるまの間
      var layoutKey = "";    // 前に場所を決めたときの画面の形（同じなら、くるまは動かさない）

      function clamp(lo, v, hi) { return Math.max(lo, Math.min(hi, v)); }

      // ===== 今の場面を、<body> に書く（テストの台本が場面を待てるように） =====
      //   green・yellow・red（画面に見えて止まっているくるまが1台以下）・red-queue（2台以上）
      function updateScene() {
        var scene = light;
        if (light === "red") {
          var stopped = 0;
          for (var i = 0; i < queue.length; i++) if (queue[i].arrived && isVisible(queue[i])) stopped++;
          if (stopped >= 2) scene = "red-queue";
        }
        body.setAttribute("data-scene", scene);
      }

      // くるまの止まる場所（行き先）で、一部でも画面に見えるか
      function isVisible(c) { return c.x + c.w > 0; }

      // ===== 大きさと場所を決める（開いたとき・回転したとき） =====
      //   ① くるまの大きさ：2台目が半分以上見える横幅と、上に信号の箱が入る高さ の両方に合わせる
      //   ② 信号の箱：上の文字（とボタン）と くるまのあいだに、できるだけ大きく置く
      function layout() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        var road = roadEl.getBoundingClientRect();
        var lineLeft = stopLine.getBoundingClientRect().left;
        var tireY = road.bottom - road.height * TIRE_LINE;       // タイヤの下のはし（画面の上から）
        // 信号の箱の、いちばん上：上の文字より下で、大人用ボタン（上から 86px まで大きくなる）より下
        var topLimit = Math.max(message.getBoundingClientRect().bottom + 8, 88);
        var boxMin = clamp(64, h * 0.23, 110);                   // 信号の箱に、少なくともほしい高さ

        stopFront = lineLeft - clamp(6, w * 0.015, 18);          // 停止線の少し手前で止まる
        gapQ = clamp(8, w * 0.025, 28);
        speed = clamp(170, w * 0.32, 300);
        // 横：いちばん長いくるま（しょうぼうしゃなどの 310）の1台と半分より少し多く（480）が、停止線の左に入る大きさ
        var byWidth = (stopFront - gapQ) / 480;
        // 縦：タイヤの下から上へ、くるま → すきま → 信号の箱 → 上の文字 が重ならない大きさ
        var byHeight = (tireY - topLimit - boxMin - BOX_GAP) / CAR_TALL;
        scale = Math.max(0.3, Math.min(K.touch.fitScale(), byWidth, byHeight));

        placeSignal(w, topLimit, tireY - CAR_TALL * scale - BOX_GAP);
        placeHint();

        // 画面の形が変わっていなければ、くるまは動かさない（同じ知らせが何回も来るため）
        var key = [w, h, road.top, road.height, lineLeft, topLimit].join(",");
        if (key === layoutKey) return;
        layoutKey = key;
        rearrangeCars();
      }

      // 信号の箱と、柱・腕を置く。top〜bottom のあいだに、箱を入れる
      function placeSignal(w, top, bottom) {
        var edge = parseFloat(window.getComputedStyle(signalEl).right) || 40;
        var room = bottom - top;
        var maxW = Math.min(w - edge - 12, BOX_MAX_W);
        var boxH = Math.max(40, Math.min(room, maxW * BOX_RATIO, BOX_MAX_H));
        var boxTop = top + Math.max(0, room - boxH) * 0.55;      // あまった高さは、まん中より少し下寄り
        signalEl.style.top = boxTop + "px";
        signalEl.style.width = (boxH / BOX_RATIO) + "px";
        signalEl.style.height = boxH + "px";
        var armTop = boxTop + boxH / 2 - signalArm.offsetHeight / 2;
        signalArm.style.top = armTop + "px";
        signalPole.style.top = (armTop - 7) + "px";              // 柱の頭は、腕より少し上
      }

      // いるくるまを、新しい大きさと場所に合わせる（前のくるまから順に置くので、重ならない）
      function rearrangeCars() {
        // 走っているくるまの いまの位置は、大きさを変える前に読む。前（右）にいるものから順に
        var i;
        for (i = 0; i < runners.length; i++) runners[i].cur = curX(runners[i]);
        runners.sort(function (a, b) { return b.cur - a.cur; });
        var id;
        for (id in carById) {
          if (carById.hasOwnProperty(id)) applySize(carById[id]);
        }
        cancelLaunch();

        // 走っているくるま：前のくるまに重ならない位置から、走り直す（回転しても途中で消えない）
        var limit = Infinity;     // 次のくるまの、前のはしを置いてよい いちばん右
        for (i = 0; i < runners.length; i++) {
          var r = runners[i];
          var x = Math.min(r.cur, limit - r.w);
          jumpTo(r, x);
          runOut(r);
          limit = x - gapQ;
        }
        // 列のくるま：停止線の手前から、すぐに並べ直す（仕事の動きと音は出さない）
        var front = Math.min(stopFront, limit);
        for (i = 0; i < queue.length; i++) {
          var c = queue[i];
          jumpTo(c, front - c.w);
          c.arrived = true;
          front = c.x - gapQ;
        }

        if (light === "red") {
          settle();                      // 停止線の手前まで進めるくるまは、進む
          scheduleSpawn(queue.length ? SPAWN_RED : SPAWN_RED_FIRST);
        } else if (light === "green" && queue.length) {
          startLaunch(false);            // 走り出しの予約を作り直す
        }
        updateScene();
      }

      function applySize(c) {
        c.w = c.car.width * scale;
        c.box.style.width = c.w + "px";
        c.box.style.height = (c.car.height * scale) + "px";
        c.box.style.marginBottom = (-TIRE_GAP * scale) + "px";   // タイヤの下の余白ぶん、下げる
        c.size.style.transform = "scale(" + scale + ")";
      }

      // ===== 指マークの場所：次に点く灯の丸（上のほう）を、上から指す =====
      //   赤のときは左の青（横 44）、そのほかは右の赤（横 178）。数字は信号の絵の座標
      function placeHint() {
        var r = signalEl.getBoundingClientRect();
        var lampX = (light === "red") ? 44 : 178;
        var tipX = r.left + r.width * (lampX / 222);
        var tipY = r.top + r.height * (27 / 84);
        var fit = K.touch.hintFit(tipX, tipY, [message, homeBtn, muteBtn]);
        hint.style.setProperty("--hs", fit.scale);
        hint.style.left = (tipX - K.touch.HINT_TIP_X * fit.scale) + "px";
        hint.style.top = (tipY - K.touch.HINT_HEIGHT * fit.scale + fit.drop) + "px";
      }

      // ===== さわらないときの合図（指マークと、ぷるぷる） =====
      // 5秒さわらなかったとき。黄のあいだは出さずに、赤になってから出す（goRed で）
      function onIdle() {
        idle = true;
        if (light !== "yellow") showGuide();
      }

      function showGuide() {
        placeHint();
        K.touch.showHint(hint);
        if (light === "red") wobbleOnce();   // 出た直後に1回目
      }

      // 指マークと ぷるぷるを、すぐに止める（予約も消す）
      function clearGuide() {
        idle = false;
        K.touch.hideHint(hint);
        stopWobble();
      }

      // 止まっていて画面に見えるくるまを、いっしょに約1秒 ぷるぷるさせ、次の回を予約する（音は出さない）。
      // くるまの箱に .waiting を付け外しするだけ（ゆれ方は共通の CSS。動きを減らす設定では ゆれない）
      function wobbleOnce() {
        stopWobble();
        for (var i = 0; i < queue.length; i++) {
          var c = queue[i];
          if (c.arrived && isVisible(c)) c.box.classList.add("waiting");
        }
        wobbleOffTimer = setTimeout(removeWaiting, WOBBLE_MS);
        wobbleTimer = setTimeout(wobbleOnce, WOBBLE_EVERY);
      }

      function removeWaiting() {
        for (var id in carById) {
          if (carById.hasOwnProperty(id)) carById[id].box.classList.remove("waiting");
        }
      }

      function stopWobble() {
        clearTimeout(wobbleTimer);
        clearTimeout(wobbleOffTimer);
        removeWaiting();
      }

      // ===== くるまを作る・動かす =====
      function nextId() {
        if (!pendingId) pendingId = order.next();
        return pendingId;
      }

      // 図鑑のくるまを作って、画面の左の外に置く
      function makeCar() {
        var id = nextId();
        pendingId = null;
        var car = K.cars.create(id);
        var box = document.createElement("div");
        box.className = "car";
        var size = document.createElement("div");
        size.className = "car-size";
        size.style.width = car.width + "px";
        size.style.height = car.height + "px";
        var hopBox = document.createElement("div");
        hopBox.className = "kuruma-hop";
        var wobble = document.createElement("div");
        wobble.className = "kuruma-wobble";
        wobble.appendChild(car.el);
        hopBox.appendChild(wobble);
        size.appendChild(hopBox);
        box.appendChild(size);

        carCounter++;
        var c = {
          cid: "c" + carCounter, id: id, car: car, box: box, size: size,
          hopper: K.stage.hopper(hopBox),
          w: 0, x: 0, arrived: false, timer: null,
          moveStart: 0, moveMs: 0, moveDist: 0      // 止まる場所へ向かう動きの記録
        };
        box.setAttribute("data-cid", c.cid);
        carById[c.cid] = c;
        applySize(c);
        carsLayer.appendChild(box);                 // 画面に入れてから位置を決める（出発点が確定するように）
        jumpTo(c, K.stage.enterX(c.w));
        return c;
      }

      // 一瞬で x へ移す（アニメーションなし）
      function jumpTo(c, x) {
        clearTimeout(c.timer);
        c.box.classList.remove("moving");
        c.box.style.transition = "none";
        c.box.style.transform = "translateX(" + x + "px)";
        c.x = x;
        void c.box.offsetWidth;   // ブラウザに一度反映させる（次の移動がアニメーションになるように）
      }

      // ms ミリ秒かけて x へ動かす。動いているあいだだけ、タイヤが回る。終わったら onEnd(c)
      function driveTo(c, x, ms, ease, onEnd) {
        // 動いている途中なら、いまの位置で一度止めてから動き直す
        // （行き先が前と同じだと、前の動きがそのまま続いて、予約の時間とずれるため）
        if (c.box.classList.contains("moving")) jumpTo(c, curX(c));
        clearTimeout(c.timer);
        c.box.classList.remove("waiting");       // 走るくるまは、ぷるぷるしない
        c.box.style.transition = "transform " + ms + "ms " + ease;
        c.box.style.transform = "translateX(" + x + "px)";
        c.x = x;
        c.box.classList.add("moving");
        c.timer = setTimeout(function () {
          c.box.classList.remove("moving");
          if (onEnd) onEnd(c);
        }, ms);
      }

      // いまの（動いている途中の）左の位置
      function curX(c) {
        var t = window.getComputedStyle(c.box).transform;
        if (!t || t === "none") return c.x;
        var m = t.match(/^matrix\(([^)]+)\)/);
        if (m) return parseFloat(m[1].split(",")[4]);
        var m3 = t.match(/^matrix3d\(([^)]+)\)/);       // 4×4 の値の13番目が x
        return m3 ? parseFloat(m3[1].split(",")[12]) : c.x;
      }

      function removeFrom(list, c) {
        var i = list.indexOf(c);
        if (i >= 0) list.splice(i, 1);
      }

      // くるまを画面から消す
      function removeCar(c) {
        clearTimeout(c.timer);
        removeFrom(runners, c);
        removeFrom(queue, c);
        delete carById[c.cid];
        if (c.box.parentNode) c.box.parentNode.removeChild(c.box);
      }

      // ===== 次のくるまを出す予約（いつも1つだけ） =====
      function scheduleSpawn(delay) {
        clearTimeout(spawnTimer);
        spawnTimer = setTimeout(spawnTick, delay);
      }

      function spawnTick() {
        if (light === "green") {
          // 青：走っているくるまも、列もないときだけ、1台入れる（ふつうの1台ずつの流れ）
          if (runners.length === 0 && queue.length === 0) spawnPass();
        } else if (light === "red") {
          spawnQueueCar();
        }
        // 黄のあいだは出さない（赤になったときに、あらためて予約する）
      }

      // 青：左から入って、右へ走りさる（1台ずつ）
      function spawnPass() {
        var c = makeCar();
        runners.push(c);
        if (touched) K.sound.playDrive(0.8);   // 最初にさわるまでは、音を鳴らさない
        runOut(c);
      }

      // いつもの速さで、右の画面の外まで走りさる
      function runOut(c) {
        var exit = K.stage.exitX();
        var ms = Math.max(16, (exit - curX(c)) / speed * 1000);
        driveTo(c, exit, ms, "linear", function () {
          removeCar(c);
          afterCarGone();
        });
      }

      // 赤：列のうしろに1台つなぐ。
      //   ・一部でも見える場所なら、左から走ってきて、ゆっくり止まる
      //   ・まったく見えない場所なら、画面の左の外に そのまま並んで待つ（仕事の動きと音は出さない）
      function spawnQueueCar() {
        if (queue.length >= MAX_QUEUE) return;      // 満員。次に赤になるまで増えない
        var w = K.cars.get(nextId()).width * scale;
        var last = queue.length ? queue[queue.length - 1] : null;
        var target = (last ? last.x - gapQ : stopFront) - w;
        var visible = target + w > 0;

        // 前のくるまが近すぎるあいだは、少し待つ（重ならないように）
        if (visible) {
          var ahead = last ? [last] : runners;
          for (var i = 0; i < ahead.length; i++) {
            if (curX(ahead[i]) < K.stage.enterX(w) + w + gapQ) { scheduleSpawn(SPAWN_RETRY); return; }
          }
        } else if (last && !last.arrived) {
          scheduleSpawn(SPAWN_RETRY);
          return;
        }

        var c = makeCar();
        queue.push(c);
        if (visible) {
          // 前のくるまより早く着かないようにする（追いついて重ならないように）
          var minMs = (last && !last.arrived) ? last.moveStart + last.moveMs - Date.now() + 100 : 0;
          driveStop(c, target, minMs);
        } else {
          jumpTo(c, target);
          c.arrived = true;
        }
        updateScene();
        scheduleSpawn(SPAWN_RED);
      }

      // 止まる場所 target へ、だんだんおそくなりながら動かす。着いたら仕事の動きと音
      //   minMs … これより短い時間にはしない（省略できる）
      function driveStop(c, target, minMs) {
        c.arrived = false;
        var d = target - curX(c);
        // 走ってきた速さから、ちょうど止まる時間
        var ms = Math.max(800, 2 * d / speed * 1000, minMs || 0);
        c.moveStart = Date.now();
        c.moveMs = ms;
        c.moveDist = d;
        driveTo(c, target, ms, EASE_STOP, onStopped);
      }
      function onStopped(c) {
        c.arrived = true;
        // 仕事の動きと音は、赤のあいだに、画面に見える場所へ止まったときだけ（画面がかくれている間は出さない）
        if (light === "red" && isVisible(c) && !document.hidden) {
          c.car.work();     // 仕事の動き（図鑑のもの）を1回
          c.car.sound();    // 新しく止まった1台ぶんだけ
        }
        updateScene();
      }

      // くるまが1台、画面から出たあと。列も走りさったら、少しして、ふつうの流れに戻る
      function afterCarGone() {
        if (light === "green" && runners.length === 0 && queue.length === 0) {
          scheduleSpawn(SPAWN_GREEN);
        }
      }

      // ===== 信号の切りかえ =====
      function setLight(value) {
        light = value;
        signalEl.setAttribute("data-light", value);
        if (value !== "red") stopWobble();       // ぷるぷるは赤のときだけ
        updateScene();
      }

      // 赤のときの低くて丸い短い音（0.2秒）
      function playRedSound() {
        var ctx = K.sound.beginSound(0.2, false);
        if (!ctx) return;
        K.sound.tone(ctx, "sine", 330, 262, ctx.currentTime, 0.2, 0.3, 0);
      }

      // 青 → 黄（予約は1つだけ）
      function goYellow() {
        clearTimeout(yellowTimer);
        clearTimeout(spawnTimer);
        cancelLaunch();
        setLight("yellow");
        yellowTimer = setTimeout(goRed, YELLOW_MS);
      }

      // → 赤：まだ停止線を通りすぎていないくるまは、列になってゆっくり止まる
      function goRed() {
        clearTimeout(yellowTimer);
        clearTimeout(spawnTimer);
        cancelLaunch();
        lastToggle = Date.now();   // 自動の切りかえも、250ms の起点にする
        setLight("red");
        playRedSound();
        settle();
        scheduleSpawn(queue.length ? SPAWN_RED : SPAWN_RED_FIRST);
        if (idle) showGuide();     // 黄のあいだに5秒がたっていたら、ここで出す
      }

      // 赤になったとき：列と、まだ止まれる走行中のくるまを、前から順に止まる場所へ
      function settle() {
        var list = queue.slice();
        var i;
        for (i = runners.length - 1; i >= 0; i--) {
          var r = runners[i];
          // 前のはしが、止まる場所をこえているくるま（停止線を通りすぎるくるま）は、そのまま走りきる
          if (curX(r) + r.w <= stopFront + 2) {
            list.push(r);
            runners.splice(i, 1);
          }
        }
        for (i = 0; i < list.length; i++) list[i].cur = curX(list[i]);
        list.sort(function (a, b) { return b.cur - a.cur; });   // 停止線にいちばん近いものが先頭
        queue = list;

        var prev = null;
        for (i = 0; i < queue.length; i++) {
          var c = queue[i];
          var target = (prev === null) ? stopFront - c.w : prev - gapQ - c.w;
          if (target < c.cur) target = c.cur;                    // うしろへは戻らない
          prev = target;
          var d = target - c.cur;
          if (d > 2) {
            driveStop(c, target);                                // 止まる場所へ、ゆっくり
          } else {
            jumpTo(c, target);                                   // もう着いている（走っていた動きは止める）
            if (!c.arrived) onStopped(c);
          }
        }
        updateScene();
      }

      // 赤 → 青：列の先頭から順に走り出す
      function goGreen() {
        clearTimeout(yellowTimer);
        clearTimeout(spawnTimer);
        cancelLaunch();
        setLight("green");
        K.sound.playArrive();

        if (queue.length === 0) {
          // 列がなければ、少しして、くるまが左から入ってくる
          scheduleSpawn(runners.length === 0 ? SPAWN_GREEN : SPAWN_GREEN + 600);
          return;
        }
        startLaunch(true);
      }

      // 列の走り出しを予約する（playSound：音を鳴らすのは、先頭の1台だけ）。
      // 重ならないための決まり：どのくるまも同じ走り出し方なので、前のくるまが先に走り出せば追いつかない。
      //   ・止まっているくるまは、順番が来たら走り出す
      //   ・まだ走ってきている先頭のくるまは、止まらずに、そのまま速くなって走りさる
      //   ・まだ走ってきている2台目からは、いちど自分の場所に着いてから走り出す
      function startLaunch(playSound) {
        var list = queue.slice();
        var now = Date.now();
        var prevStart = 0;     // 前のくるまが、列の場所から走り出すのと同じになる時間（今から、ミリ秒）
        for (var i = 0; i < list.length; i++) {
          var c = list[i];
          if (i === 0 && !c.arrived) {
            var u = speedOf(c, now);
            prevStart = passDelay(c.x - curX(c), u);   // もとの止まる場所を通りすぎる時間
            launchCar(c, u, playSound);
            continue;
          }
          var delay = (i === 0) ? LAUNCH_FIRST
                                : prevStart + (isVisible(c) ? LAUNCH_STEP : LAUNCH_STEP_OUT);
          if (!c.arrived) delay = Math.max(delay, c.moveStart + c.moveMs - now);
          scheduleLaunch(c, delay, playSound && i === 0);
          prevStart = delay;
        }
      }

      function scheduleLaunch(c, delay, withSound) {
        launchTimers.push(setTimeout(function () { launchCar(c, 0, withSound); }, delay));
      }

      // 止まる場所へ向かっているくるまの、いまの速さ（px / 秒）
      function speedOf(c, now) {
        var p = clamp(0, (now - c.moveStart) / c.moveMs, 1);
        return clamp(0, 2 * c.moveDist / (c.moveMs / 1000) * (1 - p), speed);
      }

      // 速さ u から速くなりながら、距離 d を進むのにかかる時間（ミリ秒）
      function passDelay(d, u) {
        var a = speed / (ACCEL_MS / 1000);                  // 1秒ごとに増える速さ
        var accelDist = (speed * speed - u * u) / (2 * a);  // いつもの速さになるまでに進む距離
        var sec = (d <= accelDist)
          ? (Math.sqrt(u * u + 2 * a * Math.max(0, d)) - u) / a
          : (speed - u) / a + (d - accelDist) / speed;
        return sec * 1000;
      }

      // 1台を走り出させる：速さ u（止まっていれば 0）から、いつもの速さまで速くなり、そのまま走りさる
      function launchCar(c, u, withSound) {
        removeFrom(queue, c);
        runners.push(c);
        c.arrived = true;
        if (withSound) K.sound.playDrive(0.8);
        var ms = ACCEL_MS * (speed - u) / speed;            // 速くなっている時間
        var x1 = curX(c) + (u + speed) / 2 * ms / 1000;     // 速くなり終わる場所
        if (ms < 16 || x1 >= K.stage.exitX()) {
          runOut(c);
        } else {
          // はじめの速さと終わりの速さに合わせた、「同じ割合で速くなる」動きの形
          var k = 2 * u / (u + speed);
          var ease = "cubic-bezier(0.3333, " + (k / 3).toFixed(4) + ", 0.6667, " + ((k + 1) / 3).toFixed(4) + ")";
          driveTo(c, x1, ms, ease, runOut);
        }
        updateScene();
      }

      // 走り出しの予約を、全部やめる（まだ走り出していないくるまは、列に残る）
      function cancelLaunch() {
        for (var i = 0; i < launchTimers.length; i++) clearTimeout(launchTimers[i]);
        launchTimers = [];
      }

      // 黄のあいだにさわったとき：信号の箱が、1回だけ小さくはねる
      function bounceSignal() {
        signalEl.classList.remove("bounce");
        void signalEl.getBoundingClientRect();   // ブラウザに一度反映させる（やり直せるように）
        signalEl.classList.add("bounce");
      }
      signalEl.addEventListener("animationend", function () {
        signalEl.classList.remove("bounce");
      });

      function toggleLight() {
        // 黄は、いつも決まった時間だけ点く（さわっても早送りしない）
        if (light === "yellow") {
          bounceSignal();
          return;
        }
        // 動きを減らす設定のときだけ：前の切りかえから 250ms たたないうちのさわりは、無視（点滅に見えないように）
        var now = Date.now();
        if (reduceMotion && reduceMotion.matches && now - lastToggle < 250) return;
        lastToggle = now;
        if (light === "green") goYellow();
        else goGreen();
      }

      // ===== くるまをさわったとき（無反応にしない） =====
      function carTap(c) {
        if (!c) return;
        if (queue.indexOf(c) >= 0 && c.arrived) {
          // 止まっているくるま：仕事の動き＋音
          c.car.work();
          c.car.sound();
        } else {
          // 走っているくるま：「プッ」と小さくはねる
          K.sound.playHorn();
          c.hopper.hop();
        }
      }

      // ===== 画面のどこかに指がふれた瞬間 =====
      // （大人用のボタンへのタッチと、2本目からの指は、共通の部品が はぶいてくれる）
      K.touch.onTap(function (e) {
        var carEl = e.target && e.target.closest ? e.target.closest(".car") : null;
        if (carEl) {
          carTap(carById[carEl.getAttribute("data-cid")]);
          return;
        }
        toggleLight();
      });

      // 一度でもさわったら（信号・大人用ボタンのどれでも）、くるまの音を鳴らしてよい。
      // 合図（指マーク・ぷるぷる）は すぐ止めて、5秒を数え直す
      // （この受け取りは、上の onTap より先に呼ばれる）
      document.addEventListener("pointerdown", function () {
        touched = true;
        K.sound.prepare();   // 音の準備（iPhone・iPad 用）
        clearGuide();
        idleTimer.restart();
      }, true);
      // 画面がかくれたら、さわる前の状態にもどす（もどったとき、いきなり音が鳴らないように）
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          touched = false;
          idleTimer.stop();      // かくれている間は、合図の予約を止める
          clearGuide();
          return;
        }
        // もどったとき：かくれていた間は、予約と動きの時間がずれることがあるので、重ならないように並べ直す
        rearrangeCars();
        afterCarGone();
        idleTimer.restart();     // 5秒を数え直す
      });
      // 長押しメニューを出さない
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      // 画面の大きさ・回転が変わったら、場所と大きさを計算し直す
      K.touch.onViewportChange(layout);

      // ===== 大人用のボタン =====
      // 音を消す・出すを切りかえたら、ボタンの大きさが変わるので、指マークの場所を計算し直す
      K.touch.setupMuteButton(muteBtn, function () {
        placeHint();
        setTimeout(placeHint, 250);
      });
      K.touch.setupHomeButton(homeBtn, HOME_URL);

      // ===== 最初の準備：青から始める（最初のくるまが、少しして左から入ってくる） =====
      layout();
      K.touch.showHint(hint);    // 開いた直後の指マーク
      setLight("green");
      scheduleSpawn(500);
      idleTimer.restart();
    })();
  </script>

</body>
</html>
