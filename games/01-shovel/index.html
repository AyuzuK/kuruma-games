<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホやタブレットでもちょうどいい大きさで表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>しょべるかー</title>

  <style>
    /* ===== 画面全体 ===== */
    html, body {
      touch-action: none;            /* 2本指の拡大・ダブルタップ拡大・スクロールを止める */
      overscroll-behavior: none;     /* 画面のはしを引っぱったときの「びよーん」を止める */
    }

    body {
      margin: 0;
      height: 100vh;                 /* 古いブラウザ用 */
      height: 100dvh;                /* アドレスバーの出し入れに合わせた高さ */
      overflow: hidden;              /* はみ出してもスクロールバーを出さない */
      background: #d8f0ff;           /* 空の色（背景の絵が出るまでの、念のための色） */
      font-family: sans-serif;
      -webkit-user-select: none;     /* 連打しても文字が選択されないように（Safari用） */
      user-select: none;
      -webkit-touch-callout: none;   /* 長押ししてもメニューが出ないように（iPhone/iPad用） */
      -webkit-tap-highlight-color: transparent; /* タップ時の青いハイライトを消す */
    }

    /* 上に出すメッセージ */
    /* 広い画面（横幅 560px 以上）：右上の2つのボタン（音を消す・トップ画面へ戻る）と重ならないように、
       左右に 160px ずつあけて、まん中に出す。文字の大きさは、あいている幅に入るようにする
       （横幅 667px で 約 29px、768px 以上で 32px）。折り返さない（いつも1行） */
    .message {
      text-align: center;
      font-size: clamp(18px, calc((100vw - 320px) / 12), 32px);
      padding: 0 160px;
      white-space: nowrap;
      font-weight: bold;
      /* 端末に入っている、丸みのある書体を先に試す（なければ ふつうの書体）。外から読み込まない */
      font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", system-ui, sans-serif;
      color: #5a3d1e;                /* こげ茶（車の線と同じ色） */
      /* 白いふちどり：白い影を上下左右ななめに少しずつずらして重ねる */
      text-shadow:
        3px 0 0 #fff, -3px 0 0 #fff, 0 3px 0 #fff, 0 -3px 0 #fff,
        2px 2px 0 #fff, -2px 2px 0 #fff, 2px -2px 0 #fff, -2px -2px 0 #fff,
        0 0 6px #fff;
      margin-top: 30px;
      position: relative;            /* z-index を効かせるために必要 */
      z-index: 1;                    /* 車や地面と重なっても、文字を手前に出す */
    }
    /* せまい画面（横幅 560px より小さい。スマホ縦など）：ボタンの段より下（上から 92px）に出す。
       92px は、音を消しているボタン（64px）を押して 1.3倍になったときの下のはし 85.6px ＋ 6px */
    @media (max-width: 559.98px) {
      .message {
        margin-top: 92px;
        padding: 0 12px;
        font-size: clamp(20px, 6vw, 32px);
      }
    }

    /* =====================================================
       背景（2つの層）
         .scenery … 上 75%：空・太陽・雲・丘・茂み・木・草地・土の山
         .ground  … 下 25%：土と小石（ショベルカーはこの上のふちを走る）
       ===================================================== */
    .scenery {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      /* 地面の層と 2px 重ねる（画面の高さが端数のとき、境目に 1px のすき間が出ないように）。
         重なった 2px は、あとに書いてある地面の層の下にかくれる */
      height: calc(75vh + 2px);
      height: calc(75dvh + 2px);
      overflow: hidden;              /* 雲などのはみ出しを切る */
      /* 丘の絵の高さ。横幅の 1/3 か、この層の高さの 42% の、大きいほう（ただし 92% まで）。
         こうすると、丘の絵はいつも「高さ」に合わせて縮むので、木の根もとの高さを % で合わせられる */
      --hills: min(max(33.4vw, 42%), 92%);
      /* 太陽（右上。輪郭なしで、ふんわりにじむだけ）と、空のグラデーション（上が濃く、下がうすい） */
      background:
        radial-gradient(circle 20vmin at 80% 13%,
          #fff6c8 0%, rgba(255, 246, 200, 0.85) 30%, rgba(255, 246, 200, 0) 100%),
        linear-gradient(#8ccbf0 0%, #d8f0ff 100%);
    }

    /* 縦長の画面（スマホ縦・タブレット縦）では、丘を高めにして、上半分が空だけにならないようにする。
       木は .trees の「26vw まで」の上限があるので、大きくなりすぎない */
    @media (orientation: portrait) {
      .scenery { --hills: min(max(33.4vw, 56%), 92%); }
    }

    /* 雲：画面2つぶんの横長の帯に、同じ並びを2回くり返して置き、とてもゆっくり左へ流す。
       帯の半分（= 画面1つぶん）動いたところで最初に戻るので、つなぎ目が見えない。
       雲の帯は、上から 84px より下に置く。上の文字（上から 30〜75px くらい）と、
       右上の音を消すボタン（上から 12〜76px）の後ろを、雲が流れて通らないようにするため。
       帯の高さは「空の層の高さ − 84px − 丘の高さの 6割」（丘の上のほうまで雲を散らす）。
       雲は帯の中の % で置くので、画面の縦横が変わっても、帯の中におさまる */
    .clouds {
      position: absolute;
      left: 0;
      top: 84px;
      width: 200%;
      height: max(60px, calc(100% - 84px - var(--hills) * 0.6));
      animation: kumo 160s linear infinite; /* 1周 160秒 */
    }
    @keyframes kumo {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    .cloud {
      position: absolute;
      display: block;
      height: auto;
      aspect-ratio: 120 / 56;
    }
    .cloud-l { width: clamp(100px, 13vw, 200px); }
    .cloud-m { width: clamp(80px, 10vw, 150px); }
    .cloud-s { width: clamp(60px, 7vw, 110px); }

    /* 低い雲：縦長の画面だけに出す（空が広いので、少し下にも雲を散らす） */
    .cloud-low { display: none; }
    @media (orientation: portrait) {
      .cloud-low { display: block; }
    }

    /* 高さの低い画面（スマホ横向きなど）：空がせまいので、雲を小さく・少なくする */
    @media (max-height: 500px) {
      .cloud-l { width: 76px; }
      .cloud-m { width: 60px; }
      .cloud-s { display: none; }
    }

    /* 丘・茂み・草地（下のはしを、地面の上のふちにぴったり合わせる） */
    .hills {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: var(--hills);
      display: block;
    }

    /* 木（左右に2本ずつ）。画面のはしに合わせて置くので、どの画面でも左右に見える。
       根もとは、丘の絵の草地のおくのふち（丘の絵の高さの 20% のところ）に合わせる */
    .trees {
      position: absolute;
      bottom: calc(var(--hills) * 0.2);
      height: min(calc(var(--hills) * 0.6), 26vw); /* スマホ縦向きで大きくなりすぎないように */
      width: auto;
      aspect-ratio: 200 / 160;
      display: block;
    }
    .trees-left  { left: -1vw; }
    .trees-right { right: -1vw; }

    /* 土の山：まん中より少し右の奥。大きさはショベルカーの高さの 4割くらい（半分以下） */
    .mound {
      position: absolute;
      left: 54%;
      bottom: 0;
      /* ショベルカーの高さ（220px × 縮小率 0.5〜1）の 0.4 倍 */
      height: max(44px, min(88px, 14.6vw, 17.6vh));
      width: auto;
      aspect-ratio: 200 / 100;
      display: block;
    }

    /* 地面（下 25%） */
    .ground {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 25vh;
      height: 25dvh;
      background: #c48d5c;           /* 土の色 */
      overflow: hidden;
    }
    .ground-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 手前の草の株（左下・下のまん中・右下）。ショベルカーより奥に描く */
    .tuft {
      position: absolute;
      bottom: 3%;
      height: clamp(24px, 6vh, 46px);
      width: auto;
      aspect-ratio: 60 / 40;
      display: block;
    }
    .tuft-left   { left: 3%; }
    .tuft-center { left: 46%; }
    .tuft-right  { right: 3%; }

    /* 木・雲・草の株の形を1か所に書いておくための、見えない SVG */
    .svg-defs {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    /* ===== ショベルカー全体 =====
       4つの箱を重ねて、役割を分けています。
         .shovel        … 左右の「位置」を受け持つ（右に動く）
         .shovel-size   … 「大きさ」を受け持つ（小さい画面では縮める）
         .shovel-hop    … 「はねる」を受け持つ（走りぬけ中にさわると、1回ぴょんとはねる）
         .shovel-wobble … 「ぷるぷる」を受け持つ（待っているあいだ揺れる）
       1つの箱で全部やろうとすると、動きどうしがぶつかるためです。
       指マーク（.finger-hint）は、.shovel の中で .shovel-size の外に置いています。
       そうすると車といっしょに左右に動き、ぷるぷるの揺れや、縮める・はねる動きは受けません */
    .shovel {
      position: absolute;
      left: 0;
      bottom: 25vh;
      bottom: 25dvh;                 /* 地面の上に乗せる */
      width: 300px;                  /* JavaScript の CAR_WIDTH と同じにする */
      height: 220px;
      /* 動く速さ（transition）は、距離に合わせて JavaScript の moveTo で決めています */
    }

    .shovel-size,
    .shovel-hop,
    .shovel-wobble {
      position: absolute;
      inset: 0;                      /* 親の箱いっぱいに広げる */
    }

    .shovel-size {
      transform-origin: left bottom; /* 縮めるときは左下を基準にする（地面から浮かないように） */
    }

    .shovel-wobble {
      transform-origin: center bottom;
    }

    /* ショベルカーの絵（SVG）。アームが動いて枠の外に出ても切れないように overflow: visible */
    .shovel-svg {
      position: absolute;
      left: 0;
      top: 0;
      width: 300px;
      height: 220px;
      overflow: visible;
      display: block;
    }

    /* 待っているあいだ（.waiting が付いているあいだ）だけ、ぷるぷる揺らす */
    .shovel.waiting .shovel-wobble {
      animation: purupuru 0.5s ease-in-out infinite;
    }

    @keyframes purupuru {
      0%   { transform: translateY(0)    rotate(0deg); }
      25%  { transform: translateY(-4px) rotate(-1.5deg); }
      50%  { transform: translateY(0)    rotate(0deg); }
      75%  { transform: translateY(-4px) rotate(1.5deg); }
      100% { transform: translateY(0)    rotate(0deg); }
    }

    /* ===== 走りぬけ中にさわったときの「ぴょん」 =====
       .hop が付くと、0.3秒で1回だけ上にはねて、元の高さに戻る。
       位置の箱（.shovel）ではなく、この層を動かすので、走りぬけの移動や戻る時刻は変わらない。
       「その場にとどまる」設定（fill-mode）を付けていないので、終わると必ず元の高さに戻る。
       はねる高さ 12px は、縮める層の内がわなので、画面では 6〜12px になる（縮める率 0.5〜1） */
    .shovel-hop.hop {
      animation: pyon 0.3s ease-out;
    }
    @keyframes pyon {
      0%   { transform: translateY(0); }
      40%  { transform: translateY(-12px); }  /* いちばん高いところ */
      100% { transform: translateY(0); }
    }

    /* ===== 指マーク「さわってね」 =====
       運転席の上に出す、下向きの指。.shovel の中にあるので、車といっしょに左右に動く。
       車の大きさ（縮める率）は JavaScript が --s に入れてくれるので、
       その値を使って、運転席の真上にくるように場所を決めている。
         横：運転席の横の窓のまん中（車の絵の x = 68 くらい）の上に、指先がくるように
         縦：運転席の屋根（車の絵の下から 192 のところ）に、指先がちょうど乗るように
       ただし、高さの低い画面（スマホ横向きでアドレスバーが出ているときなど）では、
       そのままだと上の文字「さわると うごくよ！」に届いてしまう。そのときは JavaScript の
       placeHint() が、--hs（指マークを小さくする率、0.75 まで）と --hd（下げる量）を入れてくれる */
    .finger-hint {
      position: absolute;
      /* 指先のまん中は、絵の中の x 25.75 のところ。そこが車の絵の x = 68 くらい
         （から 2.5px 左）にくるように、左はしを 28.25px（× 指マークを小さくする率）左にずらす。
         （これまでの版の指先と同じ場所に、指先がくるようにしてある） */
      left: calc(68px * var(--s, 1) - 28.25px * var(--hs, 1));
      bottom: calc(192px * var(--s, 1) - var(--hd, 0px));
      width: calc(40px * var(--hs, 1));
      height: calc(48px * var(--hs, 1));  /* JavaScript の HINT_HEIGHT と同じにする */
      z-index: 1;                    /* 指先が屋根に重なったとき、車の絵より手前に出す */
      pointer-events: none;         /* 指マークがタッチを吸わないように（上をさわっても車が動く） */
      /* ふだんは見えない。消えるときは 0.4秒かけて、ふわっとうすくなる
         （うすくなりきってから visibility も hidden にする） */
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0s linear 0.4s;
    }
    /* .show が付いているあいだ見える。出るときも 0.4秒かけて、ふわっと */
    .finger-hint.show {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.4s ease, visibility 0s;
    }
    .finger-hint svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      /* ゆっくり上下（1往復 1秒）。指先が屋根を「ちょん」とつつくように、下へ 8px 動く。
         上には動かないので、上の文字に近づくことはない */
      animation: tsuntsun 1s ease-in-out infinite;
    }
    @keyframes tsuntsun {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(8px); }
    }

    /* ===== SVG の部品を回すときの決まり =====
       回したい部品は、まず「関節（回る中心）の場所へ translate で移した <g>」の中に入れ、
       その中で、関節が (0, 0) になるように描いてあります。
       そのうえで、中の <g> を回すと、(0, 0) = 関節を中心に回ります。
       （iPhone の Safari で回る中心がずれないように、transform-origin の計算にたよらない方法） */
    .spin,
    .boom-rot,
    .stick-rot,
    .bucket-rot {
      transform-origin: 0 0;         /* SVG ではもともと 0 0。念のため書いておく */
    }

    /* ===== 車輪とローラーが回る（動いているあいだ .moving が付く） ===== */
    .shovel.moving .spin {
      animation: kururu 0.5s linear infinite;
    }
    .shovel.moving .spin-fast {
      animation-duration: 0.3s;      /* 小さいローラーは速めに回す */
    }
    @keyframes kururu {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* キャタピラのでこぼこ：点線のずらし位置を動かして、流れるように見せる。
       1つぶん（でこぼこ 6 ＋ すき間 6 = 12）動いたら最初に戻るので、つなぎ目が見えない */
    .shovel.moving .tread {
      animation: gotogoto 0.25s linear infinite;
    }
    @keyframes gotogoto {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: -12; }
    }

    /* ===== アームが動く「ガシャン」 =====
       #armGroup に .scoop が付いたら、関節ごとに1回だけ動いて戻る（0.5秒）。
       40%（= 0.2秒）で下がりきる。音の「ガシャン」もここで鳴る。
       入れ子なので角度は足し算になる（バケットは合わせて 9 + 11 + 18 = 38度）。
       アニメーションが終わると、もとの形（0度）に戻る */
    #armGroup.scoop .boom-rot   { animation: boomGashan   0.5s ease-in-out; }
    #armGroup.scoop .stick-rot  { animation: stickGashan  0.5s ease-in-out; }
    #armGroup.scoop .bucket-rot { animation: bucketGashan 0.5s ease-in-out; }
    @keyframes boomGashan {
      0%   { transform: rotate(0deg); }
      40%  { transform: rotate(9deg); }   /* ブームが少し下がる */
      100% { transform: rotate(0deg); }
    }
    @keyframes stickGashan {
      0%   { transform: rotate(0deg); }
      40%  { transform: rotate(11deg); }  /* スティックが手前に引かれる */
      100% { transform: rotate(0deg); }
    }
    @keyframes bucketGashan {
      0%   { transform: rotate(0deg); }
      40%  { transform: rotate(18deg); }  /* バケットがくるっと土をすくう */
      55%  { transform: rotate(18deg); }  /* 少しだけ止まって「すくった」感じを出す */
      100% { transform: rotate(0deg); }
    }

    /* ===== 動きを減らす設定の端末では、ぷるぷる・雲の流れ・指マークの上下を止める =====
       （指マーク自体は表示する。走りぬけ中の「ぴょん」は、さわったときの小さな返事なので残す） */
    @media (prefers-reduced-motion: reduce) {
      .shovel.waiting .shovel-wobble { animation: none; }
      .clouds { animation: none; }
      .finger-hint svg { animation: none; }
    }

    /* ===== 音を消すボタン（右上） ===== */
    .mute-btn {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 2;                    /* いちばん手前に出す */
      width: 52px;
      height: 52px;
      padding: 0;
      border: 3px solid transparent;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      font-size: 24px;
      line-height: 1;
      opacity: 0.6;                  /* 音が出ているときは目立たせない（子どもが気にしないように） */
      cursor: pointer;
      transition: transform 0.2s;
    }
    /* 長押ししているあいだ、2秒かけて少しずつ大きくなる（「押せているよ」の合図） */
    .mute-btn.pressing {
      transform: scale(1.3);
      transition: transform 2s linear;
    }
    /* 音を消しているときは、はっきり見えるようにする */
    .mute-btn.muted {
      width: 64px;
      height: 64px;
      font-size: 32px;
      opacity: 1;
      background: #fff;
      border-color: #e53935;         /* 赤いふち */
    }

    /* ===== トップ画面へ戻るボタン（右上。音を消すボタンの左どなり） =====
       見た目は音を消すボタンと同じ（52px の丸、うすい白、目立たせない）。中は、おうちの形の絵。
       ボタンの右はしが、画面の右から 96px。音を消しているボタン（64px）が押されて 1.3倍になっても、
       10px くらい あく */
    .home-btn {
      position: fixed;
      top: 12px;
      right: 96px;
      z-index: 2;
      width: 52px;
      height: 52px;
      padding: 0;
      border: 3px solid transparent;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      opacity: 0.6;
      cursor: pointer;
      touch-action: none;            /* 長押しのあいだ、画面が動かないように */
      display: flex;                 /* 中の絵を、ボタンのまん中にそろえる */
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }
    .home-btn svg {
      display: block;
      width: 26px;
      height: 26px;
      pointer-events: none;          /* 中の絵をさわっても、ボタンをさわったことにする */
    }
    /* 長押ししているあいだ、2秒かけて少しずつ大きくなる */
    .home-btn.pressing {
      transform: scale(1.3);
      transition: transform 2s linear;
    }
  </style>
</head>
<body>

  <!-- 木・雲・草の株の形（ここに1回だけ書いて、<use> で何回も使う）。この SVG 自体は見えない -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <!-- 木1本。根もとが (0, 0)、上に向かって y がマイナスになる -->
      <g id="tree">
        <!-- ふちどり：葉の丸を少し大きくして、こげ茶で先に塗っておく（外側だけが線に見える） -->
        <g fill="#5a3d1e">
          <circle cx="-20" cy="-88" r="28"/>
          <circle cx="20" cy="-90" r="28"/>
          <circle cx="0" cy="-82" r="26"/>

    <div class="finger-hint show" id="fingerHint" aria-hidden="true">
      <!-- 手の絵（横 40 × 縦 48）。右手の甲をこちらに向けて、人さし指を立てて下をさしている形。
           ・上に青いそで口を付けて「手首から先の手」だと分かるようにする
           ・手の甲の下のはしは、にぎった指の付け根の丸い山が3つ（左がわ）。山のあいだに境目の線
           ・人さし指は右寄りで、長くはっきり。指先は下（y 47、指先のまん中は x 25.75）
           ・人さし指は手の甲とひと続きの形で描く（手の甲の上に、指のふちの線を出さない）。
             人さし指と、となりのにぎった指のあいだにだけ、短い境目の線を入れる
           ・親指は、人さし指の右うしろに、少しななめにそわせる
           ・色は空の白い雲とまぎれないように、クリーム色の肌＋こげ茶のふちどり

      <svg viewBox="0 0 40 48" focusable="false">
        <defs>
          <!-- 白いふち用の形（手全体のかげ絵：そで口・親指・手の甲から人さし指までのひと続きの形）。

        </defs>

          <!-- 手の甲＋にぎった指＋人さし指（ひと続きの形。手の甲の上に線を出さない）。

          <path d="M 9 8.5 L 28 8.5 C 29.8 8.5, 30.5 9.5, 30.5 11.5 L 30.5 42.25 A 4.75 4.75 0 0 1 21 42.25 L 21 28.5 C 21 31.5, 17.5 31.5, 16.5 30 C 15.5 32, 12 32, 11 30 C 9 31, 6 30, 6 27.5 L 6 12 C 6 9.5, 7 8.5, 9 8.5 Z" fill="#ffe2bd"/>

        <svg class="shovel-svg" viewBox="0 0 300 220" aria-hidden="true" focusable="false">

            <clipPath id="cabClip"><path d="M 34 115 L 34 46 Q 34 28 52 28 L 104 28 Q 119 28 121 43 L 126 115 Z"/></clipPath>
            <clipPath id="bucketClip"><path d="M -8 -4 L 38 -6 Q 62 10 58 34 Q 54 60 26 64 L 2 64 Q -6 64 -6 58 Q 12 28 -8 -4 Z"/></clipPath>
            <!-- キャタピラの形（カプセル形）。まわりの長さがちょうど 300 になるように作ってある。
                 動くでこぼこ（.tread）は、iPhone の Safari で <use> へのアニメーションが止まることがあるので、

            <path id="trackShape" d="M 35 165 L 106.46 165 A 25 25 0 0 1 106.46 215 L 35 215 A 25 25 0 0 1 35 165 Z"/>

          <g stroke="#5a3d1e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">

            <ellipse cx="92" cy="215" rx="90" ry="7" fill="#8a5a38" opacity="0.35" stroke="none"/>

            <rect x="36" y="150" width="96" height="18" rx="5" fill="#4a4a4a"/>

            <!-- ===== 煙突（煙は出さない） ===== -->

            <g id="armGroup">
              <!-- ブームの付け根の関節 (120, 120) -->
              <g transform="translate(120 120)">
                <g class="boom-rot">
                  <!-- 油圧シリンダー2（ブームの上がわ）：折れ目の背中から、スティックの上のはしへ。

                       棒の先は、スティックの上のはしの裏に重ねる。

                  <line x1="26.2" y1="-91.9" x2="46.3" y2="-113.4" stroke-width="5"/>

                  <!-- ブーム：付け根 (0,0) → 上に「く」の字に折れる (20,-68) → 先 (55,-100)。
                       太さは、付け根 24 → 折れ目 22 → 先 18 と、少しずつ細くなる。
                       折れ目の背中がわは、大きく丸めて、どっしりした形にする -->
                  <path fill="#f7c33c"
                        d="M 11.5 3.4 L 28 -56.2 Q 29.7 -62 34.1 -66 L 61.1 -93.4 A 9 9 0 0 0 48.9 -106.6 L 18.5 -81.5 Q 10.3 -74.1 7.2 -63.4 L -11.5 -3.4 A 12 12 0 0 0 11.5 3.4 Z"/>
                  <!-- ブームの明るいところ（背中がわ） -->
                  <path d="M -1.8 -14.5 L 12.4 -62 Q 14.7 -71.3 22 -77.5 L 45 -98" fill="none" stroke="#ffd96b" stroke-width="4"/>
                  <!-- シリンダー2の付け根のピン（ブームの背中に付いている） -->
                  <circle cx="9.8" cy="-74.4" r="3.5" fill="#ffd96b" stroke-width="2"/>

                  <!-- 油圧シリンダー1（ブームの下がわ）：車体の前から、ブームの折れ目の近くへ。
                       下のはしは車体の裏にかくれる -->
                  <line x1="22.6" y1="-13" x2="28" y2="-50" stroke-width="5"/>

  <!-- 共通の BGM（最初にさわったときから鳴る。音を消すボタンの処理は、下の setMuted から BGM にも伝える） -->
  <script src="../../shared/kuruma-bgm.js"></script>

  <script>
    // ===== 設定（数字を変えると動きが変わります） =====
    const CAR_WIDTH = 300;   // ショベルカーのもともとの横幅（ピクセル）。CSS の .shovel の width と、SVG の横幅と同じ
    const START_X = 20;      // スタート地点（左からの距離）
    const TAPS_TO_END = 6;   // だいたい何回さわると右はしに着くか
                             // （スマホでは1歩の最低距離40pxがあるので、少し少なくなります）
    const MOVE_TIME = 600;   // ふつうの1歩にかかる時間（ミリ秒）
    const MAX_MOVE_TIME = 1500; // 画面の外を回るときの1回の移動の上限（ミリ秒）。待ち時間が長くなりすぎないように
    const WAIT_TIME = 1500;  // さわらなくなってから、ぷるぷるを始めるまでの時間（ミリ秒）
    const HINT_TIME = 5000;  // 最後にさわってから、指マークをもう一度出すまでの時間（ミリ秒）
    const HORN_GAP = 200;    // クラクション「プッ」を、次に鳴らせるまでの間隔（ミリ秒）
    const HINT_HEIGHT = 48;  // 指マークの、もともとの高さ（ピクセル）。CSS の .finger-hint と同じ
    const HINT_MIN_SCALE = 0.75; // 低い画面で、指マークをどこまで小さくしてよいか（0.75 = 4分の3）
    const HINT_GAP = 6;      // 上の文字と指マークのあいだに、最低これだけあける（ピクセル）

    // ----- 音の設定 -----
    const VOLUME = 0.5;          // 全体の音量（0〜1。0.5 = 最大の半分くらい）
    const MAX_VOICES = 3;        // 同時に鳴らす音の数の上限（連打しても音が重なりすぎないように）
    const LONG_PRESS_TIME = 2000; // 音を消すボタン・トップ画面へ戻るボタンの長押し時間（ミリ秒）
    const HOME_URL = "../../index.html"; // トップ画面

    // ショベルカーの部品を取り出す
    const shovel = document.getElementById("shovel");
    const shovelSize = document.getElementById("shovelSize");
    const armGroup = document.getElementById("armGroup");   // SVG の中の、アーム全体のグループ
    const muteBtn = document.getElementById("muteBtn");
    const homeBtn = document.getElementById("homeBtn");      // トップ画面へ戻るボタン
    const shovelHop = document.getElementById("shovelHop");   // 「ぴょん」とはねる層
    const fingerHint = document.getElementById("fingerHint"); // 指マーク
    const message = document.querySelector(".message");       // 上の文字「さわると うごくよ！」

    let x = START_X;      // いまの位置
    let scale = 1;         // いまの大きさ（1 = もとの大きさ）
    let busy = false;      // 画面の外を回っているあいだは true（そのあいだはさわっても動かない）
    let waitTimer = null;  // ぷるぷるを始めるタイマー
    let movingTimer = null; // 車輪の回転を止めるタイマー
    let hintTimer = null;   // 指マークをもう一度出すタイマー

    // 画面の大きさに合わせて、ショベルカーの大きさを決める
    function updateSize() {
      scale = Math.min(1, window.innerWidth / 600, window.innerHeight / 500);
      scale = Math.max(0.5, scale); // 小さくなりすぎないように
      shovelSize.style.transform = "scale(" + scale + ")";
      // 指マークの場所の計算（CSS の .finger-hint）でも使えるように、縮める率を渡しておく
      shovel.style.setProperty("--s", scale);
      placeHint();
    }

    // 指マークが、上の文字「さわると うごくよ！」に届かないように、大きさと高さを決める。
    // 指マークは上下に動くが、下（屋根の方）にしか動かないので、止まっているときの上のはしだけ見ればよい。
    //   ① ふつうは、運転席の屋根の上に、もとの大きさで出す
    //   ② 屋根から文字までのすき間が足りないときは、まず小さくする（HINT_MIN_SCALE まで）
    //   ③ それでも足りないときは、足りないぶんだけ下げる（運転席に少し重なる）
    // こうすると、どんなに低い画面でも、指マークは消えずに、文字の下に出る
    // 右上の2つのボタン（音を消す・トップ画面へ戻る）も、指マークと横に重なるときは、
    // 上の文字と同じように、ボタンの下のはしより下に出す
    function placeHint() {
      let textBottom = message.getBoundingClientRect().bottom;    // 文字の下のはし（画面の上から）
      // 指マークの横のはば（もとの大きさのとき。小さくしても、この中におさまる）。x は行き先の位置
      const hintLeft = x + 68 * scale - 28.25;
      const hintRight = hintLeft + 40;
      [muteBtn, homeBtn].forEach(function (btn) {
        const r = btn.getBoundingClientRect();
        if (r.right + HINT_GAP > hintLeft && r.left - HINT_GAP < hintRight) {
          textBottom = Math.max(textBottom, r.bottom);           // ボタンの下のはしも避ける
        }
      });
      // 地面の上のふち（画面の上から）。#shovel の下のはしが、地面の上のふちに合わせてある
      const groundTop = shovel.getBoundingClientRect().bottom;
      const roofTop = groundTop - 192 * scale;                     // 運転席の屋根（画面の上から）
      const room = roofTop - (textBottom + HINT_GAP);              // 屋根の上で、指マークに使える高さ

      let hintScale = 1;  // 指マークを小さくする率
      let drop = 0;       // 指マークを下げる量（ピクセル）
      if (room < HINT_HEIGHT) {
        hintScale = Math.max(HINT_MIN_SCALE, room / HINT_HEIGHT);   // ② 小さくする
        const h = HINT_HEIGHT * hintScale;
        if (room < h) drop = h - room;                              // ③ 下げる
      }
      fingerHint.style.setProperty("--hs", hintScale);
      fingerHint.style.setProperty("--hd", drop + "px");
    }

    // いまの見た目の横幅
    function carWidth() {
      return CAR_WIDTH * scale;
    }

    // ショベルカーを newX の位置へ、duration ミリ秒かけて動かす
    // duration が 0 のときは、アニメーションなしで一瞬で移動する
    function moveTo(newX, duration) {
      x = newX;
      if (duration === 0) {
        shovel.style.transition = "none";
        shovel.style.transform = "translateX(" + x + "px)";
        shovel.offsetWidth;              // ブラウザに一度反映させるおまじない
      } else {
        shovel.style.transition = "transform " + duration + "ms ease-out";
        shovel.style.transform = "translateX(" + x + "px)";

        // 動いているあいだだけ、車輪を回し、キャタピラのでこぼこを流す（duration ミリ秒たったら止める）
        shovel.classList.add("moving");
        clearTimeout(movingTimer);
        movingTimer = setTimeout(function () {
          shovel.classList.remove("moving");
        }, duration);
      }
    }

    // アームを1回「ガシャン」と動かす
    function scoopArm() {
      armGroup.classList.remove("scoop");
      // おまじない（連打しても、アニメーションを最初からやり直せるように）。
      // アームは SVG の部品で offsetWidth を持たないので、外がわの箱（HTML の部品）で反映させる
      shovel.offsetWidth;
      armGroup.classList.add("scoop");
    }

    // distance ピクセル動くのにかける時間を決める
    // ふつうの1歩（step）と同じ速さになるように、距離に比例させる（ただし上限あり）
    function timeFor(distance, step) {
      return Math.min(MAX_MOVE_TIME, MOVE_TIME * distance / step);
    }

    // ぷるぷるを止める
    function stopWaiting() {
      clearTimeout(waitTimer);
      shovel.classList.remove("waiting");
    }

    // しばらくしたら、ぷるぷるを始める
    function startWaitingLater(delay) {
      clearTimeout(waitTimer);
      waitTimer = setTimeout(function () {
        shovel.classList.add("waiting");
      }, delay);
    }

    // 指マークを消す（もう一度出すタイマーも止める）
    function hideHint() {
      clearTimeout(hintTimer);
      fingerHint.classList.remove("show");
    }

    // HINT_TIME（5秒）たったら、指マークをもう一度出す。
    // 呼ぶたびに数え直す（前のタイマーは止める）
    function showHintLater() {
      clearTimeout(hintTimer);
      hintTimer = setTimeout(function () {
        if (busy) return;                            // 念のため、走りぬけ中は出さない
        placeHint();                                 // 出す直前に、いまの位置でボタンを避け直す
        fingerHint.classList.add("show");
      }, HINT_TIME);
    }

    // 走りぬけ中にさわったとき：車を「ぴょん」と1回はねさせる。
    // 連打しても、毎回 最初からはね直す（アームの「ガシャン」と同じやり方）
    function hop() {
      shovelHop.classList.remove("hop");
      shovel.offsetWidth;                // ブラウザに一度反映させるおまじない（やり直せるように）
      shovelHop.classList.add("hop");
    }
    // はね終わったら印を外す（外さなくても元の高さには戻るが、テストで見分けやすいように）
    shovelHop.addEventListener("animationend", function (e) {
      if (e.target === shovelHop) shovelHop.classList.remove("hop");
    });

    // =====================================================
    // 音（ブラウザの機能 Web Audio API で、その場で音を作る）
    // =====================================================
    let audioCtx = null;    // 音を作る道具（最初に画面を触ったときに用意する）
    let master = null;      // 全体の音量つまみ
    let noiseBuffer = null; // 「シャッ」という音のもとになる「ザーッ」という音
    let voices = 0;         // いま鳴っている音の数
    let muted = false;      // 音を消しているか

    // 音を作る道具を用意する（ブラウザの決まりで、画面を触る前は音を出せない）
    function getAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;            // 音に対応していないブラウザでは何もしない
        audioCtx = new AC();

        master = audioCtx.createGain();
        master.gain.value = muted ? 0 : VOLUME;
        master.connect(audioCtx.destination); // スピーカーにつなぐ

        // 「ザーッ」という音（0.3秒分）を作っておく
        const length = Math.floor(audioCtx.sampleRate * 0.3);
        noiseBuffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          data[i] = Math.random() * 2 - 1;
        }
      }
      // 動いていなければ動かす。「一時停止（suspended）」のほか、
      // iPhone/iPad ではほかのアプリから戻ったときなどに「中断（interrupted）」になることがある
      if (audioCtx.state !== "running") audioCtx.resume();
      return audioCtx;
    }

    // 音を鳴らしてよいか確かめて、準備する
    //   seconds   … その音の長さ（秒）
    //   important … true なら、同時に鳴る数の上限に関係なく鳴らす（走りぬけ・戻ってきた音）
    // 鳴らせないとき（音を消している・上限に達している）は null を返す
    function beginSound(seconds, important) {
      if (muted) return null;
      if (!important && voices >= MAX_VOICES) return null;
      const ctx = getAudio();
      if (!ctx) return null;

      voices++;
      setTimeout(function () { voices--; }, seconds * 1000); // 鳴り終わったら数を減らす
      return ctx;
    }

    // 「ポー」のような音を1つ鳴らす部品
    //   type      … 音色（"sine" やわらかい / "triangle" 少し明るい / "sawtooth" ブーッとした音）
    //   freqStart → freqEnd … 音の高さ（だんだん変わる）
    //   start     … 鳴らし始める時刻、length … 長さ（秒）、peak … 大きさ
    //   filterFreq … 指定すると、キンキンする高い音を削ってやわらかくする（使わないときは 0）
    //   holdRatio … 長さのうち、どこまで同じ大きさを保つか（省略すると 0.5 = 半分まで）。
    //               0 にすると、鳴った瞬間から小さくなっていく（金属が響くような音）
    function tone(ctx, type, freqStart, freqEnd, start, length, peak, filterFreq, holdRatio) {
      if (holdRatio === undefined) holdRatio = 0.5;
      const osc = ctx.createOscillator();   // 音のもと
      const gain = ctx.createGain();        // 音の大きさ
      osc.type = type;
      osc.frequency.setValueAtTime(freqStart, start);
      osc.frequency.exponentialRampToValueAtTime(freqEnd, start + length);

      // ふわっと始まって、少し続いて、ふわっと終わる（「ブツッ」という雑音を防ぐ）
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.linearRampToValueAtTime(peak, start + 0.02);
      gain.gain.setValueAtTime(peak, start + Math.max(0.02, length * holdRatio));
      gain.gain.exponentialRampToValueAtTime(0.0001, start + length);

      osc.connect(gain);
      let last = gain;
      if (filterFreq) {
        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = filterFreq;
        gain.connect(filter);
        last = filter;
      }
      last.connect(master);

      osc.start(start);
      osc.stop(start + length + 0.05);
    }

    // 「シャッ」という音を1つ鳴らす部品
    function noise(ctx, start, length, peak, bandFreq) {
      const src = ctx.createBufferSource();
      src.buffer = noiseBuffer;
      const filter = ctx.createBiquadFilter();
      filter.type = "bandpass";              // 決まった高さのあたりだけを残す
      filter.frequency.value = bandFreq;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.linearRampToValueAtTime(peak, start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + length);

      src.connect(filter);
      filter.connect(gain);
      gain.connect(master);
      src.start(start);
      src.stop(start + length + 0.05);
    }

    // エンジンの「ブロロッ」を作る部品（聞きくらべのページ docs/音の聞きくらべ.html と同じ）
    // 「ブーン」（sawtooth ＋ やわらかくするフィルター）の大きさを、1秒に何回も細かく上下させて、
    // 「ゴロゴロ」したゆれを作る。
    //   wobbleRate  … 1秒に何回ゆらすか（12〜20 くらい）
    //   wobbleDepth … ゆれの深さ（0〜0.5）。大きさが「1 − 2×深さ」から「1」のあいだでゆれる。
    //                 例：0.3 なら 0.4〜1。ゆれは大きさを下げる向きだけなので、peak より大きくなることはない
    // ゆらすための「ゆっくりの波」（LFO）は、音の大きさを動かすだけに使う（スピーカーにはつながない）
    function rumble(ctx, freqStart, freqEnd, start, length, peak, filterFreq, wobbleRate, wobbleDepth, holdRatio) {
      if (holdRatio === undefined) holdRatio = 0.5;
      const osc = ctx.createOscillator();   // 音のもと（ブーッとした音）
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(freqStart, start);
      osc.frequency.exponentialRampToValueAtTime(freqEnd, start + length);

      // 大きさの形（tone と同じ：ふわっと始まって、少し続いて、ふわっと終わる）
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.linearRampToValueAtTime(peak, start + 0.02);
      gain.gain.setValueAtTime(peak, start + Math.max(0.02, length * holdRatio));
      gain.gain.exponentialRampToValueAtTime(0.0001, start + length);

      // ゴロゴロのゆれ：まんなかの大きさ（1 − 深さ）に、ゆっくりの波（± 深さ）を足す
      const wobble = ctx.createGain();
      wobble.gain.value = 1 - wobbleDepth;
      const lfo = ctx.createOscillator();
      lfo.type = "sine";
      lfo.frequency.value = wobbleRate;
      const lfoAmount = ctx.createGain();
      lfoAmount.gain.value = wobbleDepth;
      lfo.connect(lfoAmount);
      lfoAmount.connect(wobble.gain);       // 音ではなく「大きさのつまみ」につなぐ

      // 高い音を削ってやわらかくする
      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = filterFreq;

      osc.connect(gain);
      gain.connect(wobble);
      wobble.connect(filter);
      filter.connect(master);

      osc.start(start);
      lfo.start(start);
      osc.stop(start + length + 0.05);
      lfo.stop(start + length + 0.05);
    }

    // 触ったときの音：エンジン「ブロロッ」＋ アームの「ガシャン」
    // （2026-11-20 聞きくらべで選んだ「候補A まんなか」。値は聞きくらべのページと同じ）
    function playTapSound() {
      const ctx = beginSound(0.75, false);
      if (!ctx) return;
      const t = ctx.currentTime;
      // ブロロッ（エンジン）：0.7秒。1秒に16回ゴロゴロ
      rumble(ctx, 80, 110, t, 0.7, 0.36, 700, 16, 0.3);

      // ここから「ガシャン」（アームが下がりきったとき = 0.2秒後）
      const g = t + 0.2;
      tone(ctx, "sawtooth", 110, 75, g, 0.1, 0.3, 500);     // ガ（低い「ゴッ」）
      noise(ctx, g, 0.07, 0.35, 900);                        // ガ（にごった「ザッ」）
      noise(ctx, g + 0.05, 0.07, 0.22, 2800);                // シャ（シャラッ 1）
      noise(ctx, g + 0.10, 0.07, 0.18, 3200);                // シャ（シャラッ 2）
      noise(ctx, g + 0.15, 0.08, 0.14, 3000);                // シャ（シャラッ 3）
      tone(ctx, "sine", 390, 380, g + 0.19, 0.35, 0.03, 0, 0); // ン（とても小さい、まるい響き）
    }

    // 走りぬけ中にさわったときの音：やさしいクラクション「プッ」（0.16秒）
    //   ・高さは「ピポッ♪」（880Hz）より低い 466Hz と 587Hz の2つの音を重ねる（車のクラクションらしく）
    //   ・大きさは2つ合わせて 0.34（「ピポッ♪」の 0.4 以下）
    //   ・まるい音にするため、やわらかい sine と、高い音を削った triangle を使う
    //   ・前のクラクションから HORN_GAP（0.2秒）たっていないときは鳴らさない（同じ瞬間に重ねない）
    let lastHornTime = -Infinity;  // 前にクラクションを鳴らした時刻（ミリ秒）
    function playHornSound() {
      const now = performance.now();
      if (now - lastHornTime < HORN_GAP) return;   // 間隔があいていなければ鳴らさない
      const ctx = beginSound(0.2, false);           // 同時に3つまでの決まりに入れる。音を消しているときは null
      if (!ctx) return;
      lastHornTime = now;
      const t = ctx.currentTime;
      tone(ctx, "triangle", 466, 460, t, 0.16, 0.18, 1500); // プ（やわらかい低めの音）
      tone(ctx, "sine", 587, 580, t, 0.16, 0.16);           // ッ（少し高い音を重ねて、クラクションらしく）
    }

    // 右はしから走りぬけるときの音：「ブーーン」（seconds 秒）
    function playDriveSound(seconds) {
      const ctx = beginSound(seconds, true);
      if (!ctx) return;
      tone(ctx, "sawtooth", 80, 160, ctx.currentTime, seconds, 0.5, 700);
    }

    // 左から戻ってきたときの音：「ピポッ♪」
    function playArriveSound() {
      const ctx = beginSound(0.35, true);
      if (!ctx) return;
      const t = ctx.currentTime;
      tone(ctx, "sine", 880, 880, t, 0.14, 0.4);            // ピ
      tone(ctx, "sine", 1320, 1320, t + 0.15, 0.18, 0.4);   // ポッ
    }

    // =====================================================
    // 音を消すボタン（2秒長押しで切り替え）
    // =====================================================
    let pressTimer = null;

    function setMuted(value) {
      muted = value;
      muteBtn.textContent = muted ? "🔇" : "🔊";
      muteBtn.classList.toggle("muted", muted);
      muteBtn.setAttribute("aria-label",
        muted ? "おとを だす（2びょう ながおし）" : "おとを けす（2びょう ながおし）");
      if (master) master.gain.value = muted ? 0 : VOLUME; // 鳴っている音もすぐ消す
      if (window.Kuruma && window.Kuruma.bgm) window.Kuruma.bgm.setMuted(muted); // BGM も消す・出す
      // ボタンの大きさ（52px ↔ 64px）が変わるので、指マークの場所を計算し直す
      // （押しているあいだの拡大が戻りきった 0.25秒あとにも、もう一度）
      if (!busy) placeHint();
      setTimeout(function () { if (!busy) placeHint(); }, 250);
    }

    // 押し始めたら、2秒タイマーをスタート
    muteBtn.addEventListener("pointerdown", function (e) {
      // 指で触ると、ブラウザは「指を離すまでボタンを触り続けている」とみなす（ポインターキャプチャ）。
      // そのままだと指がボタンの外にずれても気づけないので、これを解除して、外に出たら取り消せるようにする
      if (muteBtn.hasPointerCapture(e.pointerId)) {
        muteBtn.releasePointerCapture(e.pointerId);
      }
      muteBtn.classList.add("pressing");
      clearTimeout(pressTimer);
      pressTimer = setTimeout(function () {
        muteBtn.classList.remove("pressing");
        setMuted(!muted);
      }, LONG_PRESS_TIME);
    });

    // 2秒たつ前に指を離したり、ボタンの外に指がずれたりしたら、取り消す
    function cancelPress() {
      clearTimeout(pressTimer);
      muteBtn.classList.remove("pressing");
    }
    muteBtn.addEventListener("pointerup", cancelPress);
    muteBtn.addEventListener("pointerleave", cancelPress);
    muteBtn.addEventListener("pointercancel", cancelPress);
    // 長押ししても、パソコンの右クリックメニューのようなものが出ないようにする
    muteBtn.addEventListener("contextmenu", function (e) {
      e.preventDefault();
    });

    // =====================================================
    // トップ画面へ戻るボタン（2秒長押しで移る）
    // =====================================================
    // ・1本目の指（isPrimary）だけに反応する（手のひらを置いたまま別の指が当たっても、始まらないように）
    // ・2秒たつ前に離す・外にずれる・取り消される（pointerup・pointerleave・pointercancel）と取り消す
    // ・iPhone の Safari では、指がずれても pointerleave が来ないことがあるので、
    //   長押しのあいだだけ window で、押した指（pointerId が同じ指）の動き・離した・取り消しを受け取り、
    //   指がボタンの四角の外に出たら取り消す。長押しが終わる・取り消されたら、受け取りを外す
    let homeTimer = null;    // 2秒を数えるタイマー
    let homePointer = null;  // いま押している指の番号（押していないときは null）
    let homeBox = null;      // 押し始めたときのボタンの四角（大きくなる前の形）

    function onHomeMove(e) {
      if (e.pointerId !== homePointer || !homeBox) return;
      if (e.clientX < homeBox.left || e.clientX > homeBox.right ||
          e.clientY < homeBox.top || e.clientY > homeBox.bottom) {
        cancelHome();
      }
    }
    function onHomeEnd(e) {
      if (e.pointerId === homePointer) cancelHome();
    }
    function watchHome(on) {
      const method = on ? "addEventListener" : "removeEventListener";
      window[method]("pointermove", onHomeMove);
      window[method]("pointerup", onHomeEnd);
      window[method]("pointercancel", onHomeEnd);
    }
    function cancelHome() {
      clearTimeout(homeTimer);
      homeTimer = null;
      if (homePointer !== null) watchHome(false);
      homePointer = null;
      homeBox = null;
      homeBtn.classList.remove("pressing");
    }

    homeBtn.addEventListener("pointerdown", function (e) {
      if (!e.isPrimary) return;                // 1本目の指だけ
      // 指を離すまでボタンを触り続けている扱い（ポインターキャプチャ）を外して、ずれたことに気づけるようにする
      if (homeBtn.hasPointerCapture && homeBtn.hasPointerCapture(e.pointerId)) {
        homeBtn.releasePointerCapture(e.pointerId);
      }
      cancelHome();                            // 前の長押しが残っていたら、いったん消す
      homeBox = homeBtn.getBoundingClientRect();
      homePointer = e.pointerId;
      watchHome(true);
      homeBtn.classList.add("pressing");
      homeTimer = setTimeout(function () {
        cancelHome();
        window.location.href = HOME_URL;
      }, LONG_PRESS_TIME);
    });
    homeBtn.addEventListener("pointerup", onHomeEnd);
    homeBtn.addEventListener("pointerleave", onHomeEnd);
    homeBtn.addEventListener("pointercancel", onHomeEnd);
    // 長押ししても、メニューが出ないようにする
    homeBtn.addEventListener("contextmenu", function (e) {
      e.preventDefault();
    });
    // ブラウザの「戻る」でこのページに戻ってきたとき、押しているあいだの表示が残らないようにする
    window.addEventListener("pageshow", cancelHome);

    // iPhone や iPad では、指を「離したとき」でないと音の準備ができないことがあるので、ここでも準備する
    document.addEventListener("pointerup", function () {
      getAudio();
    });

    // =====================================================
    // 画面のどこかに指（またはマウス）がふれた瞬間の動き
    // =====================================================
    document.addEventListener("pointerdown", function (e) {
      // 音を消すボタン・トップ画面へ戻るボタンを触ったときは、車は動かさない（指マークも消さない）
      if (e.target.closest("#muteBtn") || e.target.closest("#homeBtn")) return;
      // 手のひらで何本もの指が同時にふれても、1本目の指だけに反応する
      if (!e.isPrimary) return;

      // さわったので、指マークを消す（走りぬけ中のタッチもふくむ）
      hideHint();

      // 走りぬけ・戻ってくるあいだは、進まずに「プッ」と鳴らして、ぴょんとはねるだけ。
      // 移動や、戻ってくるためのタイマーには、さわらない（戻る位置・時刻が変わらないように）
      if (busy) {
        playHornSound();
        hop();
        return;
      }

      stopWaiting();

      // 1回に進む距離：画面の広さに合わせて、だいたい TAPS_TO_END 回で右はしに着くようにする
      const step = Math.max(40, (window.innerWidth - carWidth() - START_X) / TAPS_TO_END);
      const nextX = x + step;

      // 「+ 1」は、小数の計算でごくわずかにはみ出したときも「おさまる」と判定するためのゆとり
      if (nextX + carWidth() <= window.innerWidth + 1) {
        // まだ画面の中におさまる → ふつうに進む（アームもガシャン）
        moveTo(nextX, MOVE_TIME);
        scoopArm();
        playTapSound();
        startWaitingLater(WAIT_TIME);
        showHintLater();                             // 5秒さわらなければ、指マークをまた出す
      } else {
        // 右はしに着いた → 右の外まで走りぬけて、左の外から戻ってくる
        // （指マークは上の hideHint() で消してあり、タイマーも止まっている。戻ってから数え直す）
        busy = true;

        // ① 右の外へ走りぬける（距離に合わせた時間で）
        const exitX = window.innerWidth + 20;
        const exitTime = timeFor(exitX - x, step);
        moveTo(exitX, exitTime);
        scoopArm();
        playDriveSound(exitTime / 1000);           // 「ブーーン」（ミリ秒 → 秒に直して渡す）

        setTimeout(function () {
          // ② 見えないところで左の外へ移す
          const enterFromX = -carWidth() - 20;
          moveTo(enterFromX, 0);

          // ③ 左からスーッと入ってくる（距離に合わせた時間で）
          const enterTime = timeFor(START_X - enterFromX, step);
          moveTo(START_X, enterTime);

          setTimeout(function () {
            playArriveSound();                       // 「ピポッ♪」
            busy = false;                            // ④ またさわれるようにする
            startWaitingLater(WAIT_TIME);
            showHintLater();                         // 止まってから5秒で、指マークをまた出す
          }, enterTime);
        }, exitTime);
      }
    });

    // 画面の大きさに合わせて、車の大きさ・指マークの場所を合わせ直す
    function refit() {
      updateSize();
      // 画面からはみ出していたら、見える位置に戻す
      if (!busy && x + carWidth() > window.innerWidth) {
        moveTo(Math.max(START_X, window.innerWidth - carWidth()), 0);
      }
    }

    // 画面を回転させたり、アドレスバーが出たり引っこんだり、ウィンドウの大きさを変えたりしたとき。
    // iPhone / iPad の Safari では、知らせが来た瞬間には、まだ新しい高さ（dvh）が画面に
    // 反映されていないことがある。そこで、すぐに1回、次の描きかえのときに1回、
    // 0.3秒あとにもう1回、合わせ直す（何回知らせが来ても、前の予約は消してから作り直す）
    let refitFrame = 0;     // 「次の描きかえのとき」の予約
    let refitTimer = null;  // 「0.3秒あと」の予約
    function onViewportChange() {
      refit();
      cancelAnimationFrame(refitFrame);
      refitFrame = requestAnimationFrame(refit);
      clearTimeout(refitTimer);
      refitTimer = setTimeout(refit, 300);
    }
    window.addEventListener("resize", onViewportChange);
    window.addEventListener("orientationchange", onViewportChange);
    // 見えている範囲（visualViewport）の大きさの知らせ。使えるブラウザだけ
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", onViewportChange);
    }

    // 最初の準備
    updateSize();
    moveTo(START_X, 0);
  </script>

</body>
</html>
