<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホやタブレットでもちょうどいい大きさで表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>はたらくくるま しゅっぱつ！</title>

  <!-- 全部のゲームで使う、共通の見た目（拡大を止める・大人用ボタン・指マーク・ぷるぷる・紙ふぶき） -->
  <link rel="stylesheet" href="../../shared/kuruma-base.css">

  <style>
    body {
      background: #d8f0ff;           /* 空の色（背景の絵が出るまでの、念のための色） */
    }

    /* =====================================================
       背景（晴れた日の、町はずれの広い道）
         .scenery … 上 75%：空・太陽・雲・丘・家並み・木・草地
         .road    … 下 25%：道（くるまは、この上のふちを走る）
       ===================================================== */
    .scenery {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      /* 道の層と 2px 重ねる（画面の高さが端数のとき、境目に 1px のすき間が出ないように） */
      height: calc(75vh + 2px);
      height: calc(75dvh + 2px);
      overflow: hidden;
      /* 丘の絵の高さ。横幅の 1/3 か、この層の高さの 42% の、大きいほう（ただし 92% まで） */
      --hills: min(max(33.4vw, 42%), 92%);
      /* 太陽（右上。ふんわりにじむだけ）と、空のグラデーション（上が濃く、下がうすい） */
      background:
        radial-gradient(circle 20vmin at 80% 13%,
          #fff6c8 0%, rgba(255, 246, 200, 0.85) 30%, rgba(255, 246, 200, 0) 100%),
        linear-gradient(#8ccbf0 0%, #d8f0ff 100%);
    }
    /* 縦長の画面では、丘を高めにして、上半分が空だけにならないようにする */
    @media (orientation: portrait) {
      .scenery { --hills: min(max(33.4vw, 56%), 92%); }
    }

    /* 雲：画面2つぶんの横長の帯に、同じ並びを2回くり返して置き、とてもゆっくり左へ流す（CSS だけで動かす）。
       帯の半分（= 画面1つぶん）動いたところで最初に戻るので、つなぎ目が見えない。
       上の文字と大人用ボタンの後ろを通らないように、帯は上から 84px より下に置く */
    .clouds {
      position: absolute;
      left: 0;
      top: 84px;
      width: 200%;
      height: max(60px, calc(100% - 84px - var(--hills) * 0.6));
      animation: kumo 160s linear infinite;   /* 1周 160秒 */
    }
    @keyframes kumo {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    .cloud {
      position: absolute;
      display: block;
      height: auto;
      aspect-ratio: 120 / 56;
    }
    .cloud-l { width: clamp(100px, 13vw, 200px); }
    .cloud-m { width: clamp(80px, 10vw, 150px); }
    .cloud-s { width: clamp(60px, 7vw, 110px); }
    .cloud-low { display: none; }               /* 低い雲は、縦長の画面だけ */
    @media (orientation: portrait) {
      .cloud-low { display: block; }
    }
    /* 高さの低い画面：空がせまいので、雲を小さく・少なくする */
    @media (max-height: 500px) {
      .cloud-l { width: 76px; }
      .cloud-m { width: 60px; }
      .cloud-s { display: none; }
    }

    /* 丘・家並み・木・草地（下のはしを、道の上のふちにぴったり合わせる） */
    .hills {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: var(--hills);
      display: block;
    }

    /* 道（下 25%）。やさしい灰色に、上のふちの明るい線と、小さな点のでこぼこ。
       白線・矢印・文字は描かない */
    .road {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 25vh;
      height: 25dvh;
      box-sizing: border-box;
      border-top: 5px solid #d3d6db;
      background-color: #b9bcc2;
      background-image:
        radial-gradient(circle, #a4a8ae 2.5px, rgba(164, 168, 174, 0) 3px),
        radial-gradient(circle, #a4a8ae 2px, rgba(164, 168, 174, 0) 2.5px);
      background-size: 96px 52px, 140px 70px;
      background-position: 18px 20px, 70px 46px;
      overflow: hidden;
    }

    /* 手前の草の株（道の下のはし）。くるまにはかからない */
    .tuft {
      position: absolute;
      bottom: 3%;
      height: clamp(24px, 6vh, 46px);
      width: auto;
      aspect-ratio: 60 / 40;
      display: block;
    }
    .tuft-1 { left: 3%; }
    .tuft-2 { left: 34%; }
    .tuft-3 { left: 63%; }
    .tuft-4 { right: 3%; }

    /* 雲・木・草の株の形を1か所に書いておくための、見えない SVG */
    .svg-defs {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    /* ===== 上の文字「さわると うごくよ！」 =====
       広い画面（横幅 560px 以上）：上から 30px。右上の2つのボタンを避けて、左右に 160px ずつあけて、まん中に出す。
         文字の大きさは、あいている幅に入るように（横幅 667px で 約 29px、768px 以上で 32px）
       せまい画面（560px より小さい）：ボタンの段より下（上から 92px）に出す */
    .message {
      position: absolute;
      left: 0;
      right: 0;
      top: 30px;
      padding: 0 160px;
      font-size: clamp(18px, calc((100vw - 320px) / 12), 32px);
      line-height: 1.3;
      z-index: 2;                    /* くるまや地面と重なっても、文字を手前に出す */
    }
    @media (max-width: 559.98px) {
      .message {
        top: 92px;
        padding: 0 12px;
        font-size: clamp(20px, 6vw, 32px);
      }
    }

    /* ===== くるま全体 =====
       4つの箱を重ねて、役割を分けています（1本目と同じ）。
         .car           … 左右の「位置」を受け持つ（右に動く）
         .car-size      … 「大きさ」を受け持つ（小さい画面では縮める）
         .kuruma-hop    … 「はねる」を受け持つ（走りさり・入ってくるあいだにさわると、ぴょん）
         .kuruma-wobble … 「ぷるぷる」を受け持つ（待っているあいだ ゆれる）
       指マークは .car の中で .car-size の外に置く。くるまといっしょに左右に動き、
       ぷるぷる・はねる・縮める動きは受けない */
    .car {
      position: absolute;
      left: 0;
      /* 道の上のふちの明るい線に、タイヤが乗るように、少しだけ下げる */
      bottom: calc(25vh - 6px);
      bottom: calc(25dvh - 6px);
      width: 300px;                  /* くるまごとの横幅は、JavaScript が図鑑の値で入れる */
      height: 220px;
      z-index: 1;
    }
    .car-size,
    .car .kuruma-hop,
    .car .kuruma-wobble {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
    }
    .car-size {
      transform-origin: left bottom; /* 縮めるときは左下を基準にする（地面から浮かないように） */
    }

    /* 動きを減らす設定では、雲の流れも止める */
    @media (prefers-reduced-motion: reduce) {
      .clouds { animation: none; }
    }
  </style>
</head>
<body data-scene="play" data-car="mixer">

  <!-- ===== 背景2：道（下 25%） ===== -->
  <div class="road" aria-hidden="true">

  <p class="kuruma-message message">さわると うごくよ！</p>

  <!-- 大人用のボタン（どちらも2秒長押し）。トップ画面へ戻る・音を消す -->
  <button class="adult-btn home-btn" id="homeBtn" type="button" aria-label="もどる（2びょう ながおし）">
    <!-- おうちの形（三角の屋根、四角いかべ、まん中に戸） -->

  <!-- ===== くるま（絵は図鑑 kuruma-cars.js が作って、.kuruma-wobble の中に入れる） ===== -->
  <div class="car" id="car">
    <div class="car-size" id="carSize">
      <div class="kuruma-hop" id="carHop">
        <div class="kuruma-wobble" id="carWobble"></div>
      </div>
    </div>
  </div>

  <!-- 全部のゲームで使う、共通の部品（音 → さわる操作 → くるまの図鑑 → 順番と動き の順に読み込む） -->
  <script src="../../shared/kuruma-sound.js"></script>
  <script src="../../shared/kuruma-bgm.js"></script>
  <script src="../../shared/kuruma-touch.js"></script>
  <script src="../../shared/kuruma-cars.js"></script>
  <script src="../../shared/kuruma-stage.js"></script>

  <script>
    (function () {
      "use strict";

      var K = window.Kuruma;

      // ===== 設定（数字を変えると動きが変わります） =====
      // くるまの順番（最後のあとは最初に戻る）。となり合うくるまの主な色が、かぶらないように並べてある
      // （しょべるかー〈黄色〉は、ブルドーザー〈黄色〉ととなりにならないように、緑と赤のあいだに入れた）
      var ORDER = ["mixer", "dump", "bulldozer", "garbage", "shovel", "fire", "ambulance", "crane", "police"];
      var TAPS_TO_END = 6;     // だいたい何回さわると右はしに着くか
      var MIN_STEP = 40;       // 1歩の最低の長さ（px。せまい画面では、6回より少なく着く）
      var HOME_URL = "../../index.html"; // トップ画面
      var START_X = K.stage.START_X;     // スタート地点（左から 20px）
      var MOVE_TIME = K.stage.MOVE_TIME; // ふつうの1歩の時間（0.6秒）

      // ページの部品を取り出す
      var carBox = document.getElementById("car");          // 位置の箱
      var carSize = document.getElementById("carSize");     // 大きさの箱
      var carHop = document.getElementById("carHop");       // はねる箱
      var carWobble = document.getElementById("carWobble"); // ぷるぷるの箱（この中に絵を入れる）
      var message = document.querySelector(".message");     // 上の文字
      var muteBtn = document.getElementById("muteBtn");
      var homeBtn = document.getElementById("homeBtn");

      // 共通の部品を用意する
      var order = K.stage.order(ORDER);
      var mover = K.stage.mover(carBox);     // 左右に動かす
      var waiter = K.stage.waiter(carBox);   // ぷるぷる
      var hopper = K.stage.hopper(carHop);   // ぴょん

      // 指マーク：位置の箱の中で、大きさの箱の外に置く。ページを開いたときは出ている
      var hint = K.touch.createHint();
      carBox.insertBefore(hint, carSize);
      // 5秒さわらなかったら、指マークをまた出す（走りさり・入ってくるあいだは出さない）
      var hintTimer = K.touch.hintTimer(function () {
        if (scene === "play" || scene === "edge") {
          placeHint();
          K.touch.showHint(hint);
        }
      });

      var car = null;      // いまのくるま（図鑑が作ったもの）
      var scale = 1;       // いまの大きさ（1 = もとの大きさ）
      var scene = "play";  // いまの場面（play・edge・leave・enter）

      // ===== 場面とくるまを、<body> に書く（テストの台本が場面を待てるように） =====
      function setScene(value) {
        scene = value;
        document.body.setAttribute("data-scene", value);
      }

      // くるまを替える（古い絵を外して、新しい絵を入れる）
      function setCar(id) {
        if (car && car.el.parentNode) car.el.parentNode.removeChild(car.el);
        car = K.cars.create(id);
        carWobble.appendChild(car.el);
        carBox.style.width = car.width + "px";
        document.body.setAttribute("data-car", id);
      }

      // ===== 大きさと、1歩の長さ =====
      function updateSize() {
        scale = K.touch.fitScale();
        carSize.style.transform = "scale(" + scale + ")";
      }
      // いまの見た目の横幅
      function carWidth() {
        return car.width * scale;
      }
      // 1回に進む距離：画面の広さに合わせて、だいたい TAPS_TO_END 回で右はしに着くようにする（最低 40px）
      function stepLength() {
        return Math.max(MIN_STEP, (window.innerWidth - carWidth() - START_X) / TAPS_TO_END);
      }
      // newX にいても、画面の中におさまるか。
      // 「+ 1」は、小数の計算でごくわずかにはみ出したときも「おさまる」と判定するためのゆとり
      function fits(newX) {
        return newX + carWidth() <= window.innerWidth + 1;
      }
      // x にいるとき、次の1歩が画面からはみ出すなら edge、おさまるなら play
      function decideEdge(x) {
        setScene(fits(x + stepLength()) ? "play" : "edge");
      }

      // ===== 指マークの場所 =====
      // 指先を、図鑑に書いた場所（屋根の上）に置く。上の文字と、右上の2つのボタンに重なるときは、
      // 共通の部品の計算（④）で、小さくする・下げる
      function placeHint() {
        var tip = car.tip;
        var fromBottom = (car.height - tip.y) * scale;          // くるまの下のはしから指先まで
        var groundTop = carBox.getBoundingClientRect().bottom;  // くるまの下のはし（画面の上から）
        var tipX = mover.x + tip.x * scale;                     // 指先（画面の左から。動いている途中なら行き先）
        var tipY = groundTop - fromBottom;                      // 指先（画面の上から）
        var fit = K.touch.hintFit(tipX, tipY, [message, homeBtn, muteBtn]);
        hint.style.setProperty("--hs", fit.scale);
        hint.style.left = (tip.x * scale - K.touch.HINT_TIP_X * fit.scale) + "px";
        hint.style.bottom = (fromBottom - fit.drop) + "px";
      }

      // ===== 画面のどこかに指がふれた瞬間 =====
      // （大人用のボタンへのタッチと、2本目からの指は、共通の部品が はぶいてくれる）
      K.touch.onTap(function () {
        // さわったので、指マークを消す（走りさり中のタッチもふくむ）
        K.touch.hideHint(hint);
        hintTimer.stop();

        // 走りさり・入ってくるあいだは、進まずに「プッ」と鳴らして、ぴょんとはねるだけ。
        // 移動や、入ってくるためのタイマーには、さわらない（止まる位置・時刻が変わらないように）
        if (scene === "leave" || scene === "enter") {
          K.sound.playHorn();
          hopper.hop();
          return;
        }

        waiter.stop();
        var step = stepLength();
        var nextX = mover.x + step;

        if (fits(nextX)) {
          // まだ画面の中におさまる → 1歩すすんで、仕事の動きと音
          mover.moveTo(nextX, MOVE_TIME);
          decideEdge(nextX);                 // 次の1歩がはみ出すなら、ここで edge にする
          car.work();
          car.sound();
          waiter.later();                    // 1.5秒さわらなければ、ぷるぷる
          hintTimer.restart();               // 5秒さわらなければ、指マークをまた出す
        } else {
          driveAway(step);
        }
      });

      // ===== 右はしから走りさって、次のくるまが左から入ってくる =====
      function driveAway(step) {
        setScene("leave");

        // ① 右の外へ走りさる（距離に合わせた時間で）。仕事の動きを1回しながら、「ブーーン」と紙ふぶき
        var exitTo = K.stage.exitX();
        var exitTime = K.stage.timeFor(exitTo - mover.x, step);
        mover.moveTo(exitTo, exitTime);
        car.work();
        K.sound.playDrive(exitTime / 1000);  // ミリ秒 → 秒に直して渡す
        K.stage.confetti();

        setTimeout(function () {
          // ② 見えないところで、次のくるまに替えて、左の外へ移す
          setCar(order.next());
          setScene("enter");
          var enterFrom = K.stage.enterX(carWidth());
          mover.moveTo(enterFrom, 0);

          // ③ 左からスーッと入ってきて、スタート地点で止まる（1歩と同じ速さ）
          var enterTime = K.stage.timeFor(START_X - enterFrom, step);
          mover.moveTo(START_X, enterTime);
          setTimeout(arrive, enterTime);
        }, exitTime);
      }

      // ④ 止まったら「ピポッ♪」。新しいくるまが、仕事の動きを1回だけ見せる（あいさつ。仕事の音は鳴らさない）
      function arrive() {
        setScene("play");
        K.sound.playArrive();
        car.work();
        refit();                 // 走っているあいだに画面の大きさが変わっていたら、ここで合わせる
        waiter.later();          // 1.5秒たったら、ぷるぷる
        hintTimer.restart();     // 止まってから5秒で、指マークをまた出す
      }

      // ===== 画面の大きさ・回転が変わったとき =====
      // 大きさはいつでも合わせ直す。位置と play・edge は、play か edge のときだけ決め直す
      // （leave・enter のあいだは、data-scene を書きかえず、移動やタイマーも作り直さない）
      function refit() {
        updateSize();
        if (scene === "play" || scene === "edge") {
          if (mover.x + carWidth() > window.innerWidth) {
            mover.moveTo(Math.max(START_X, window.innerWidth - carWidth()), 0);
          }
          decideEdge(mover.x);
          placeHint();
        }
      }
      K.touch.onViewportChange(refit);

      // ===== 大人用のボタン =====
      // 音を消す・出すを切りかえたら、ボタンの大きさ（52px ↔ 64px）が変わるので、指マークの場所を計算し直す。
      // 押しているあいだの拡大が戻りきった 0.25秒あとにも、もう一度計算する
      K.touch.setupMuteButton(muteBtn, function () {
        if (scene === "play" || scene === "edge") placeHint();
        setTimeout(function () {
          if (scene === "play" || scene === "edge") placeHint();
        }, 250);
      });
      K.touch.setupHomeButton(homeBtn, HOME_URL);

      // ===== 最初の準備 =====
      setCar(order.current());
      updateSize();
      mover.moveTo(START_X, 0);
      decideEdge(START_X);
      placeHint();
      K.touch.showHint(hint);    // ページを開いたときは、指マークが出ている
      waiter.later();            // 1.5秒たったら、ぷるぷる
    })();
  </script>

</body>
</html>
