<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホやタブレットでもちょうどいい大きさで表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>しゅつどう！ どの くるま？</title>

  <!-- 全部のゲームで使う、共通の見た目（拡大を止める・大人用ボタン・指マーク・ぴょん・紙ふぶき） -->
  <link rel="stylesheet" href="../../shared/kuruma-base.css">

  <style>
    body {
      position: relative;            /* 背景・くるまは、この画面いっぱいの箱を基準に置く */
      background: #d8f0ff;           /* 空の色（背景が出るまでの、念のための色） */
    }

    /* =====================================================
       背景（晴れた日の空と、町はずれの丘。3本目と同じ作り）
         .scenery … 空・雲・丘・草地（道の上のはしまで）
         .road    … 道（選ぶ3台が並ぶ）
       道の上のはし --road-top は、JavaScript が場面と3台を並べるたびに計算して書く
       ===================================================== */
    .scenery {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: calc(var(--road-top, 75vh) + 2px);   /* 道と 2px 重ねる（境目にすき間が出ないように） */
      overflow: hidden;
      --hills: min(max(33.4vw, 42%), 92%);
      background: linear-gradient(#8ccbf0 0%, #d8f0ff 100%);
    }
    @media (orientation: portrait) {
      .scenery { --hills: min(max(33.4vw, 56%), 92%); }
    }

    /* 雲：画面2つぶんの横長の帯に同じ並びを2回置き、とてもゆっくり左へ流す（CSS のアニメーションだけ） */
    .clouds {
      position: absolute;
      left: 0;
      top: 84px;
      width: 200%;
      height: max(60px, calc(100% - 84px - var(--hills) * 0.6));
      animation: kumo 160s linear infinite;
    }
    @keyframes kumo {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    .cloud {
      position: absolute;
      display: block;
      height: auto;
      aspect-ratio: 120 / 56;
    }
    .cloud-l { width: clamp(100px, 13vw, 200px); }
    .cloud-m { width: clamp(80px, 10vw, 150px); }
    @media (max-height: 500px) {
      .cloud-l { width: 76px; }
      .cloud-m { width: 60px; }
    }

    .hills {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: var(--hills);
      display: block;
    }

    /* 道（やさしい灰色に、上のふちの明るい線と、小さな点のでこぼこ。白線・矢印・文字はなし） */
    .road {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--road-top, 75vh);
      bottom: 0;
      box-sizing: border-box;
      border-top: 5px solid #d3d6db;
      background-color: #b9bcc2;
      background-image:
        radial-gradient(circle, #a4a8ae 2.5px, rgba(164, 168, 174, 0) 3px),
        radial-gradient(circle, #a4a8ae 2px, rgba(164, 168, 174, 0) 2.5px);
      background-size: 96px 52px, 140px 70px;
      background-position: 18px 20px, 70px 46px;
      overflow: hidden;
    }

    /* 雲・木・家の形を1か所に書いておくための、見えない SVG */
    .svg-defs {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    /* ===== 上の文字「どの くるまが いく？」（正解のあいだは、くるまの名前）。3本目と同じ置き方 =====
       広い画面：上から 30px、右上の2つのボタンを避けて、左右に 160px ずつあける
       せまい画面：ボタンの段より下（上から 92px） */
    .message {
      position: absolute;
      left: 0;
      right: 0;
      top: 30px;
      padding: 0 160px;
      font-size: clamp(18px, calc((100vw - 320px) / 12), 32px);
      line-height: 1.3;
      z-index: 2;
    }
    @media (max-width: 559.98px) {
      .message {
        top: 92px;
        padding: 0 12px;
        font-size: clamp(20px, 6vw, 32px);
      }
    }

    /* =====================================================
       場面の絵（「絵のまど」）と、場面の右へのびる細い道
         .scene       … 場面の箱（動かない）。角が丸く、白いふち。中に <svg> が1つ
         .scene-road  … 場面の地面の高さから、画面の右の外までのびる細い道
                        （走りさる くるまが、宙を走らないように）
       場面の <svg> には、3つの <g> が入っている：
         sc-base（ずっと同じ）・sc-before（こまっているときだけ）・sc-after（助けたあとだけ）
       <svg> に helped のクラスが付くと、before が消えて after が出る（opacity だけ、1回）
       ===================================================== */
    .scene {
      position: absolute;
      z-index: 1;
      overflow: hidden;
      background: #8fd3f6;
      box-shadow: 0 0 0 6px #ffffff, 0 8px 16px rgba(0, 0, 0, 0.18);
    }
    .scene-svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    .sc-before { opacity: 1; transition: opacity 500ms ease; }
    .sc-after  { opacity: 0; transition: opacity 500ms ease; }
    .scene-svg.helped .sc-before { opacity: 0; }
    .scene-svg.helped .sc-after  { opacity: 1; }
    .scene-road {
      position: absolute;
      z-index: 1;
      box-sizing: border-box;
      background: #c9ccd1;
      border-top: 2px solid #dfe1e5;
      pointer-events: none;
    }

    /* =====================================================
       選ぶくるま
       選ぶくるま1台は、外から順に、次の箱を重ねる（それぞれ役目がちがう）。
         .choice       … 横の箱＝さわれる四角。左端に置いて、translateX だけで場所を決める（部品 mover）
         .choice-v     … 縦の箱。場面へ走っていくときの translateY だけ
         .car-frame    … 大きさの箱。横 310 × 縦 220 の枠。下のまん中を中心に scale
         .kuruma-hop   … はねる箱（ぴょん・えらんでね）
         .kuruma-tilt  … 首をかしげる箱
         <svg>         … 図鑑のくるまの絵
       ===================================================== */
    .field {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;              /* 右へ走りさるくるまで、横のスクロールが出ないように */
      pointer-events: none;          /* 空いているところは、画面全体の反応に任せる */
    }
    .choice {
      position: absolute;
      left: 0;
      pointer-events: auto;          /* さわれる四角 */
    }
    .choice.drive {
      z-index: 2;                    /* 走っていく・場面に入った正解は、場面より手前（紙ふぶき 3・大人用ボタン 4 より奥） */
    }
    .choice-v {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
    }
    .car-frame {
      position: absolute;
      width: 310px;
      height: 220px;
      transform-origin: 50% 100%;    /* 下のまん中。大きさを変えても、地面から浮かない */
    }
    .car-frame > .kuruma-hop,
    .car-frame .kuruma-tilt {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
    }
    .kuruma-tilt {
      transform-origin: 50% 100%;
    }
    /* 図鑑の絵を、枠の下そろえに置く（横は JavaScript が style で書く） */
    .car-frame .kuruma-car {
      top: auto;
      bottom: 0;
    }

    /* 動きを減らす設定では、雲の流れも、場面の入れかえの transition も止める */
    @media (prefers-reduced-motion: reduce) {
      .clouds { animation: none; }
      .sc-before, .sc-after { transition: none; }
    }
  </style>
</head>
<body data-scene="ask" data-case="" data-answer="" data-hint="off">

  <!-- 雲・木・家の形（ここに1回だけ書いて、<use> で使う）。この SVG 自体は見えない -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>

  <!-- ===== 背景1：空と景色 ===== -->
  <div class="scenery" aria-hidden="true">
    <div class="clouds">
      <svg class="cloud cloud-l" viewBox="0 0 120 56" style="left: 3%; top: 8%;"><use href="#bgCloud"/></svg>
      <svg class="cloud cloud-m" viewBox="0 0 120 56" style="left: 27%; top: 30%;"><use href="#bgCloud"/></svg>
      <svg class="cloud cloud-l" viewBox="0 0 120 56" style="left: 40%; top: 2%;"><use href="#bgCloud"/></svg>

  <!-- ===== 背景2：道（選ぶ3台が並ぶ） ===== -->
  <div class="road" aria-hidden="true"></div>

  <!-- 場面の右へのびる細い道（場面の箱より奥に置く。位置と大きさは JavaScript が書く） -->
  <div class="scene-road" id="sceneRoad" aria-hidden="true"></div>

  <!-- data-showing：いま出している文字の種類（title ＝ 「どの くるまが いく？」、name ＝ くるまの名前） -->
  <p class="kuruma-message message" id="message" data-showing="title">どの くるまが いく？</p>

  <!-- 大人用のボタン（どちらも2秒長押し）。トップ画面へ戻る・音を消す -->
  <button class="adult-btn home-btn" id="homeBtn" type="button" aria-label="もどる（2びょう ながおし）">
    <svg viewBox="0 0 26 26" aria-hidden="true" focusable="false">
      <g fill="none" stroke="#5a3d1e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
        <path d="M 6 11.5 L 6 23 L 20 23 L 20 11.5" fill="#fff3c4"/>
        <path d="M 2.5 13 L 13 3.5 L 23.5 13"/>
        <path d="M 10.5 23 L 10.5 17 L 15.5 17 L 15.5 23"/>
      </g>
    </svg>
  </button>
  <button class="adult-btn mute-btn" id="muteBtn" type="button" aria-label="おとを けす（2びょう ながおし）">🔊</button>

  <!-- 選ぶ3台（JavaScript が作って、この中に入れる）。場面の箱は、この直前に JavaScript が入れる -->
  <div class="field" id="field"></div>

  <!-- 全部のゲームで使う、共通の部品（音 → BGM → さわる操作 → くるまの図鑑 → 動き → 3択 の順に読み込む） -->
  <script src="../../shared/kuruma-sound.js"></script>
  <script src="../../shared/kuruma-bgm.js"></script>
  <script src="../../shared/kuruma-touch.js"></script>
  <script src="../../shared/kuruma-cars.js"></script>
  <script src="../../shared/kuruma-stage.js"></script>
  <script src="../../shared/kuruma-choice.js"></script>

  <script>
    (function () {
      "use strict";

      var K = window.Kuruma;
      var C = K.choice;

      // =====================================================
      // 設定（数字を変えると動きが変わります）
      // =====================================================
      // 図鑑の18台（図鑑の順）
      var CAR_IDS = ["mixer", "dump", "bulldozer", "garbage", "shovel", "fire", "ambulance", "crane", "police",
                     "grader", "tanker", "tractor", "taxi", "tow", "sports", "roller", "bus", "doubledecker"];

      // 同じ3択に入れない組み合わせ：図鑑の主な色（color）が同じ2台。図鑑から作る（手で書かない）
      var COLOR_PAIRS = (function () {
        var list = [];
        for (var i = 0; i < CAR_IDS.length; i++) {
          for (var j = i + 1; j < CAR_IDS.length; j++) {
            if (K.cars.get(CAR_IDS[i]).color === K.cars.get(CAR_IDS[j]).color) list.push([CAR_IDS[i], CAR_IDS[j]]);
          }
        }
        return list;
      })();

      // くるまの枠と、画面の並べ方（3本目と同じ値と、新しく決めた値）
      var FRAME_W = 310;         // くるまの枠の横
      var FRAME_H = 220;         // くるまの枠の縦
      var SIDE = 12;             // 画面の左右のあき
      var BOTTOM = 12;           // 画面の下のあき
      var VGAP = 16;             // 場面と選ぶ3台のあいだ
      var CHOICE_MAX = 0.8;      // 選ぶくるまの率の上限
      var CHOICE_SHARE = 0.40;   // 選ぶくるまに使う高さの わりあい
      var SCENE_W = 480;         // 場面の絵の座標：横
      var SCENE_H = 260;         // 場面の絵の座標：縦
      var SCENE_GROUND = 250;    // 場面の地面（くるまのタイヤの下）の高さ
      var SCENE_MAX = 1.3;       // 場面の絵の率の上限
      var CAR_K = 0.6;           // 場面の中の くるまの大きさ（図鑑の枠の 0.6倍）
      var TIRE_GAP = 5;          // 図鑑の絵の、タイヤの下と枠の下の差（枠の y 215 と 220）
      var SPOT_LEFT = 107;       // くるまが止まる場所（枠のまん中の x）：左
      var SPOT_RIGHT = 373;      // 同：右
      var ADULT_BOTTOM = 76;     // 音を消しているときの大人用ボタン（64px）の下のはし
      var HOME_URL = "../../index.html";   // トップ画面

      // 動きの時間（ミリ秒）
      var DRIVE_IN = 900;        // 正解のくるまが、場面へ走っていく時間
      var HELP_DELAY = 300;      // 仕事を始めてから、場面が にっこりになるまで
      var HELP_HOLD = 1500;      // 仕事を始めてから、走りさるまで（どのくるまも同じ）
      var LEAVE_HOLD = 1500;     // 走りさりの時間（この長さで次の問題へ。走る時間はこれ以下）
      var SCENE_OUT = 300;       // 前の場面が ふわっと消える時間（走りさりの終わりの 0.3秒）
      var SCENE_IN = 400;        // 新しい場面が ふわっと出る時間
      var OTHER_FADE = 500;      // ほかの2台が ふわっと消える時間
      var OTHER_SINK = 6;        // 消えるとき、下へ沈む量（px）
      var MIN_LEAVE_TIME = 300;  // 走る時間の下限（画面が急に狭くなったときの逆走・音の切れを防ぐ）
      var ENTER_TIME = 1200;     // 入ってくる1台の移動の時間
      var ENTER_STAGGER = 150;   // 入ってくる3台の出発のずれ（右の台から）
      var ENTER_TOTAL = 1500;    // 入ってくるのに かかる時間
      var REDUCED_FADE = 450;    // 動きを減らす設定：行く・出るの ふわっと の時間（合わせて DRIVE_IN と同じ）
      var REDUCED_LEAVE = 500;   // 動きを減らす設定：走りさりの代わりに その場で消える時間
      var NUDGE_TIME = 8000;     // 2問目から：さわらないでいると「えらんでね」を1回出すまで
      var MIN_STEP = 40;         // 1歩の長さの最低（走る時間の計算のもと）
      var STEP_DIV = 6;          // 1歩の長さ ＝ 画面の横幅 ÷ これ
      var MSG_FADE = 250;        // 上の文字が消える時間・出る時間（それぞれ）
      var TITLE_TEXT = "どの くるまが いく？";   // ふだんの上の文字

      // =====================================================
      // 場面の絵を描く道具（SVG の文字を作る）
      //   ・座標は、場面の大きさ 横 480 × 縦 260 のなか
      //   ・id は使わない。色は fill・stroke の属性で付ける。グラデーションなし。文字・絵文字なし
      //   ・人は、足もとを (0, 0) にして、上に向かって y がマイナス（頭の中心は (0, -60)）
      // =====================================================
      var LN = "#6b4a2f";                                       // ふちの線の色
      var LNS = 'stroke="' + LN + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"';
      var LNT = 'stroke="' + LN + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"';   // 小さなもの用

      // 3つの層（ずっと同じ・こまっているとき・助けたあと）を1つにまとめる
      function layers(base, before, after) {
        return '<g class="sc-base">' + base + '</g><g class="sc-before">' + before + '</g><g class="sc-after">' + after + '</g>';
      }
      function sky() { return '<rect x="0" y="0" width="480" height="260" fill="#8fd3f6"/>'; }
      // 雲（線なし）。(x, y) は雲のまん中
      function cloud(x, y, s) {
        return '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')" fill="#ffffff">' +
          '<ellipse cx="0" cy="0" rx="26" ry="10"/><circle cx="-9" cy="-6" r="11"/><circle cx="8" cy="-9" r="13"/></g>';
      }
      // 草の地面（y から、場面の下の道の上まで）
      function grass(y) {
        return '<rect x="0" y="' + y + '" width="480" height="' + (250 - y) + '" fill="#8cc96b"/>' +
          '<rect x="0" y="' + y + '" width="480" height="3" fill="#a6d98a"/>';
      }
      // 場面の下のはしの道（くるまのタイヤの下 y 250 が のる）。右の外へのびる細い道と同じ色
      function road() {
        return '<rect x="0" y="246" width="480" height="14" fill="#c9ccd1"/><rect x="0" y="246" width="480" height="2.5" fill="#dfe1e5"/>';
      }
      // 歩道と道（okyakusan・basutei）
      function walk() {
        return '<rect x="0" y="192" width="480" height="12" fill="#8cc96b"/>' +
          '<rect x="0" y="204" width="480" height="42" fill="#d6d8dc"/><rect x="0" y="204" width="480" height="3" fill="#e8eaed"/>' +
          '<rect x="0" y="242" width="480" height="4" fill="#b4b8be"/>' + road();
      }
      // 小さな おうち（いぬごや・行きたい おうち）。(cx, by) は下のまん中、s は大きさ
      function house(cx, by, s) {
        return '<g ' + LNT + '>' +
          '<rect x="' + (cx - 12 * s) + '" y="' + (by - 16 * s) + '" width="' + (24 * s) + '" height="' + (16 * s) + '" fill="#f3e3d3"/>' +
          '<path d="M ' + (cx - 16 * s) + ' ' + (by - 14 * s) + ' L ' + cx + ' ' + (by - 30 * s) + ' L ' + (cx + 16 * s) + ' ' + (by - 14 * s) + ' Z" fill="#e0483c"/>' +
          '<rect x="' + (cx - 4.5 * s) + '" y="' + (by - 10 * s) + '" width="' + (9 * s) + '" height="' + (10 * s) + '" rx="' + (3 * s) + '" fill="#5a3d1e"/>' +
          '</g>';
      }

      var SCENES = [

      var SCENE_IDS = [];

      // =====================================================
      // 出題器：場面の順番・正解・まちがいの2台・正解の場所を決める
      //   乱数は、すべて引数の rand を通す（決まった並びを渡せば、同じ結果になる）。
      //   createQuiz(rand).next() が、1問ぶん { case, answer, slotIds } を返す
      //     case … 場面の名前、answer … 正解のくるま、slotIds … 左から3台（図鑑の名前）
      // =====================================================
      function createQuiz(rand) {
        rand = typeof rand === "function" ? rand : Math.random;   // 乱数の関数が渡されないときは Math.random
        var sceneBag = C.bag(SCENE_IDS, rand);       // 10場面を1回ずつ（袋）。同じ場面は続かない
        var answerBags = {};                         // 正解が2台の場面は、場面ごとの袋で交互に
        SCENES.forEach(function (s) {
          if (s.answers.length > 1) answerBags[s.id] = C.bag(s.answers, rand);
        });
        var placer = C.places(rand, 3);              // 正解の場所（3回続けて同じにしない）
        var prevSet = null;                          // 前の問題の3台の組
        var recent = [];                             // 最近6問の3台の組（出た回数を数える）

        // その場面で、まちがいの くるまに選んでよい台（正解は入れる。もう1台の正解と、入れない くるまは除く）
        function poolFor(sc, answer) {
          var pool = [];
          for (var i = 0; i < CAR_IDS.length; i++) {
            var id = CAR_IDS[i];
            if (id === answer || (sc.answers.indexOf(id) < 0 && sc.exclude.indexOf(id) < 0)) pool.push(id);
          }
          return pool;
        }
        function pickSet(sc, answer, ng) {
          var seen = {};
          for (var a = 0; a < recent.length; a++) {
            for (var b = 0; b < recent[a].length; b++) seen[recent[a][b]] = (seen[recent[a][b]] || 0) + 1;
          }
          return C.pick(answer, poolFor(sc, answer), ng, 3, prevSet, rand, seen);
        }
        function finish(sc, answer, set) {
          prevSet = set.slice();
          recent.push(set.slice());
          if (recent.length > 6) recent.shift();
          var others = [set[1], set[2]];
          if (rand() < 0.5) others.reverse();
          var place = placer.next();
          var slotIds = [];
          var k = 0;
          for (var i = 0; i < 3; i++) slotIds.push(i === place ? answer : others[k++]);
          return { "case": sc.id, answer: answer, slotIds: slotIds };
        }
        return {
          next: function () {
            var sc, answer, set;
            // 3択が作れなかった場面は、とばして次の場面を袋から出す（決まりどおりなら、起きない）
            for (var t = 0; t < SCENES.length * 2; t++) {
              sc = SCENE_BY_ID[sceneBag.next()];
              answer = sc.answers.length > 1 ? answerBags[sc.id].next() : sc.answers[0];
              set = pickSet(sc, answer, COLOR_PAIRS);
              if (set) return finish(sc, answer, set);
            }
            // 念のため：色の決まりを ゆるめて作る
            set = pickSet(sc, answer, []);
            return finish(sc, answer, set);
          }
        };
      }

      // テスト用の口：ページの外から出題器と場面の表を調べられる。子どもが触る部分には使わない

      var L = null;                // いまの並べ方（画面の大きさから計算した値）
      var sceneObj = null;         // いまの場面の絵 { id, el, svg }
      var sceneCount = 0;          // 場面の絵を作った回数（id の先頭を変えるため）
      var choices = [];            // いまの選ぶ3台（左から順）
      var winner = null;           // 正解をさわった1台
      var wrongCount = 0;          // いまの問題で まちがえた回数（画面には出さない）
      var autoNudged = false;      // 「えらんでね」（自動）を もう出したか
      var nudgeTimer = null;
      var sceneOutTimer = null;    // 前の場面を ふわっと消し始める予約
      var hint = null;             // 指マーク（1問目だけ）
      var quiz = createQuiz(Math.random);

      // 動きを減らす設定か（そのときどきで調べる）
      function reduced() {
        return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
      }

      // =====================================================
      // 上の文字の入れかえ（ふだん：「どの くるまが いく？」／正解のあいだ：くるまの名前）
      //   opacity だけを なめらかに変える（消える → 入れかえ → 出る の1往復。点滅しない）。
      //   動きを減らす設定では、すぐ入れかえる。いまの文字の種類を data-showing に書く
      // =====================================================
      var msgTimer = null;
      var msgFadeTimer = null;

      function swapMessage(text, kind) {
        message.textContent = text;
        message.setAttribute("data-showing", kind);
        if (reduced()) {
          message.style.transition = "none";
          message.style.opacity = "1";
        } else {
          message.style.transition = "opacity " + MSG_FADE + "ms ease";
          message.style.opacity = "1";
        }
      }
      function showNameMessage(name) {
        clearTimeout(msgTimer);
        clearTimeout(msgFadeTimer);
        if (reduced()) {
          swapMessage(name, "name");
          return;
        }
        message.style.transition = "opacity " + MSG_FADE + "ms ease";
        message.style.opacity = "0";
        msgTimer = setTimeout(function () {
          swapMessage(name, "name");
        }, MSG_FADE);
      }
      // 走りさりの終わりの 0.25秒前から、名前を消し始める（次の問題を作るとき、消え終わっているように）
      function startFadeOutMessage(runMs) {
        clearTimeout(msgFadeTimer);
        if (reduced()) return;
        msgFadeTimer = setTimeout(function () {
          message.style.transition = "opacity " + MSG_FADE + "ms ease";
          message.style.opacity = "0";
        }, Math.max(0, runMs - MSG_FADE));
      }
      function showTitleMessage() {
        clearTimeout(msgTimer);
        clearTimeout(msgFadeTimer);
        swapMessage(TITLE_TEXT, "title");
      }

      // ===== 場面を <body> に書く（テストの台本が場面を待てるように） =====
      function setScene(value) {
        scene = value;
        body.setAttribute("data-scene", value);
      }

      // =====================================================
      // 画面の大きさから、並べ方を計算する
      //   上から：上の文字 → 場面の絵 → 選ぶ3台（画面の下の道の上）
      //   選ぶくるまの率  cs  = min(0.8, (slotW − 8) ÷ 310, A × 0.40 ÷ 220)
      //   場面の絵の率    ss  = min(1.3, (横幅 − 24) ÷ 480, (A − 220 × cs) ÷ 260)
      //   場面の中のくるま ins = ss × 0.6
      // =====================================================
      function computeLayout() {
        var W = window.innerWidth;
        var H = window.innerHeight;
        var top = Math.max(message.getBoundingClientRect().bottom, ADULT_BOTTOM) + 8;   // 場面を置き始める高さ
        var A = H - top - BOTTOM - VGAP;                  // 場面と3台に使える高さ
        var slotW = (W - SIDE * 2) / 3;                   // 1台ぶんの横はば
        var cs = Math.max(0.1, Math.min(CHOICE_MAX, (slotW - 8) / FRAME_W, A * CHOICE_SHARE / FRAME_H));
        var ss = Math.max(0.2, Math.min(SCENE_MAX, (W - SIDE * 2) / SCENE_W, (A - FRAME_H * cs) / SCENE_H));

        var o = { W: W, H: H, TOP: top, slotW: slotW, cs: cs, ss: ss, ins: ss * CAR_K };
        // 選ぶくるま
        o.choiceBottom = H - BOTTOM;
        o.choiceTop = o.choiceBottom - FRAME_H * cs;
        o.tapTop = o.choiceTop - VGAP / 2;                // さわれる四角の上のはし（場面と3台のあいだの まん中）
        // 場面の絵（上の文字の下から、3台の上までの、まん中）
        var areaBottom = o.choiceTop - VGAP;
        o.sceneW = SCENE_W * ss;
        o.sceneH = SCENE_H * ss;
        o.sceneLeft = (W - o.sceneW) / 2;
        o.sceneTop = (top + areaBottom - o.sceneH) / 2;
        o.groundY = o.sceneTop + SCENE_GROUND * ss;       // 場面の地面（タイヤの下）の、画面での高さ
        // 道の上のはし：場面の下のはしと、選ぶくるまの枠の上のはしの、まん中
        o.roadTop = (o.sceneTop + o.sceneH + o.choiceTop) / 2;
        return o;
      }
      // 左から i 番目の台の止まる場所（横の箱の左のはし。画面の左端から）
      function stopX(i) {
        return SIDE + L.slotW * i;
      }
      // 場面の中で、正解のくるまが止まる場所（横の箱の左のはし）
      function spotX() {
        var cx = SPOT_LEFT;
        if (sceneObj && SCENE_BY_ID[sceneObj.id].spot === "right") cx = SPOT_RIGHT;
        return L.sceneLeft + cx * L.ss - L.slotW / 2;
      }

      // 背景（道）と、場面の箱・右へのびる細い道に、並べ方を書く
      function applyBackground() {
        body.style.setProperty("--road-top", L.roadTop + "px");
      }
      function applyScene() {
        if (sceneObj) {
          var e = sceneObj.el.style;
          e.left = L.sceneLeft + "px";
          e.top = L.sceneTop + "px";
          e.width = L.sceneW + "px";
          e.height = L.sceneH + "px";
          e.borderRadius = (16 * L.ss) + "px";
        }
        // 細い道：場面の絵のまん中あたり（場面の箱の下になる）から、画面の右の外まで
        var left = L.sceneLeft + L.sceneW / 2;
        sceneRoad.style.left = left + "px";
        sceneRoad.style.top = (L.sceneTop + 246 * L.ss) + "px";
        sceneRoad.style.width = Math.max(0, L.W + 20 - left) + "px";
        sceneRoad.style.height = (14 * L.ss) + "px";
      }

      // 場面の絵を作る（まだ画面に並べない）
      function makeScene(id) {
        sceneCount++;
        var el = document.createElement("div");
        el.id = "scene";
        el.className = "scene";
        el.setAttribute("data-help", "before");
        el.innerHTML = '<svg class="scene-svg" viewBox="0 0 ' + SCENE_W + ' ' + SCENE_H + '" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">' +
          SCENE_BY_ID[id].draw("sc" + sceneCount + "-") + '</svg>';
        return { id: id, el: el, svg: el.firstElementChild };
      }
      function removeScene() {
        clearTimeout(sceneOutTimer);
        if (sceneObj && sceneObj.el.parentNode) sceneObj.el.parentNode.removeChild(sceneObj.el);
        sceneObj = null;
      }

      // 大きさの箱（枠）の率
      function setFrameScale(frame, s) {
        frame.style.transform = "scale(" + s + ")";
      }

      // ===== 選ぶくるま1台を作る =====
      function makeChoice(id, isCorrect) {
        var car = K.cars.create(id);
        car.el.style.left = ((FRAME_W - car.width) / 2) + "px";     // 枠の横のまん中

        var el = document.createElement("div");           // 横の箱（さわれる四角）
        el.className = "choice";
        el.setAttribute("data-car", id);
        el.setAttribute("data-correct", isCorrect ? "true" : "false");
        var v = document.createElement("div");            // 縦の箱
        v.className = "choice-v";
        var frame = document.createElement("div");        // 大きさの箱
        frame.className = "car-frame";
        var hop = document.createElement("div");          // はねる箱
        hop.className = "kuruma-hop";
        var tilt = document.createElement("div");         // 首をかしげる箱
        tilt.className = "kuruma-tilt";

        tilt.appendChild(car.el);
        hop.appendChild(tilt);
        frame.appendChild(hop);
        v.appendChild(frame);
        el.appendChild(v);

        return {
          id: id,
          correct: isCorrect,
          car: car,
          el: el,
          v: v,
          frame: frame,
          hop: hop,
          tilt: tilt,
          mover: K.stage.mover(el),
          hopper: K.stage.hopper(hop)
        };
      }
      // 横の箱の大きさと、枠の置き場所（枠は、箱の横のまん中・下から BOTTOM）
      function applyChoiceBox(ch) {
        ch.el.style.top = L.tapTop + "px";
        ch.el.style.width = L.slotW + "px";
        ch.el.style.height = (L.H - L.tapTop) + "px";
        ch.frame.style.left = ((L.slotW - FRAME_W) / 2) + "px";
        ch.frame.style.bottom = BOTTOM + "px";
      }

      function hopEls() {
        var list = [];
        for (var i = 0; i < choices.length; i++) list.push(choices[i].hop);
        return list;
      }
      function correctChoice() {
        for (var i = 0; i < choices.length; i++) {
          if (choices[i].correct) return choices[i];
        }
        return null;
      }
      function findChoice(el) {
        for (var i = 0; i < choices.length; i++) {
          if (choices[i].el === el) return choices[i];
        }
        return null;
      }

      // 古い絵（3台。場面も）を、ページから外す（何問しても、要素がふえつづけないように）
      function removeStage() {
        for (var i = 0; i < choices.length; i++) {
          if (choices[i].el.parentNode) choices[i].el.parentNode.removeChild(choices[i].el);
        }
        choices = [];
        winner = null;
        hint = null;      // 指マークは1問目の正解の中にあるので、いっしょに消える
        removeScene();
      }

      // 新しい問題の、場面と3台を作って並べる（3台の場所は まだ動かさない）
      function buildStage(q) {
        removeStage();
        qIndex++;
        L = computeLayout();                // 今の画面の大きさで、率・止まる場所を計算し直す
        applyBackground();

        sceneObj = makeScene(q["case"]);
        document.body.insertBefore(sceneObj.el, field);    // 場面の箱は、選ぶ3台の入れ物より前
        applyScene();

        for (var i = 0; i < 3; i++) {
          var ch = makeChoice(q.slotIds[i], q.slotIds[i] === q.answer);
          field.appendChild(ch.el);
          applyChoiceBox(ch);
          setFrameScale(ch.frame, L.cs);
          choices.push(ch);
        }
        wrongCount = 0;
        autoNudged = false;
        body.setAttribute("data-case", q["case"]);
        body.setAttribute("data-answer", q.answer);
        body.setAttribute("data-hint", "off");
      }

      // ===== ask のあいだの並べ直し（画面の大きさ・回転が変わったとき） =====
      function refit() {
        if (!sceneObj || choices.length === 0) return;
        L = computeLayout();
        applyBackground();
        applyScene();
        for (var i = 0; i < choices.length; i++) {
          applyChoiceBox(choices[i]);
          setFrameScale(choices[i].frame, L.cs);
          choices[i].mover.moveTo(stopX(i), 0);
        }
        placeHint();
      }

      // =====================================================
      // 指マーク（1問目の正解のくるまの屋根の上）
      // =====================================================
      var hintTimer = K.touch.hintTimer(function () {
        // 1問目の ask のあいだだけ、5秒さわらなかったら また出す
        if (scene === "ask" && qIndex === 0 && hint) {
          placeHint();
          K.touch.showHint(hint);
        }
      });

      // 指先を、図鑑に書いた場所（屋根の上）に置く。上の文字・2つの大人用ボタン・場面の絵の箱・
      // 場面の右へのびる細い道に重なるときは、共通の部品の計算で、小さくする・下げる。
      // 横の箱（.choice）の中での場所：横 ＝ 箱のまん中 ＋ (tip.x − 絵の横幅の半分) × cs、下から ＝ BOTTOM ＋ (220 − tip.y) × cs
      function placeHint() {
        if (!hint || !L || !sceneObj) return;
        var ch = correctChoice();
        if (!ch) return;
        var car = ch.car;
        var cs = L.cs;
        var fromBottom = BOTTOM + (car.height - car.tip.y) * cs;
        var inBoxX = L.slotW / 2 + (car.tip.x - car.width / 2) * cs;
        var tipX = ch.mover.x + inBoxX;          // 指先（画面の左から。動いている途中なら行き先）
        var tipY = L.H - fromBottom;             // 指先（画面の上から）
        var fit = K.touch.hintFit(tipX, tipY, [message, homeBtn, muteBtn, sceneObj.el, sceneRoad]);
        hint.style.setProperty("--hs", fit.scale);
        hint.style.left = (inBoxX - K.touch.HINT_TIP_X * fit.scale) + "px";
        hint.style.bottom = (fromBottom - fit.drop) + "px";
      }

      // =====================================================
      // 「えらんでね」（2問目から。8秒さわらないと、1問に1回だけ）
      // =====================================================
      function restartNudgeTimer() {
        clearTimeout(nudgeTimer);
        if (qIndex === 0 || autoNudged) return;      // 1問目は指マーク。自動の1回を出したあとは、くり返さない
        nudgeTimer = setTimeout(function () {
          if (scene !== "ask" || autoNudged) return;
          if (reduced()) return;                     // 動きを減らす設定：さわっていないのに動くものは出さない
          autoNudged = true;
          C.nudge(hopEls());
        }, NUDGE_TIME);
      }

      // =====================================================
      // 画面のどこかに指がふれた瞬間
      // （大人用のボタンへのタッチと、2本目からの指は、共通の部品が はぶいてくれる）
      // =====================================================
      K.touch.onTap(function (e) {
        // さわったので、指マークを消す（どの場面のタッチも）
        if (hint) {
          K.touch.hideHint(hint);
          hintTimer.stop();
        }

        // 動いているあいだ：選べない。「プッ」と鳴らして、動いているくるまが ぴょんとはねるだけ。
        // 移動やタイマーには さわらない（止まる場所・時刻が変わらないように）
        if (scene !== "ask") {
          K.sound.playHorn();
          if (scene === "enter") {
            for (var i = 0; i < choices.length; i++) choices[i].hopper.hop();
          } else if (winner) {
            winner.hopper.hop();          // correct・leave：正解のくるま
          }
          return;
        }

        var box = e.target && e.target.closest ? e.target.closest(".choice") : null;
        var ch = box ? findChoice(box) : null;

        if (!ch) {
          // くるま以外（場面の絵・空）：3台が左から順に、小さくはねる（音なし。選んだことにも、まちがいにもならない）
          C.nudge(hopEls());
          afterTouch();
          return;
        }

        C.stopNudge(hopEls());            // 残っている えらんでね の印を外す

        if (ch.correct) {
          onCorrect(ch);
          return;
        }

        // ちがうくるま：首をかしげて「ぽよん」。2回まちがえたら、正解が ふわっと光る（場面の絵は変えない）
        var counted = C.wrong(ch.tilt);
        if (counted) {
          wrongCount++;
          if (wrongCount >= C.HINT_AFTER) {
            var right = correctChoice();
            C.glow(right.frame, right.car.width);
            body.setAttribute("data-hint", "glow");
          }
        }
        afterTouch();
      });

      // ask で さわったあと：指マーク・えらんでね の数え直し
      function afterTouch() {
        if (qIndex === 0 && hint) hintTimer.restart();
        restartNudgeTimer();
      }

      // =====================================================
      // 正しいくるまを さわったとき：走っていく → 仕事 → 場面が にっこり → 走りさる → 次の問題
      //   正解を さわった時刻を 0 として：
      //   0秒 ピポピン♪・上の文字が名前に ／ 0〜0.9秒 場面へ走っていく ／ 0.9秒 仕事
      //   1.2秒 場面が にっこり・紙ふぶき ／ 2.4秒 leave（走りさる）／ 3.9秒 enter ／ 5.4秒 ask
      // =====================================================
      function onCorrect(ch) {
        winner = ch;
        setScene("correct");
        clearTimeout(nudgeTimer);
        hintTimer.stop();
        C.clearGlow(ch.frame);            // 「そっと教える光」が、場面の中までついてこないように消す

        K.sound.playCorrect();            // 「ピポピン♪」（紙ふぶきは、にっこりのときに別に出す）
        ch.el.classList.add("drive");     // 場面より手前に出す
        showNameMessage(K.cars.get(ch.id).name);   // 上の文字を、くるまの名前に（図鑑の名前）

        // 地面の影は、走り始めに見えなくして、戻さない（場面の地面に別の影は描かない）
        var sh = ch.car.el.querySelector('[data-part="shadow"]');
        if (sh) {
          sh.style.transition = "opacity 150ms linear";
          sh.style.opacity = "0";
        }

        // 行き先：枠の下のはしが、場面の地面（y 250）の 5 × ins 下に来る → タイヤの下が、ちょうど地面にのる
        var targetX = spotX();
        var dy = L.groundY + TIRE_GAP * L.ins - L.choiceBottom;     // 場面は上にあるので、マイナスの値
        var ins = L.ins;
        if (!reduced()) {
          // 横（横の箱。タイヤが回る）・縦（縦の箱。道をのぼる）・大きさ（大きさの箱）を、同時に動かす
          ch.mover.moveTo(targetX, DRIVE_IN);
          ch.v.style.transition = "transform " + DRIVE_IN + "ms cubic-bezier(0.4, 0.1, 0.4, 1)";
          ch.v.style.transform = "translateY(" + dy + "px)";
          ch.frame.style.transition = "transform " + DRIVE_IN + "ms ease-in-out";
          setFrameScale(ch.frame, ins);
        } else {
          // 動きを減らす設定：走らず、その場で ふわっと消えて、見えないうちに場面の止まる場所へ移り、ふわっと出る
          ch.v.style.transition = "opacity " + REDUCED_FADE + "ms ease";
          ch.v.style.opacity = "0";
          setTimeout(function () {
            ch.mover.moveTo(targetX, 0);
            ch.v.style.transition = "none";
            ch.v.style.transform = "translateY(" + dy + "px)";
            ch.frame.style.transition = "none";
            setFrameScale(ch.frame, ins);
            void ch.v.offsetWidth;
            ch.v.style.transition = "opacity " + REDUCED_FADE + "ms ease";
            ch.v.style.opacity = "1";
          }, REDUCED_FADE);
        }

        // 着いたら、仕事の動きを1回と、仕事の音
        setTimeout(function () {
          ch.car.work();
          ch.car.sound();
        }, DRIVE_IN);

        // 仕事を始めて少したったら、場面が にっこりになる（before が消えて after が出る）。紙ふぶきも、ここで
        setTimeout(function () {
          if (sceneObj) {
            sceneObj.svg.classList.add("helped");
            sceneObj.el.setAttribute("data-help", "after");
          }
          K.stage.confetti();
        }, DRIVE_IN + HELP_DELAY);

        // 仕事を始めてから 1.5秒で、走りさる（どのくるまも同じ）
        setTimeout(leave, DRIVE_IN + HELP_HOLD);
      }

      // ===== 走りさる：正解のくるまは、場面の地面の高さのまま、右の外へ。ほかの2台は ふわっと消える =====
      function leave() {
        setScene("leave");

        for (var i = 0; i < choices.length; i++) {
          var o = choices[i];
          if (o === winner) continue;
          o.v.style.transition = "opacity " + OTHER_FADE + "ms ease, transform " + OTHER_FADE + "ms ease";
          o.v.style.opacity = "0";
          if (!reduced()) o.v.style.transform = "translateY(" + OTHER_SINK + "px)";   // 動きを減らす設定では、沈まず、うすくなるだけ
        }

        var time;       // 走る時間
        var hold;       // leave の長さ（このあと enter になる）
        if (!reduced()) {
          // 1歩の長さ：画面の横幅 ÷ 6（最低 40px）。走る時間は、距離に合わせる（最長 1.5秒）
          var step = Math.max(MIN_STEP, window.innerWidth / STEP_DIV);
          // 場面の中の大きさ（ins）のくるまの絵の左のはしも、画面の外に出るところまで
          var leaveX = K.stage.exitX() + Math.max(0, (FRAME_W * L.ins - L.slotW) / 2);
          time = Math.min(LEAVE_HOLD, Math.max(MIN_LEAVE_TIME, K.stage.timeFor(Math.max(1, leaveX - winner.mover.x), step)));
          winner.mover.moveTo(leaveX, time);     // 縦の箱・大きさの箱は そのまま（宙を走らず、場面の地面の高さ）
          hold = LEAVE_HOLD;
          // 前の場面は、leave の終わりの 0.3秒で ふわっと消える
          clearTimeout(sceneOutTimer);
          sceneOutTimer = setTimeout(function () {
            if (!sceneObj) return;
            sceneObj.el.style.transition = "opacity " + SCENE_OUT + "ms ease";
            sceneObj.el.style.opacity = "0";
          }, hold - SCENE_OUT);
        } else {
          // 動きを減らす設定：走らず、その場で ふわっと消える。前の場面は、次に移るときに すぐ外す
          time = REDUCED_LEAVE;
          hold = REDUCED_LEAVE;
          winner.v.style.transition = "opacity " + REDUCED_LEAVE + "ms ease";
          winner.v.style.opacity = "0";
        }
        K.sound.playDrive(time / 1000);          // 「ブーーン」（走る時間に合わせる）
        startFadeOutMessage(hold);               // 名前を、走りさりの終わりに合わせて消す

        setTimeout(startEnter, hold);
      }

      // ===== 次の問題：新しい場面が ふわっと出て、新しい3台が左から入ってくる =====
      function startEnter() {
        var q = quiz.next();
        showTitleMessage();             // 上の文字を「どの くるまが いく？」に戻す（新しい3台が入ってくる前）
        buildStage(q);                  // 前の場面と古い3台を外して、今の画面の大きさで作り直す
        setScene("enter");

        // 新しい場面が ふわっと出る
        sceneObj.el.style.opacity = "0";
        void sceneObj.el.offsetWidth;
        sceneObj.el.style.transition = "opacity " + SCENE_IN + "ms ease";
        sceneObj.el.style.opacity = "1";

        var i;
        if (!reduced()) {
          // 3台は、止まる場所の並びのまま（列になって）、同じ距離だけ左の外から出発する
          var D = stopX(2) - K.stage.enterX(L.slotW);
          for (i = 0; i < 3; i++) choices[i].mover.moveTo(stopX(i) - D, 0);
          // 右の台から順に、0.15秒ずつずらして走りだす（うしろの台が前の台に追いつかないように）
          choices.forEach(function (c, idx) {
            var delay = (2 - idx) * ENTER_STAGGER;
            if (delay === 0) c.mover.moveTo(stopX(idx), ENTER_TIME);
            else setTimeout(function () { c.mover.moveTo(stopX(idx), ENTER_TIME); }, delay);
          });
          setTimeout(toAsk, ENTER_TOTAL);
        } else {
          // 動きを減らす設定：走らず、止まる場所に ふわっと出る
          for (i = 0; i < 3; i++) {
            choices[i].mover.moveTo(stopX(i), 0);
            choices[i].v.style.opacity = "0";
          }
          void field.offsetWidth;
          for (i = 0; i < 3; i++) {
            choices[i].v.style.transition = "opacity " + SCENE_IN + "ms ease";
            choices[i].v.style.opacity = "1";
          }
          setTimeout(toAsk, SCENE_IN);
        }
      }

      // 入ってきて止まったら、選べる。音は鳴らさない（正解の音と まぎらわしいため）。
      // 入ってくるあいだに画面の大きさが変わっていたら、ここで並べ直す
      function toAsk() {
        setScene("ask");
        refit();
        restartNudgeTimer();
      }

      // =====================================================
      // 画面の大きさ・回転が変わったとき
      // ask のときだけ並べ直す（correct・leave・enter のあいだは、場面もタイマーも作り直さない）
      // =====================================================
      K.touch.onViewportChange(function () {
        if (scene === "ask") refit();
      });
      window.addEventListener("load", function () {
        if (scene === "ask") refit();
      });

      // =====================================================
      // 大人用のボタン
      // =====================================================
      // 音を消す・出すを切りかえたら、ボタンの大きさ（52px ↔ 64px）が変わるので、指マークの場所を計算し直す。
      // 押しているあいだの拡大が戻りきった 0.25秒あとにも、もう一度計算する
      K.touch.setupMuteButton(muteBtn, function () {
        if (scene === "ask") placeHint();
        setTimeout(function () {
          if (scene === "ask") placeHint();
        }, 250);
      });
      K.touch.setupHomeButton(homeBtn, HOME_URL);

      // =====================================================
      // 最初の準備：1問目は、もう並んでいる形で始める（入ってくる動きはしない）
      // =====================================================
      buildStage(quiz.next());
      for (var n = 0; n < 3; n++) choices[n].mover.moveTo(stopX(n), 0);
      setScene("ask");

      // 指マーク：1問目の正解のくるまの屋根の上。ページを開いたときは出ている
      hint = K.touch.createHint();
      correctChoice().el.appendChild(hint);
      placeHint();
      K.touch.showHint(hint);
    })();
  </script>

</body>
</html>
